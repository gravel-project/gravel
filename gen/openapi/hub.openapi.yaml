          description: |-
            The member the owner nominated to take the hub over (#197), their name, and until when they
             may accept; set only for the owner and the nominee, unset when there is no nomination.
        pendingOwnerName:
          type: string
          title: pending_owner_name
        pendingOwnerExpiresAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: pending_owner_expires_at
      title: Organization
      additionalProperties: false
      description: |-
        Organization is the single tenant a hub serves. Every top-level object carries an organization
         (the seam for a second tenant later); there is exactly one built-in organization today.
    gravel.hub.v1.OrganizationSettings:
      type: object
      properties:
        version:
          type: integer
          title: version
          format: int32
        theme:
          allOf:
            - $ref: '#/components/schemas/gravel.hub.v1.Theme'
          title: theme
        nav:
          type: array
          items:
            $ref: '#/components/schemas/gravel.hub.v1.NavLink'
          title: nav
        updatedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: updated_at
          description: When the settings were last written; unset while the defaults apply.
        discord:
          allOf:
            - $ref: '#/components/schemas/gravel.hub.v1.DiscordSettings'
          title: discord
        stats:
          allOf:
            - $ref: '#/components/schemas/gravel.hub.v1.StatsSettings'
          title: stats
        games:
          type: object
          title: games
          additionalProperties:
            allOf:
              - $ref: '#/components/schemas/gravel.hub.v1.GameSettings'
            title: value
          description: Per-game settings by game id; at most 20, each a game this hub ships.
        localAccounts:
          allOf:
            - $ref: '#/components/schemas/gravel.hub.v1.LocalAccountsSettings'
          title: local_accounts
        events:
          allOf:
            - $ref: '#/components/schemas/gravel.hub.v1.EventsSettings'
          title: events
        notifiers:
          type: array
          items:
            $ref: '#/components/schemas/gravel.hub.v1.Notifier'
          title: notifiers
          description: |-
            The notifiers, at most 20 (ADR-0028 §5). GetOrganizationSettings returns them only to a
             caller who may change the settings; to anyone else the list is empty.
      title: OrganizationSettings
      additionalProperties: false
      description: |-
        OrganizationSettings is the Organization settings resource: every host-configurable knob in
         one document (theme and navigation, the Discord role mapping; token lifetimes and layout
         overrides join it with their features). Version is the document format.
    gravel.hub.v1.ParticipationEntry:
      type: object
      properties:
        rank:
          type: integer
          title: rank
          format: int32
        name:
          type: string
          title: name
        pseudonymous:
          type: boolean
          title: pseudonymous
        userId:
          type: string
          title: user_id
          description: The member, when shown by name.
        events:
          type: integer
          title: events
          format: int32
          description: How many times they took part, and for how long in all.
        seconds:
          type: integer
          title: seconds
          format: int32
      title: ParticipationEntry
      additionalProperties: false
      description: ParticipationEntry is one player on a participation board, named as on GetBoard.
    gravel.hub.v1.ParticipationEvent:
      type: object
      properties:
        key:
          type: string
          title: key
          description: |-
            The app's idempotency key: 1 to 128 printable ASCII characters, unique per app. An event
             sent again with a key the app used before is a duplicate and is not stored again, even when
             its other fields differ.
        kind:
          type: string
          title: kind
          description: |-
            What the player did, as the app names it: a lower-case letter, then up to 31 lower-case
             letters, digits or underscores ("seeding", "attendance").
        identity:
          allOf:
            - $ref: '#/components/schemas/gravel.hub.v1.PlayerIdentity'
          title: identity
        gameId:
          type: string
          title: game_id
          description: |-
            A game this hub ships, optional. With server_id, it must be that server's game; with only
             server_id, the server's game is stored.
        serverId:
          type: string
          title: server_id
          description: A server the hub knows, optional.
        session:
          type: string
          title: session
          description: The app's own reference for the session or event, at most 128 characters, optional.
        occurredAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: occurred_at
          description: |-
            When it happened: required, at most 5 minutes ahead of the hub's clock, and not older than
             the stats store keeps raw rows (the Organization settings' stats.raw_retention_months).
        durationSeconds:
          type: integer
          title: duration_seconds
          format: int32
          description: How long it lasted, 0 to 86400.
        schemaVersion:
          type: integer
          title: schema_version
          format: int32
          description: 'The event''s schema version: 0 (the current one) or 1.'
      title: ParticipationEvent
      additionalProperties: false
      description: |-
        ParticipationEvent is one time a player took part in something a first-party app tracks
         (ADR-0014): a seeding session, an event they attended. It feeds participation boards and
         profiles only, never a combat board.
    gravel.hub.v1.ParticipationResult:
      type: object
      properties:
        key:
          type: string
          title: key
        outcome:
          type: string
          title: outcome
          description: '"recorded", or "duplicate" when the app sent the key before.'
      title: ParticipationResult
      additionalProperties: false
      description: ParticipationResult is what became of one event.
    gravel.hub.v1.ParticipationTotals:
      type: object
      properties:
        window:
          type: string
          title: window
        season:
          type: string
          title: season
        from:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: from
        to:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: to
        kind:
          type: string
          title: kind
        events:
          type: integer
          title: events
          format: int32
        seconds:
          type: integer
          title: seconds
          format: int32
      title: ParticipationTotals
      additionalProperties: false
      description: |-
        ParticipationTotals is a member's participation of one kind over one window: "all", "week",
         "month", or "season" with season naming one running now. from and to are unset for all time.
    gravel.hub.v1.PasswordLink:
      type: object
      properties:
        url:
          type: string
          title: url
          description: |-
            The link to hand to the member: auth.base_url + /auth/local/reset/<token>, or only the path
             when the hub has no base_url.
        purpose:
          type: string
          title: purpose
          description: '"set" (a new account''s first password) or "reset".'
        expiresAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: expires_at
          description: A link works once, for an hour.
      title: PasswordLink
      additionalProperties: false
      description: |-
        PasswordLink is a one-time link that sets a local account's password (ADR-0026, gravel#187).
         It is shown once: the hub keeps only a hash of it.
    gravel.hub.v1.PlanServerConfigRequest:
      type: object
      properties:
        serverId:
          type: string
          title: server_id
        text:
          type: string
          title: text
          description: |-
            The deployment's document: secrets redacted, the sections and keys the hub owns left out
             (War Dogs: the RCON and feed sections, DefaultBannedPlayerIds).
      title: PlanServerConfigRequest
      additionalProperties: false
    gravel.hub.v1.PlanServerConfigResponse:
      type: object
      properties:
        revision:
          type: string
          title: revision
          description: The server's revision the plan was made against; ApplyServerConfig needs it.
        changes:
          type: array
          items:
            $ref: '#/components/schemas/gravel.hub.v1.ConfigChange'
          title: changes
        result:
          allOf:
            - $ref: '#/components/schemas/gravel.hub.v1.ConfigResult'
          title: result
          description: The server's validation; not ok means applying would be refused.
      title: PlanServerConfigResponse
      additionalProperties: false
    gravel.hub.v1.PlayerIdentity:
      type: object
      properties:
        provider:
          type: string
          title: provider
          description: '"discord" or "steam".'
        subject:
          type: string
          title: subject
          description: 'The stable id at the provider: a Discord user id, a SteamID64.'
      title: PlayerIdentity
      additionalProperties: false
      description: |-
        PlayerIdentity is a player at an identity provider, as the stats store keys them (never a
         member id: an identity is resolved to a member only when a board or profile is read).
    gravel.hub.v1.PlayerMatch:
      type: object
      properties:
        matchId:
          type: string
          title: match_id
        serverId:
          type: string
          title: server_id
        serverName:
          type: string
          title: server_name
        startedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: started_at
        endedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: ended_at
          description: Unset while the match is open.
        map:
          type: string
          title: map
        kills:
          type: integer
          title: kills
          format: int32
        deaths:
          type: integer
          title: deaths
          format: int32
        secondsOn:
          type: integer
          title: seconds_on
          format: int32
      title: PlayerMatch
      additionalProperties: false
      description: PlayerMatch is one match a member played, with their row in it.
    gravel.hub.v1.PrepareAuthorizationRequest:
      type: object
      properties:
        params:
          allOf:
            - $ref: '#/components/schemas/gravel.hub.v1.AuthorizationParams'
          title: params
      title: PrepareAuthorizationRequest
      additionalProperties: false
    gravel.hub.v1.PrepareAuthorizationResponse:
      type: object
      properties:
        appName:
          type: string
          title: app_name
        clientId:
          type: string
          title: client_id
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/gravel.hub.v1.ScopeInfo'
          title: scopes
          description: The scopes asked for, each with its description.
        consentRequired:
          type: boolean
          title: consent_required
          description: |-
            Whether the member must be asked: true without a session, or when no remembered grant
             covers the scopes.
        error:
          type: string
          title: error
          description: |-
            Set when the client and the redirect URI are good but the rest of the request is not: the
             RFC 6749 error code to send back to the redirect URI ("invalid_request",
             "unsupported_response_type", "invalid_scope") and a description.
        errorDescription:
          type: string
          title: error_description
      title: PrepareAuthorizationResponse
      additionalProperties: false
    gravel.hub.v1.ProfileTotals:
      type: object
      properties:
        window:
          type: string
          title: window
        season:
          type: string
          title: season
        from:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: from
        to:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: to
        kills:
          type: integer
          title: kills
          format: int32
        deaths:
          type: integer
          title: deaths
          format: int32
        kd:
          type: number
          title: kd
          format: double
        secondsOn:
          type: integer
          title: seconds_on
          format: int32
        matches:
          type: integer
          title: matches
          format: int32
      title: ProfileTotals
      additionalProperties: false
      description: |-
        ProfileTotals is a member's totals over one window: "all", "week", "month", or "season" with
         season naming one running now. from and to are unset for all time.
    gravel.hub.v1.QueryRangeRequest:
      type: object
      properties:
        dashboardUid:
          type: string
          title: dashboard_uid
        panelId:
          type: string
          title: panel_id
        start:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: start
        end:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: end
        step:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Duration'
          title: step
          description: |-
            The resolution; at least 15s, and at most 11,000 points across the range (the hub widens a
             finer step). The range is at most 30 days.
      title: QueryRangeRequest
      additionalProperties: false
    gravel.hub.v1.QueryRangeResponse:
      type: object
      properties:
        series:
          type: array
          items:
            $ref: '#/components/schemas/gravel.hub.v1.MetricsSeries'
          title: series
        step:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Duration'
          title: step
          description: The step the hub used, after widening.
      title: QueryRangeResponse
      additionalProperties: false
    gravel.hub.v1.QuietRegular:
      type: object
      properties:
        name:
          type: string
          title: name
        pseudonymous:
          type: boolean
          title: pseudonymous
        userId:
          type: string
          title: user_id
          description: The member, when shown by name.
        daysBefore:
          type: integer
          title: days_before
          format: int32
          description: Days they played in the regulars' look-back.
        lastSeen:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: last_seen
        lastServerId:
          type: string
          title: last_server_id
        hours:
          type: number
          title: hours
          format: double
          description: Hours they were on in the look-back.
      title: QuietRegular
      additionalProperties: false
      description: |-
        QuietRegular is a regular before the window with no session in it, shown as a board shows a
         player: a member's name when they chose it, else a pseudonym.
    gravel.hub.v1.RebootServerHostRequest:
      type: object
      properties:
        serverId:
          type: string
          title: server_id
        force:
          type: boolean
          title: force
          description: Reboot with players on (they are warned first, as for a resize).
        reason:
          type: string
          title: reason
        onBehalfOf:
          allOf:
            - $ref: '#/components/schemas/gravel.hub.v1.Actor'
          title: on_behalf_of
          description: Who the caller acts for, for an app (as SetServerHostDesired).
      title: RebootServerHostRequest
      additionalProperties: false
    gravel.hub.v1.RebootServerHostResponse:
      type: object
      properties:
        host:
          allOf:
            - $ref: '#/components/schemas/gravel.hub.v1.ServerHost'
          title: host
        auditId:
          type: string
          title: audit_id
          format: int64
        eventId:
          type: string
          title: event_id
          format: int64
          description: The events log row the request wrote; 0 when it could not be recorded.
      title: RebootServerHostResponse
      additionalProperties: false
    gravel.hub.v1.RecapMatch:
      type: object
      properties:
        id:
          type: string
          title: id
        startedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: started_at
        endedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: ended_at
          description: Unset while the match is on.
        map:
          type: string
          title: map
        teams:
          type: array
          items:
            $ref: '#/components/schemas/gravel.hub.v1.TeamScore'
          title: teams
          description: 'The last team scores the polls saw: the final ones once the match ended.'
        players:
          type: integer
          title: players
          format: int32
          description: The players seen in it during the window.
      title: RecapMatch
      additionalProperties: false
      description: RecapMatch is one match that overlaps a recap's window.
    gravel.hub.v1.RecordParticipationRequest:
      type: object
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/gravel.hub.v1.ParticipationEvent'
          title: events
          description: |-
            1 to 100 events. The request is checked whole first: one invalid event refuses them all,
             and nothing is stored.
      title: RecordParticipationRequest
      additionalProperties: false
    gravel.hub.v1.RecordParticipationResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/gravel.hub.v1.ParticipationResult'
          title: results
          description: One per event, in the request's order.
      title: RecordParticipationResponse
      additionalProperties: false
    gravel.hub.v1.ReleaseServerLeaseRequest:
      type: object
      properties:
        leaseId:
          type: string
          title: lease_id
        reason:
          type: string
          title: reason
        onBehalfOf:
          allOf:
            - $ref: '#/components/schemas/gravel.hub.v1.Actor'
          title: on_behalf_of
      title: ReleaseServerLeaseRequest
      additionalProperties: false
    gravel.hub.v1.ReleaseServerLeaseResponse:
      type: object
      properties:
        lease:
          allOf:
            - $ref: '#/components/schemas/gravel.hub.v1.ServerLease'
          title: lease
        eventId:
          type: string
          title: event_id
          format: int64
          description: The events log row the release wrote (gravel#202); 0 when it could not be recorded.
      title: ReleaseServerLeaseResponse
      additionalProperties: false
    gravel.hub.v1.RequestServerLeaseRequest:
      type: object
      properties:
        serverId:
          type: string
          title: server_id
          description: 'A server, or a pool of servers: one of them.'
        pool:
          type: string
          title: pool
        holderRef:
          type: string
          title: holder_ref
          description: |-
            The holder's reference (a session id), printable, at most 128 bytes: asking again with it
             answers the live lease, password included.
        expectedPlayers:
          type: integer
          title: expected_players
          format: int32
          description: 'Players to expect: the server is sized for them until the lease ends (#172).'
        settings:
          type: object
          title: settings
          additionalProperties:
            type: string
            title: value
          description: Settings the server's vm.lease.settings allow.
        plugins:
          type: array
          items:
            type: string
          title: plugins
          description: A plugin set the server's game offers ("matchzy"); at most one.
        matchConfig:
          type: string
          title: match_config
          format: byte
          description: A match config in the game's format (MatchZy's JSON), loaded once the plugins are up.
        reason:
          type: string
          title: reason
        onBehalfOf:
          allOf:
            - $ref: '#/components/schemas/gravel.hub.v1.Actor'
          title: on_behalf_of
          description: The moderator an app acts for; unset for an app acting for itself or anyone in person.
      title: RequestServerLeaseRequest
      additionalProperties: false
    gravel.hub.v1.RequestServerLeaseResponse:
      type: object
      properties:
        lease:
          allOf:
            - $ref: '#/components/schemas/gravel.hub.v1.ServerLease'
          title: lease
        join:
          allOf:
            - $ref: '#/components/schemas/gravel.hub.v1.LeaseJoin'
          title: join
      title: RequestServerLeaseResponse
      additionalProperties: false
    gravel.hub.v1.ResizeServerHostRequest:
      type: object
      properties:
        serverId:
          type: string
          title: server_id
        size:
          type: string
          title: size
          description: A size from ServerHost.sizes.
        force:
          type: boolean
          title: force
          description: Resize with players on (they are disconnected for the few minutes it takes).
        reason:
          type: string
          title: reason
        pin:
          type: boolean
          title: pin
          description: |-
            Pin the size: the scaling policy stands aside and an unparked host comes back to it, until
             UnpinServerHostSize. With the size the host is at, it only pins.
      title: ResizeServerHostRequest
      additionalProperties: false
    gravel.hub.v1.ResizeServerHostResponse:
      type: object
      properties:
        host:
          allOf:
            - $ref: '#/components/schemas/gravel.hub.v1.ServerHost'
          title: host
        auditId:
          type: string
          title: audit_id
          format: int64
        eventId:
          type: string
          title: event_id
          format: int64
          description: |-
            The events log row the request wrote (gravel#202), for a client to point at; 0 when it could
             not be recorded.
      title: ResizeServerHostResponse
      additionalProperties: false
    gravel.hub.v1.RevokeAppGrantRequest:
      type: object
      properties:
        clientId:
          type: string
          title: client_id
      title: RevokeAppGrantRequest
      additionalProperties: false
    gravel.hub.v1.RevokeAppGrantResponse:
      type: object
      properties:
        revokedTokens:
          type: integer
          title: revoked_tokens
          format: int32
          description: How many of the member's tokens for the app were revoked.
      title: RevokeAppGrantResponse
      additionalProperties: false
    gravel.hub.v1.RevokeAppRequest:
      type: object
      properties:
        clientId:
          type: string
          title: client_id
      title: RevokeAppRequest
      additionalProperties: false
    gravel.hub.v1.RevokeAppResponse:
      type: object
      title: RevokeAppResponse
      additionalProperties: false
    gravel.hub.v1.RevokeSessionsRequest:
      type: object
      title: RevokeSessionsRequest
      additionalProperties: false
    gravel.hub.v1.RevokeSessionsResponse:
      type: object
      properties:
        revoked:
          type: integer
          title: revoked
          format: int32
          description: How many sessions were ended, the caller's included.
      title: RevokeSessionsResponse
      additionalProperties: false
    gravel.hub.v1.RevokeUserSessionsRequest:
      type: object
      properties:
        userId:
          type: string
          title: user_id
      title: RevokeUserSessionsRequest
      additionalProperties: false
    gravel.hub.v1.RevokeUserSessionsResponse:
      type: object
      properties:
        revoked:
          type: integer
          title: revoked
          format: int32
          description: How many sessions were ended.
      title: RevokeUserSessionsResponse
      additionalProperties: false
    gravel.hub.v1.RoleGrant:
      type: object
      properties:
        userId:
          type: string
          title: user_id
        role:
          type: string
          title: role
          description: '"admin", "operator" or "moderator".'
        gameId:
          type: string
          title: game_id
          description: The game it is for; empty is instance-wide.
        grantedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: granted_at
        grantedByUserId:
          type: string
          title: granted_by_user_id
          description: 'Who granted it: a member, an app, or neither (the migration from ADR-0013''s roles).'
        grantedByAppId:
          type: string
          title: granted_by_app_id
      title: RoleGrant
      additionalProperties: false
      description: RoleGrant is a role a member holds (ADR-0027 §3, §4).
    gravel.hub.v1.ScopeInfo:
      type: object
      properties:
        name:
          type: string
          title: name
          description: 'The scope: "identity:read", "stats:read", …'
        description:
          type: string
          title: description
      title: ScopeInfo
      additionalProperties: false
      description: ScopeInfo is a scope with what it lets an app do as the member, in the member's words.
    gravel.hub.v1.Server:
      type: object
      properties:
        id:
          type: string
          title: id
          description: '"htg-wardogs-1".'
        name:
          type: string
          title: name
        gameId:
          type: string
          title: game_id
        location:
          type: string
          title: location
          description: 'Where it runs: "qonzer-slc".'
        trust:
          type: string
          title: trust
          description: '"official" or "community".'
        status:
          allOf:
            - $ref: '#/components/schemas/gravel.hub.v1.ServerStatus'
          title: status
        driver:
          type: string
          title: driver
          description: |-
            The driver that controls it: "wardogs" (a server the hub reaches), "cloudvm" (one on a VM the
             hub makes, which has a ServerHost).
      title: Server
      additionalProperties: false
      description: |-
        Server is a server a driver controls (ManagedServer), as the public sees it: never its control
         address or where its credential is.
    gravel.hub.v1.ServerHost:
      type: object
      properties:
        serverId:
          type: string
          title: server_id
        location:
          type: string
          title: location
          description: The manifest's location ("do-sfo3"), its cloud ("digitalocean") and region ("sfo3").
        provider:
          type: string
          title: provider
        region:
          type: string
          title: region
        desired:
          type: string
          title: desired
          description: '"running", "parked" or "absent" (destroyed).'
        state:
          type: string
          title: state
          description: |-
            "absent", "creating", "booting", "starting", "running", "parking", "parked", "resizing",
             "rebooting" or "destroying". running and parked are where a host rests; the others are transitions.
        step:
          type: string
          title: step
          description: The step within a transition ("volume", "instance", "env", "game"); "" when settled.
        errorCode:
          type: string
          title: error_code
          description: |-
            A word while a step keeps failing ("cloud_failed", "boot_timeout", "install_timeout",
             "ssh_host_key_changed", …); "" otherwise. The cause is in the hub's log.
        attempts:
          type: integer
          title: attempts
          format: int32
        since:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: since
          description: When the host entered its state.
        size:
          type: string
          title: size
          description: The size it runs at ("c-2") and the one a resize is moving it to ("" for none).
        targetSize:
          type: string
          title: target_size
        diskGib:
          type: integer
          title: disk_gib
          format: int32
        volumeGib:
          type: integer
          title: volume_gib
          format: int32
        address:
          type: string
          title: address
          description: The address players join; "" while it has none.
        addressReserved:
          type: boolean
          title: address_reserved
          description: 'The address is reserved: it survives a park and a resize.'
        hourlyPriceUsd:
          type: number
          title: hourly_price_usd
          format: double
          description: |-
            The price of the size, per hour, in US dollars; this month's running time and the instance's
             cost so far (the volume and the reserved address bill on top).
        runningSecondsMonth:
          type: string
          title: running_seconds_month
          format: int64
        monthCostUsd:
          type: number
          title: month_cost_usd
          format: double
        bootSeconds:
          type: integer
          title: boot_seconds
          format: int32
          description: From asking for the instance to its first boot, and to the game answering.
        readySeconds:
          type: integer
          title: ready_seconds
          format: int32
        instanceCreatedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: instance_created_at
        sizes:
          type: array
          items:
            $ref: '#/components/schemas/gravel.hub.v1.HostSize'
          title: sizes
          description: The sizes the host can be resized to now (running hosts only), with their prices.
        parkAfterSeconds:
          type: string
          title: park_after_seconds
          format: int64
          description: A host is parked after the server has been empty this long; 0 never.
        scaling:
          type: boolean
          title: scaling
          description: |-
            The vertical scaling policy (#37): whether the server has one, its ladder (smallest rung
             first, each with its price), and the players the rung the host is on is sized for (0 off the
             ladder or without a policy).
        ladder:
          type: array
          items:
            $ref: '#/components/schemas/gravel.hub.v1.HostTier'
          title: ladder
        tierPlayers:
          type: integer
          title: tier_players
          format: int32
        pinnedSize:
          type: string
          title: pinned_size
          description: |-
            A size the owner pinned: the policy stands aside, and an unparked host comes back to it. ""
             for none.
        pendingSize:
          type: string
          title: pending_size
          description: |-
            The policy's decision waiting for a boundary (a map change, a match's end, an empty server):
             the size, why, and since when. "" for none.
        pendingReason:
          type: string
          title: pending_reason
        pendingSince:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: pending_since
        lastResizeAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: last_resize_at
          description: When the last resize began; the policy's cooldown counts from it.
        expectedPlayers:
          type: integer
          title: expected_players
          format: int32
          description: |-
            The players the host expects until expected_until, and why (#172): the policy reads the larger
             of the live and the expected players as the room, and an empty host isn't parked. 0 and unset
             when it expects nobody, or the time has passed.
        expectedUntil:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: expected_until
        expectedReason:
          type: string
          title: expected_reason
      title: ServerHost
      additionalProperties: false
      description: |-
        ServerHost is the VM a cloud-VM server runs on (ADR-0003): what the hub wants of it, where it is,
         and what it costs.
    gravel.hub.v1.ServerJoin:
      type: object
      properties:
        method:
          type: string
          title: method
          description: |-
            "id": paste value into the game's own server browser (War Dogs: Join by ID); "address":
             value is host:port; "uri": value is a link that launches the game onto the server.
        value:
          type: string
          title: value
        hint:
          type: string
          title: hint
          description: One line saying where the value goes, in the game's terms.
        password:
          type: string
          title: password
          description: |-
            The password players join with, only for an app holding servers:read, and only while the
             server is up, is not leased, and its manifest entry shares it (vm.share_password, #180).
             Never in a public read: an anonymous caller, a member and the web pages get "".
      title: ServerJoin
      additionalProperties: false
      description: |-
        ServerJoin is how a player reaches a server from the game. It is public, what a community
         shares to bring players in, except password, which only an app holding servers:read sees.
    gravel.hub.v1.ServerLease:
      type: object
      properties:
        id:
          type: string
          title: id
        serverId:
          type: string
          title: server_id
        pool:
          type: string
          title: pool
          description: The pool it was asked from; empty when the server was named.
        holderKind:
          type: string
          title: holder_kind
          description: 'Who holds it: "app" (an app''s client id) or "user".'
        holder:
          type: string
          title: holder
        holderRef:
          type: string
          title: holder_ref
          description: 'The holder''s own reference (a session id): one live lease per holder and reference.'
        state:
          type: string
          title: state
          description: |-
            "starting", "ready", "ending" (its match is over, it lasts a few minutes more), "released" or
             "failed".
        reason:
          type: string
          title: reason
          description: Why it ended, or the request's reason while it lasts.
        settings:
          type: object
          title: settings
          additionalProperties:
            type: string
            title: value
        plugins:
          type: array
          items:
            type: string
          title: plugins
        pluginState:
          type: string
          title: plugin_state
          description: '"" while unknown or none was asked, "loaded", or "vanilla" after the set failed to load.'
        pluginReason:
          type: string
          title: plugin_reason
        matchLoaded:
          type: boolean
          title: match_loaded
          description: The match config was loaded on the server.
        expectedPlayers:
          type: integer
          title: expected_players
          format: int32
        createdAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: created_at
        readyAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: ready_at
        endedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: ended_at
        releasedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: released_at
        maxUntil:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: max_until
          description: When it ends at the latest.
        address:
          type: string
          title: address
          description: Where players join (host:port); empty until the server has an address.
      title: ServerLease
      additionalProperties: false
      description: ServerLease is a server taken for a match (gravel#20, ADR-0023).
    gravel.hub.v1.ServerPlayer:
      type: object
      properties:
        name:
          type: string
          title: name
        provider:
          type: string
          title: provider
          description: 'The player''s identity at the game''s provider: ("steam", a SteamID64).'
        subject:
          type: string
          title: subject
        team:
          type: string
          title: team
        kills:
          type: integer
          title: kills
          format: int32
        deaths:
          type: integer
          title: deaths
          format: int32
        pingMs:
          type: integer
          title: ping_ms
          format: int32
        userId:
          type: string
          title: user_id
          description: The member that identity is linked to, resolved now; empty for a player who is not one.
      title: ServerPlayer
      additionalProperties: false
      description: ServerPlayer is one connected player at the last successful poll.
    gravel.hub.v1.ServerStatus:
      type: object
      properties:
        state:
          type: string
          title: state
          description: |-
            "unknown" (not polled yet), "ok", "unreachable", "credential_refused", "credential_missing",
             "rate_limited" or "error"; for a cloud-VM server whose host is not running, "parked" or
             "provisioning" (being made, started, resized or parked). The cause of a failure is in the
             hub's log, never here.
        reachable:
          type: boolean
          title: reachable
          description: False after two failed polls in a row; true again on the next success.
        observedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: observed_at
          description: The last successful poll; unset when there was none. The fields below are from it.
        build:
          type: string
          title: build
          description: The server's build string.
        capabilities:
          type: array
          items:
            type: string
          title: capabilities
          description: |-
            What the server lets the hub do right now: "status", "players", "kick", "ban", … An absent
             capability is shown as not available.
        players:
          type: integer
          title: players
          format: int32
        maxPlayers:
          type: integer
          title: max_players
          format: int32
        map:
          type: string
          title: map
          description: 'The map as the game names it in play (War Dogs: the level, "Ozeti").'
        experiences:
          type: array
          items:
            type: string
          title: experiences
        lighting:
          type: string
          title: lighting
        teams:
          type: array
          items:
            $ref: '#/components/schemas/gravel.hub.v1.TeamScore'
          title: teams
        scoreTick:
          type: integer
          title: score_tick
          format: int32
          description: The score period in force; 0 when the game has none.
        rotationIndex:
          type: integer
          title: rotation_index
          format: int32
          description: The map rotation's position; -1 when unknown.
        nextRotationIndex:
          type: integer
          title: next_rotation_index
          format: int32
        rotationMap:
          type: string
          title: rotation_map
          description: |-
            The rotation's current and next map as the game names them in its rotation and catalog (War
             Dogs: the theatre, "Europe", where map is the level in play); empty when unknown.
        nextRotationMap:
          type: string
          title: next_rotation_map
        join:
          allOf:
            - $ref: '#/components/schemas/gravel.hub.v1.ServerJoin'
          title: join
          description: How a player gets onto the server from the game, when the driver knows; unset otherwise.
      title: ServerStatus
      additionalProperties: false
      description: ServerStatus is the hub's last observation of a server. It carries no personal data.
    gravel.hub.v1.SetBoardNameRequest:
      type: object
      properties:
        showName:
          type: boolean
          title: show_name
          description: Show the member's display name on boards instead of their pseudonym.
      title: SetBoardNameRequest
      additionalProperties: false
    gravel.hub.v1.SetBoardNameResponse:
      type: object
      properties:
        showName:
          type: boolean
          title: show_name
      title: SetBoardNameResponse
      additionalProperties: false
    gravel.hub.v1.SetServerHostDesiredRequest:
      type: object
      properties:
        serverId:
          type: string
          title: server_id
        desired:
          type: string
          title: desired
          description: '"running" (unpark) or "parked" (park).'
        reason:
          type: string
          title: reason
        onBehalfOf:
          allOf:
            - $ref: '#/components/schemas/gravel.hub.v1.Actor'
          title: on_behalf_of
          description: The moderator an app acts for (a bot command); unset for anyone acting in person.
      title: SetServerHostDesiredRequest
      additionalProperties: false
    gravel.hub.v1.SetServerHostDesiredResponse:
      type: object
      properties:
        host:
          allOf:
            - $ref: '#/components/schemas/gravel.hub.v1.ServerHost'
          title: host
        auditId:
          type: string
          title: audit_id
          format: int64
        eventId:
          type: string
          title: event_id
          format: int64
          description: |-
            The events log row the request wrote (gravel#202), for a client to point at; 0 when it could
             not be recorded.
      title: SetServerHostDesiredResponse
      additionalProperties: false
    gravel.hub.v1.SetServerHostExpectationRequest:
      type: object
      properties:
        serverId:
          type: string
          title: server_id
        players:
          type: integer
          title: players
          format: int32
          description: How many players to expect; clamped to the scaling ladder's top. 0 clears the expectation.
        until:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: until
          description: Until when, at most 24 hours ahead; required unless players is 0.
        reason:
          type: string
          title: reason
          description: Why, shown with the decision it causes ("PUG 3 filled"); one line, at most 200 characters.
        onBehalfOf:
          allOf:
            - $ref: '#/components/schemas/gravel.hub.v1.Actor'
          title: on_behalf_of
          description: The moderator an app acts for; unset for an app acting for itself or anyone in person.
      title: SetServerHostExpectationRequest
      additionalProperties: false
    gravel.hub.v1.SetServerHostExpectationResponse:
      type: object
      properties:
        host:
          allOf:
            - $ref: '#/components/schemas/gravel.hub.v1.ServerHost'
          title: host
        auditId:
          type: string
          title: audit_id
          format: int64
        eventId:
          type: string
          title: event_id
          format: int64
          description: |-
            The events log row the request wrote (gravel#202), for a client to point at; 0 when it could
             not be recorded.
      title: SetServerHostExpectationResponse
      additionalProperties: false
    gravel.hub.v1.SetUserRoleRequest:
      type: object
      properties:
        userId:
          type: string
          title: user_id
        role:
          type: string
          title: role
          description: '"admin", "operator" or "moderator".'
        granted:
          type: boolean
          title: granted
          description: true grants the role, false revokes it.
        gameId:
          type: string
          title: game_id
          description: The game the grant is for; empty is instance-wide.
      title: SetUserRoleRequest
      additionalProperties: false
    gravel.hub.v1.SetUserRoleResponse:
      type: object
      properties:
        user:
          allOf:
            - $ref: '#/components/schemas/gravel.hub.v1.User'
          title: user
      title: SetUserRoleResponse
      additionalProperties: false
    gravel.hub.v1.SnapshotServerHostVolumeRequest:
      type: object
      properties:
        serverId:
          type: string
          title: server_id
        name:
          type: string
          title: name
          description: |-
            The snapshot's name; "" is <server>-data-<game>-<build>-<date>. Letters, digits, dots and
             hyphens, at most 64.
        reason:
          type: string
          title: reason
      title: SnapshotServerHostVolumeRequest
      additionalProperties: false
    gravel.hub.v1.SnapshotServerHostVolumeResponse:
      type: object
      properties:
        host:
          allOf:
            - $ref: '#/components/schemas/gravel.hub.v1.ServerHost'
          title: host
        auditId:
          type: string
          title: audit_id
          format: int64
        snapshot:
          allOf:
            - $ref: '#/components/schemas/gravel.hub.v1.VolumeSnapshot'
          title: snapshot
        eventId:
          type: string
          title: event_id
          format: int64
          description: |-
            The events log row the request wrote (gravel#202), for a client to point at; 0 when it could
             not be recorded.
      title: SnapshotServerHostVolumeResponse
      additionalProperties: false
    gravel.hub.v1.StartProofRequest:
      type: object
      properties:
        serverId:
          type: string
          title: server_id
          description: 'The server whose chat the code is typed in: one whose status has the "chat" capability.'
        subject:
          type: string
          title: subject
          description: |-
            An account the caller has linked at the server's game's provider, to prove again; empty to
             link a new one.
      title: StartProofRequest
      additionalProperties: false
    gravel.hub.v1.StartProofResponse:
      type: object
      properties:
        proofId:
          type: string
          title: proof_id
        code:
          type: string
          title: code
          description: The code, shown once ("7K3M-9QXA"); only its hash is kept.
        expiresAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: expires_at
        instructions:
          type: string
          title: instructions
          description: 'What to do with it: "Join the server, then type in chat: !link 7K3M-9QXA".'
        provider:
          type: string
          title: provider
          description: 'The provider the account it proves is at: "steam".'
      title: StartProofResponse
      additionalProperties: false
    gravel.hub.v1.StatExtension:
      type: object
      properties:
        name:
          type: string
          title: name
          description: 'The key in extensions maps: "headshot_kills".'
        label:
          type: string
          title: label
          description: 'The column''s heading: "Headshot kills".'
        type:
          type: string
          title: type
          description: '"int" or "float": how a value is shown.'
        unit:
          type: string
          title: unit
          description: 'Shown beside a value, if any: "HP".'
        aggregate:
          type: string
          title: aggregate
          description: 'How a board totals a player''s maps: "sum", "avg" (per map) or "max".'
      title: StatExtension
      additionalProperties: false
      description: |-
        StatExtension is one of a game's own stats, declarative data from its Game spec (ADR-0033): a
         number each player has on each map of a match result.
    gravel.hub.v1.StatsSeason:
      type: object
      properties:
        name:
          type: string
          title: name
        game:
          type: string
          title: game
        from:
          type: string
          title: from
        to:
          type: string
          title: to
      title: StatsSeason
      additionalProperties: false
      description: |-
        StatsSeason is a named window of matches: from (included) to to (excluded), dates
         ("2026-10-15") in StatsSettings.timezone. An empty game is every game.
    gravel.hub.v1.StatsSettings:
      type: object
      properties:
        public:
          type: boolean
          title: public
          description: Boards and match lists for everyone; off, the owner and apps with stats:read only.
        minMatches:
          type: integer
          title: min_matches
          format: int32
          description: Matches a player needs before a K/D board shows them; 0 is the default, 3.
        timezone:
          type: string
          title: timezone
          description: The IANA zone weeks, months and season dates are in; empty is UTC.
        seasons:
          type: array
          items:
            $ref: '#/components/schemas/gravel.hub.v1.StatsSeason'
          title: seasons
        rawRetentionMonths:
          type: integer
          title: raw_retention_months
          format: int32
          description: |-
            Months a player's per-match rows are kept before they roll up into monthly totals; 0 is the
             default, 13.
      title: StatsSettings
      additionalProperties: false
      description: StatsSettings is how the stats boards behave (ADR-0012).
    gravel.hub.v1.TeamScore:
      type: object
      properties:
        name:
          type: string
          title: name
        color:
          type: string
          title: color
          description: A CSS colour, "#4CB1EF"; empty when the game has none.
        score:
          type: string
          title: score
          format: int64
        players:
          type:
            - integer
            - "null"
          title: players
          format: int32
          description: |-
            The players on the team at the last poll, counted from the server's players. Unset when the
             hub doesn't know: the server's players aren't read, or the game doesn't say who is on which
             team (#159).
      title: TeamScore
      additionalProperties: false
      description: TeamScore is one team's (faction's) score and, when the hub knows it, how many players it has.
    gravel.hub.v1.TestNotifierRequest:
      type: object
      properties:
        name:
          type: string
          title: name
          description: A notifier's name in the settings; a disabled one is tested too.
      title: TestNotifierRequest
      additionalProperties: false
    gravel.hub.v1.TestNotifierResponse:
      type: object
      properties:
        delivered:
          type: boolean
          title: delivered
          description: Whether the notifier delivered the test event.
        error:
          type: string
          title: error
          description: Why it did not, without secrets; empty when it did.
      title: TestNotifierResponse
      additionalProperties: false
    gravel.hub.v1.Theme:
      type: object
      properties:
        light:
          allOf:
            - $ref: '#/components/schemas/gravel.hub.v1.ThemeTokens'
          title: light
        dark:
          allOf:
            - $ref: '#/components/schemas/gravel.hub.v1.ThemeTokens'
          title: dark
        font:
          type: string
          title: font
          description: A CSS font-family list; empty means the system font.
        logoUrl:
          type: string
          title: logo_url
          description: An https URL or a site-relative path, or empty.
        faviconUrl:
          type: string
          title: favicon_url
      title: Theme
      additionalProperties: false
      description: Theme is how the organization's pages look.
    gravel.hub.v1.ThemeTokens:
      type: object
      properties:
        accent:
          type: string
          title: accent
        background:
          type: string
          title: background
        foreground:
          type: string
          title: foreground
        muted:
          type: string
          title: muted
        line:
          type: string
          title: line
        ok:
          type: string
          title: ok
        err:
          type: string
          title: err
      title: ThemeTokens
      additionalProperties: false
      description: ThemeTokens are one colour scheme's colours as CSS colours; an empty token means the default.
    gravel.hub.v1.UnbanPlayerRequest:
      type: object
      properties:
        serverId:
          type: string
          title: server_id
        subject:
          type: string
          title: subject
        reason:
          type: string
          title: reason
          description: Optional; recorded in the audit log.
        onBehalfOf:
          allOf:
            - $ref: '#/components/schemas/gravel.hub.v1.Actor'
          title: on_behalf_of
      title: UnbanPlayerRequest
      additionalProperties: false
    gravel.hub.v1.UnbanPlayerResponse:
      type: object
      properties:
        auditId:
          type: string
          title: audit_id
          format: int64
      title: UnbanPlayerResponse
      additionalProperties: false
    gravel.hub.v1.UnlinkIdentityRequest:
      type: object
      properties:
        provider:
          type: string
          title: provider
        subject:
          type: string
          title: subject
      title: UnlinkIdentityRequest
      additionalProperties: false
    gravel.hub.v1.UnlinkIdentityResponse:
      type: object
      properties:
        user:
          allOf:
            - $ref: '#/components/schemas/gravel.hub.v1.User'
          title: user
          description: The caller, after the unlink.
      title: UnlinkIdentityResponse
      additionalProperties: false
    gravel.hub.v1.UnpinServerHostSizeRequest:
      type: object
      properties:
        serverId:
          type: string
          title: server_id
        reason:
          type: string
          title: reason
      title: UnpinServerHostSizeRequest
      additionalProperties: false
    gravel.hub.v1.UnpinServerHostSizeResponse:
      type: object
      properties:
        host:
          allOf:
            - $ref: '#/components/schemas/gravel.hub.v1.ServerHost'
          title: host
        auditId:
          type: string
          title: audit_id
          format: int64
        eventId:
          type: string
          title: event_id
          format: int64
          description: |-
            The events log row the request wrote (gravel#202), for a client to point at; 0 when it could
             not be recorded.
      title: UnpinServerHostSizeResponse
      additionalProperties: false
    gravel.hub.v1.UpdateOrganizationSettingsRequest:
      type: object
      properties:
        settings:
          allOf:
            - $ref: '#/components/schemas/gravel.hub.v1.OrganizationSettings'
          title: settings
          description: The whole document; omitted tokens mean the default, an omitted nav means no links.
        ifUpdatedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: if_updated_at
          description: |-
            The updated_at the caller read (gravel#205): when set, a document changed since is refused with
             aborted, so two editors don't overwrite each other. Unset writes regardless (ADR-0007 §2).
      title: UpdateOrganizationSettingsRequest
      additionalProperties: false
    gravel.hub.v1.UpdateOrganizationSettingsResponse:
      type: object
      properties:
        settings:
          allOf:
            - $ref: '#/components/schemas/gravel.hub.v1.OrganizationSettings'
          title: settings
      title: UpdateOrganizationSettingsResponse
      additionalProperties: false
    gravel.hub.v1.User:
      type: object
      properties:
        id:
          type: string
          title: id
          description: Stable identifier (UUID).
        displayName:
          type: string
          title: display_name
          description: Display name, taken from the first identity at registration.
        owner:
          type: boolean
          title: owner
          description: Whether this user owns the organization.
        createdAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: created_at
        lastLoginAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: last_login_at
        identities:
          type: array
          items:
            $ref: '#/components/schemas/gravel.hub.v1.Identity'
          title: identities
          description: The linked identities, oldest link first.
        roles:
          type: array
          items:
            type: string
          title: roles
          description: |-
            The member's instance-wide grants by role name, sorted: "admin", "moderator", "operator"
             (ADR-0027). A game-scoped grant is in grants, not here.
        capabilities:
          type: array
          items:
            type: string
          title: capabilities
          description: |-
            The capabilities the member holds in person, as "area:verb" names (ADR-0027): what their
             roles admit, or every capability a person can hold for the owner. A token an app holds for
             the member is narrowed further, to the token's scopes.
        grants:
          type: array
          items:
            $ref: '#/components/schemas/gravel.hub.v1.RoleGrant'
          title: grants
          description: Every grant the member holds, instance-wide (no game_id) or for one game (ADR-0027 §4).
      title: User
      additionalProperties: false
      description: |-
        User is a member: what their linked identities resolve to. Stats are keyed by identity, never
         by this id.
    gravel.hub.v1.VolumeSnapshot:
      type: object
      properties:
        id:
          type: string
          title: id
        name:
          type: string
          title: name
        region:
          type: string
          title: region
        sizeGib:
          type: number
          title: size_gib
          format: double
          description: The data it holds (what it bills by), and the smallest volume made from it.
        minVolumeGib:
          type: integer
          title: min_volume_gib
          format: int32
        createdAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: created_at
      title: VolumeSnapshot
      additionalProperties: false
      description: VolumeSnapshot is a copy of a host's data volume a new server's volume can be made from.
    gravel.hub.v1.WatchServerLeaseRequest:
      type: object
      properties:
        leaseId:
          type: string
          title: lease_id
      title: WatchServerLeaseRequest
      additionalProperties: false
    gravel.hub.v1.WatchServerLeaseResponse:
      type: object
      properties:
        lease:
          allOf:
            - $ref: '#/components/schemas/gravel.hub.v1.ServerLease'
          title: lease
          description: The lease now; unset on a heartbeat.
      title: WatchServerLeaseResponse
      additionalProperties: false
security: []
tags:
  - name: gravel.hub.v1.AppService
    description: |-
      AppService is first-party apps (ADR-0008, ADR-0015): a member's side (the authorization
       endpoint's checks and consent, which the hub's /oauth/authorize page calls, and the apps the
       member allowed) and the operator's (registering and revoking apps, #195). Every procedure but
       PrepareAuthorization needs a session cookie; no bearer token, an app's or a member's, may call
       any of them.
  - name: gravel.hub.v1.ModerationService
    description: |-
      ModerationService acts on the players of a server the hub controls (ADR-0010 §5): the owner, a
       member with the moderator role (ADR-0013), or an app with the servers:moderate scope (a bot),
       whose on_behalf_of, when set, must be the owner or a moderator.
       Every call goes through the server's driver and leaves an audit entry, written before the call,
       so the web and the bot share one log.

       The errors: invalid_argument for a missing or over-long field; not_found for an unknown server,
       a player who is not on it or an unban with no ban; unavailable for a server the hub has not
       reached yet, cannot reach, or that refuses the hub's credential or asks it to wait;
       failed_precondition for an action the server does not offer now (its capabilities).
  - name: gravel.hub.v1.ServerConfigService
    description: |-
      ServerConfigService reads and writes a server's configuration through its driver (ADR-0010
       §6): the owner, or an app with the servers:configure scope. A deployment keeps its document in
       its own repository without what the hub owns; the hub merges the server's secrets and its own
       ban list in, checks the game's bands, has the server validate, and writes only against the
       revision it planned on. An apply leaves an audit entry (action "apply_config").

       The errors: invalid_argument for a document the hub refuses (the problems are in the message);
       aborted for a server whose configuration moved since the plan; failed_precondition for a server
       that does not let the hub read or write its configuration now; unavailable as for moderation.
  - name: gravel.hub.v1.ServerHostService
    description: |-
      ServerHostService looks after the VMs cloud-VM servers run on (ADR-0003). Every write is an
       audit-log row; the host's state machine carries it out, and its transitions name the row.
  - name: gravel.hub.v1.IdentityService
    description: |-
      IdentityService is the logged-in member's account and the lookups role sync needs. Every
       procedure needs a session cookie; login itself is the browser flow under /auth/.
  - name: gravel.hub.v1.ServerLeaseService
    description: |-
      ServerLeaseService takes a leasable server (servers.yaml vm.lease) for a match: with its own
       password, settings, plugin set and match config, started and sized for the players expected, and
       parked and given back after (ADR-0023). An app with servers:lease, the owner or a moderator; an
       app sees and releases only its own leases. Every request and release is an audit-log row.
  - name: gravel.hub.v1.MetricsService
    description: |-
      MetricsService serves the operator dashboards in the hub (ADR-0030, gravel#204): their
       definitions, and their series read from the hub's metrics store, which the hub proxies and never
       keeps. metrics:read.
  - name: gravel.hub.v1.OrganizationService
    description: OrganizationService reads the built-in organization and claims its ownership once.
  - name: gravel.hub.v1.ServerService
    description: |-
      ServerService reads the games and servers the hub controls (ADR-0010). They are applied from a
       deployment's servers.yaml by `gravel-hub servers apply`; the hub polls each server through its
       driver and answers from the last observation, so a caller never reaches a game server.
  - name: gravel.hub.v1.StatsService
    description: first-party apps, on boards of its own (ADR-0014).
