          title: pseudonymous
        userId:
          type: string
          title: user_id
          description: The member, when shown by name.
        kills:
          type: integer
          title: kills
          format: int32
        deaths:
          type: integer
          title: deaths
          format: int32
        kd:
          type: number
          title: kd
          format: double
          description: kills / max(deaths, 1).
        secondsOn:
          type: integer
          title: seconds_on
          format: int32
        matches:
          type: integer
          title: matches
          format: int32
        extensions:
          type: object
          title: extensions
          additionalProperties:
            type: number
            title: value
            format: double
          description: |-
            The game's own stats over the window (ADR-0033) by name, totalled as each one's aggregate
