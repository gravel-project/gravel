        players:
          type: integer
          title: players
          format: int32
        newPlayers:
          type: integer
          title: new_players
          format: int32
          description: Players whose first session was that week.
      title: ActivityWeek
      additionalProperties: false
      description: ActivityWeek is one week of the window, from its Monday in the organization's timezone.
    gravel.hub.v1.Actor:
      type: object
      properties:
        provider:
          type: string
          title: provider
          description: '"discord".'
        subject:
          type: string
          title: subject
      title: Actor
      additionalProperties: false
      description: |-
        Actor is the person an app says it acts for: a Discord moderator behind a bot command. The
         hub records it as the app asserted it; a logged-in user acts as themselves and sends none.
    gravel.hub.v1.App:
      type: object
      properties:
        clientId:
          type: string
          title: client_id
        name:
          type: string
          title: name
        scopes:
          type: array
          items:
            type: string
          title: scopes
        redirectUris:
          type: array
          items:
            type: string
          title: redirect_uris
        createdAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: created_at
        revokedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: revoked_at
          description: Unset while the app is live.
      title: App
      additionalProperties: false
      description: |-
        App is a registered first-party app (ADR-0008, ADR-0015), as the operator sees it; never its
         secret, which CreateApp answers once.
    gravel.hub.v1.AppGrant:
      type: object
      properties:
        clientId:
          type: string
          title: client_id
