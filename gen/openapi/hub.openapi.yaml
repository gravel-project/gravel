tags:
  - name: gravel.hub.v1.AppService
    description: |-
      AppService is a member's side of first-party apps (ADR-0015): the authorization endpoint's
       checks and consent, which the hub's /oauth/authorize page calls, and the apps the member
       allowed. Every procedure but PrepareAuthorization needs a session cookie; no bearer token, an
       app's or a member's, may call any of them.
  - name: gravel.hub.v1.ModerationService
    description: |-
      ModerationService acts on the players of a server the hub controls (ADR-0010 §5): the owner, a
       member with the moderator role (ADR-0013), or an app with the servers:moderate scope (a bot),
       whose on_behalf_of, when set, must be the owner or a moderator.
       Every call goes through the server's driver and leaves an audit entry, written before the call,
       so the web and the bot share one log.

       The errors: invalid_argument for a missing or over-long field; not_found for an unknown server,
       a player who is not on it or an unban with no ban; unavailable for a server the hub has not
       reached yet, cannot reach, or that refuses the hub's credential or asks it to wait;
       failed_precondition for an action the server does not offer now (its capabilities).
  - name: gravel.hub.v1.ServerConfigService
    description: |-
      ServerConfigService reads and writes a server's configuration through its driver (ADR-0010
       §6): the owner, or an app with the servers:configure scope. A deployment keeps its document in
       its own repository without what the hub owns; the hub merges the server's secrets and its own
       ban list in, checks the game's bands, has the server validate, and writes only against the
       revision it planned on. An apply leaves an audit entry (action "apply_config").

       The errors: invalid_argument for a document the hub refuses (the problems are in the message);
       aborted for a server whose configuration moved since the plan; failed_precondition for a server
       that does not let the hub read or write its configuration now; unavailable as for moderation.
  - name: gravel.hub.v1.ServerHostService
    description: |-
      ServerHostService looks after the VMs cloud-VM servers run on (ADR-0003). Every write is an
       audit-log row; the host's state machine carries it out, and its transitions name the row.
  - name: gravel.hub.v1.IdentityService
    description: |-
      IdentityService is the logged-in member's account and the lookups role sync needs. Every
       procedure needs a session cookie; login itself is the browser flow under /auth/.
  - name: gravel.hub.v1.ServerLeaseService
    description: |-
      ServerLeaseService takes a leasable server (servers.yaml vm.lease) for a match: with its own
       password, settings, plugin set and match config, started and sized for the players expected, and
       parked and given back after (ADR-0023). An app with servers:lease, the owner or a moderator; an
       app sees and releases only its own leases. Every request and release is an audit-log row.
  - name: gravel.hub.v1.OrganizationService
    description: OrganizationService reads the built-in organization and claims its ownership once.
  - name: gravel.hub.v1.ServerService
    description: |-
      ServerService reads the games and servers the hub controls (ADR-0010). They are applied from a
       deployment's servers.yaml by `gravel-hub servers apply`; the hub polls each server through its
       driver and answers from the last observation, so a caller never reaches a game server.
  - name: gravel.hub.v1.StatsService
    description: |-
      StatsService is the stats boards (ADR-0012): counts from the hub's own polls of each server,
       keyed by provider identity, unlinked players under pseudonyms; and participation from
       first-party apps, on boards of its own (ADR-0014).
