openapi: 3.1.0
info:
  title: gravel hub
  description: The HTTP-JSON side of the gravel hub's Connect API. The same procedures serve gRPC and gRPC-Web.
  version: v1
  license:
    name: Apache-2.0
    identifier: Apache-2.0
paths:
  /gravel.hub.v1.AppService/Authorize:
    post:
      tags:
        - gravel.hub.v1.AppService
      summary: Authorize
      description: |-
        Authorize records the member's consent (the remembered grant widens to what was asked) and
         issues an authorization code bound to the app, the redirect URI, the PKCE challenge and the
         member. A request PrepareAuthorization refuses is refused here the same way: not_found or
         invalid_argument.
      operationId: gravel.hub.v1.AppService.Authorize
      parameters:
        - name: Connect-Protocol-Version
          in: header
          description: Define the version of the Connect protocol
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: 1
        - name: Connect-Timeout-Ms
          in: header
          description: Define the timeout, in ms
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: 1000
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/gravel.hub.v1.AuthorizeRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/gravel.hub.v1.AuthorizeResponse'
  /gravel.hub.v1.AppService/ListAppGrants:
    post:
      tags:
        - gravel.hub.v1.AppService
      summary: ListAppGrants
      description: ListAppGrants lists the apps the member allowed, with the scopes and when.
      operationId: gravel.hub.v1.AppService.ListAppGrants
      parameters:
        - name: Connect-Protocol-Version
          in: header
          description: Define the version of the Connect protocol
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: 1
        - name: Connect-Timeout-Ms
          in: header
          description: Define the timeout, in ms
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: 1000
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/gravel.hub.v1.ListAppGrantsRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/gravel.hub.v1.ListAppGrantsResponse'
  /gravel.hub.v1.AppService/PrepareAuthorization:
    post:
      tags:
        - gravel.hub.v1.AppService
      summary: PrepareAuthorization
      description: |-
        PrepareAuthorization checks an authorization request. An unknown or revoked client, or a
         redirect URI the app did not register, is not_found: the page shows an error and never
         redirects. Any other refusal is answered in error and error_description, for the page to
         send back to the app. With a session it says whether the member must be asked.
      operationId: gravel.hub.v1.AppService.PrepareAuthorization
      parameters:
        - name: Connect-Protocol-Version
          in: header
          description: Define the version of the Connect protocol
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: 1
        - name: Connect-Timeout-Ms
          in: header
          description: Define the timeout, in ms
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: 1000
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/gravel.hub.v1.PrepareAuthorizationRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/gravel.hub.v1.PrepareAuthorizationResponse'
  /gravel.hub.v1.AppService/RevokeAppGrant:
    post:
      tags:
        - gravel.hub.v1.AppService
      summary: RevokeAppGrant
      description: |-
        RevokeAppGrant withdraws the member's grant to an app and revokes the member's tokens for it;
         not_found when the member had not allowed it.
      operationId: gravel.hub.v1.AppService.RevokeAppGrant
      parameters:
        - name: Connect-Protocol-Version
          in: header
          description: Define the version of the Connect protocol
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: 1
        - name: Connect-Timeout-Ms
          in: header
          description: Define the timeout, in ms
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: 1000
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/gravel.hub.v1.RevokeAppGrantRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
