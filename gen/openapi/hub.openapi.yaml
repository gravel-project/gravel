openapi: 3.1.0
info:
  title: gravel hub
  description: The HTTP-JSON side of the gravel hub's Connect API. The same procedures serve gRPC and gRPC-Web.
  version: v1
  license:
    name: Apache-2.0
    identifier: Apache-2.0
paths:
  /gravel.hub.v1.IdentityService/GetMe:
    post:
      tags:
        - gravel.hub.v1.IdentityService
      summary: GetMe
      description: GetMe returns the caller and their linked identities.
      operationId: gravel.hub.v1.IdentityService.GetMe
      parameters:
        - name: Connect-Protocol-Version
          in: header
          description: Define the version of the Connect protocol
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: 1
        - name: Connect-Timeout-Ms
          in: header
          description: Define the timeout, in ms
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: 1000
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/gravel.hub.v1.GetMeRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/gravel.hub.v1.GetMeResponse'
  /gravel.hub.v1.IdentityService/ListIdentityEvents:
    post:
      tags:
        - gravel.hub.v1.IdentityService
      summary: ListIdentityEvents
      description: |-
        ListIdentityEvents returns the identity log after a position, oldest first: a reconciler's
         incremental pass. An app with identity:read, or the owner.
      operationId: gravel.hub.v1.IdentityService.ListIdentityEvents
      parameters:
        - name: Connect-Protocol-Version
          in: header
          description: Define the version of the Connect protocol
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: 1
        - name: Connect-Timeout-Ms
          in: header
          description: Define the timeout, in ms
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: 1000
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/gravel.hub.v1.ListIdentityEventsRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/gravel.hub.v1.ListIdentityEventsResponse'
  /gravel.hub.v1.IdentityService/ListUsers:
    post:
      tags:
        - gravel.hub.v1.IdentityService
      summary: ListUsers
      description: |-
        ListUsers pages through the members with their identities, oldest first: a role-sync
         reconciler's full pass. An app with identity:read, or the owner.
      operationId: gravel.hub.v1.IdentityService.ListUsers
      parameters:
        - name: Connect-Protocol-Version
          in: header
          description: Define the version of the Connect protocol
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: 1
        - name: Connect-Timeout-Ms
          in: header
          description: Define the timeout, in ms
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: 1000
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/gravel.hub.v1.ListUsersRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/gravel.hub.v1.ListUsersResponse'
  /gravel.hub.v1.IdentityService/Logout:
    post:
      tags:
        - gravel.hub.v1.IdentityService
      summary: Logout
      description: Logout ends the calling session and clears its cookie.
      operationId: gravel.hub.v1.IdentityService.Logout
      parameters:
        - name: Connect-Protocol-Version
          in: header
          description: Define the version of the Connect protocol
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: 1
        - name: Connect-Timeout-Ms
          in: header
          description: Define the timeout, in ms
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: 1000
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/gravel.hub.v1.LogoutRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/gravel.hub.v1.LogoutResponse'
  /gravel.hub.v1.IdentityService/LookupUser:
    post:
      tags:
        - gravel.hub.v1.IdentityService
      summary: LookupUser
      description: |-
        LookupUser resolves a (provider, subject) pair to its user, for role sync. Owner only until
         first-party apps get their own credentials (gravel#6).
      operationId: gravel.hub.v1.IdentityService.LookupUser
      parameters:
        - name: Connect-Protocol-Version
          in: header
          description: Define the version of the Connect protocol
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: 1
        - name: Connect-Timeout-Ms
          in: header
          description: Define the timeout, in ms
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: 1000
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/gravel.hub.v1.LookupUserRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/gravel.hub.v1.LookupUserResponse'
  /gravel.hub.v1.IdentityService/RevokeSessions:
    post:
      tags:
        - gravel.hub.v1.IdentityService
      summary: RevokeSessions
      description: RevokeSessions logs the caller out everywhere, this session included.
      operationId: gravel.hub.v1.IdentityService.RevokeSessions
      parameters:
        - name: Connect-Protocol-Version
          in: header
          description: Define the version of the Connect protocol
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: 1
        - name: Connect-Timeout-Ms
          in: header
          description: Define the timeout, in ms
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: 1000
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/gravel.hub.v1.RevokeSessionsRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/gravel.hub.v1.RevokeSessionsResponse'
  /gravel.hub.v1.IdentityService/UnlinkIdentity:
    post:
      tags:
        - gravel.hub.v1.IdentityService
      summary: UnlinkIdentity
      description: |-
        UnlinkIdentity removes one of the caller's identities. The last one is refused
         (failed_precondition): a provider-only account would be unreachable.
      operationId: gravel.hub.v1.IdentityService.UnlinkIdentity
      parameters:
        - name: Connect-Protocol-Version
          in: header
          description: Define the version of the Connect protocol
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: 1
        - name: Connect-Timeout-Ms
          in: header
          description: Define the timeout, in ms
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: 1000
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/gravel.hub.v1.UnlinkIdentityRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/gravel.hub.v1.UnlinkIdentityResponse'
  /gravel.hub.v1.OrganizationService/ClaimOwnership:
    post:
      tags:
        - gravel.hub.v1.OrganizationService
      summary: ClaimOwnership
      description: |-
        ClaimOwnership consumes the one-time owner-claim token and makes the caller the owner. It
         needs a session (unauthenticated otherwise) and succeeds once per hub: the token is
         single-use, expires, and no token exists once the hub is owned.
      operationId: gravel.hub.v1.OrganizationService.ClaimOwnership
      parameters:
        - name: Connect-Protocol-Version
          in: header
          description: Define the version of the Connect protocol
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: 1
        - name: Connect-Timeout-Ms
          in: header
          description: Define the timeout, in ms
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: 1000
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/gravel.hub.v1.ClaimOwnershipRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/gravel.hub.v1.ClaimOwnershipResponse'
  /gravel.hub.v1.OrganizationService/GetOrganization:
    post:
      tags:
        - gravel.hub.v1.OrganizationService
      summary: GetOrganization
      operationId: gravel.hub.v1.OrganizationService.GetOrganization
      parameters:
        - name: Connect-Protocol-Version
          in: header
          description: Define the version of the Connect protocol
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: 1
        - name: Connect-Timeout-Ms
          in: header
          description: Define the timeout, in ms
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: 1000
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/gravel.hub.v1.GetOrganizationRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/gravel.hub.v1.GetOrganizationResponse'
  /gravel.hub.v1.OrganizationService/GetOrganizationSettings:
    post:
      tags:
        - gravel.hub.v1.OrganizationService
      summary: GetOrganizationSettings
      description: |-
        GetOrganizationSettings returns the settings; public, because the pages render the theme
         before anyone logs in.
      operationId: gravel.hub.v1.OrganizationService.GetOrganizationSettings
      parameters:
        - name: Connect-Protocol-Version
          in: header
          description: Define the version of the Connect protocol
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: 1
        - name: Connect-Timeout-Ms
          in: header
          description: Define the timeout, in ms
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: 1000
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/gravel.hub.v1.GetOrganizationSettingsRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/gravel.hub.v1.GetOrganizationSettingsResponse'
  /gravel.hub.v1.OrganizationService/UpdateOrganizationSettings:
    post:
      tags:
        - gravel.hub.v1.OrganizationService
      summary: UpdateOrganizationSettings
      description: |-
        UpdateOrganizationSettings replaces the settings. The owner only; invalid_argument names
         every invalid field.
      operationId: gravel.hub.v1.OrganizationService.UpdateOrganizationSettings
      parameters:
        - name: Connect-Protocol-Version
          in: header
          description: Define the version of the Connect protocol
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: 1
        - name: Connect-Timeout-Ms
          in: header
          description: Define the timeout, in ms
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: 1000
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/gravel.hub.v1.UpdateOrganizationSettingsRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/gravel.hub.v1.UpdateOrganizationSettingsResponse'
components:
  schemas:
    connect-protocol-version:
      type: number
      examples:
        - 1
      title: Connect-Protocol-Version
      description: Define the version of the Connect protocol
      const: 1
    connect-timeout-header:
      type: number
      examples:
        - 1000
      title: Connect-Timeout-Ms
      description: Define the timeout, in ms
    connect.error:
      type: object
      properties:
        code:
          type: string
          examples:
            - not_found
          enum:
            - canceled
            - unknown
            - invalid_argument
            - deadline_exceeded
            - not_found
            - already_exists
            - permission_denied
            - resource_exhausted
            - failed_precondition
            - aborted
            - out_of_range
            - unimplemented
            - internal
            - unavailable
            - data_loss
            - unauthenticated
          description: The status code, which should be an enum value of [google.rpc.Code][google.rpc.Code].
        message:
          type: string
          description: A developer-facing error message, which should be in English. Any user-facing error message should be localized and sent in the [google.rpc.Status.details][google.rpc.Status.details] field, or localized by the client.
        details:
          type: array
          items:
            $ref: '#/components/schemas/connect.error_details.Any'
          description: A list of messages that carry the error details. There is no limit on the number of messages.
      title: Connect Error
      additionalProperties: true
      description: 'Error type returned by Connect: https://connectrpc.com/docs/go/errors/#http-representation'
    connect.error_details.Any:
      type: object
      properties:
        type:
          type: string
          description: 'A URL that acts as a globally unique identifier for the type of the serialized message. For example: `type.googleapis.com/google.rpc.ErrorInfo`.'
        value:
          type: string
          format: byte
          description: The Protobuf message, serialized as bytes and base64-encoded. The specific message type is identified by the `type` field.
        debug:
          type: object
          title: Debug
          additionalProperties: true
          description: Deserialized error detail payload. The 'type' field indicates the schema. This field is for easier debugging and should not be relied upon for application logic.
      additionalProperties: true
      description: Contains an arbitrary serialized message along with a @type that describes the type of the serialized message, with an additional debug field for ConnectRPC error details.
    google.protobuf.Timestamp:
      type: string
      examples:
        - "2023-01-15T01:30:15.01Z"
        - "2024-12-25T12:00:00Z"
      format: date-time
      description: A point in time in RFC 3339 format, with up to nanosecond precision. Output uses UTC (`Z`); input may use an offset from UTC.
    gravel.hub.v1.ClaimOwnershipRequest:
      type: object
      properties:
        token:
          type: string
          title: token
          description: The one-time owner-claim token the hub printed to its log at start.
      title: ClaimOwnershipRequest
      additionalProperties: false
    gravel.hub.v1.ClaimOwnershipResponse:
      type: object
      properties:
        organization:
          allOf:
            - $ref: '#/components/schemas/gravel.hub.v1.Organization'
          title: organization
      title: ClaimOwnershipResponse
      additionalProperties: false
    gravel.hub.v1.GetMeRequest:
      type: object
      title: GetMeRequest
      additionalProperties: false
    gravel.hub.v1.GetMeResponse:
      type: object
      properties:
        user:
          allOf:
            - $ref: '#/components/schemas/gravel.hub.v1.User'
          title: user
      title: GetMeResponse
      additionalProperties: false
    gravel.hub.v1.GetOrganizationRequest:
      type: object
      title: GetOrganizationRequest
      additionalProperties: false
    gravel.hub.v1.GetOrganizationResponse:
      type: object
      properties:
        organization:
          allOf:
            - $ref: '#/components/schemas/gravel.hub.v1.Organization'
          title: organization
      title: GetOrganizationResponse
      additionalProperties: false
    gravel.hub.v1.GetOrganizationSettingsRequest:
      type: object
      title: GetOrganizationSettingsRequest
      additionalProperties: false
    gravel.hub.v1.GetOrganizationSettingsResponse:
      type: object
      properties:
        settings:
          allOf:
            - $ref: '#/components/schemas/gravel.hub.v1.OrganizationSettings'
          title: settings
      title: GetOrganizationSettingsResponse
      additionalProperties: false
    gravel.hub.v1.Identity:
      type: object
      properties:
        provider:
          type: string
          title: provider
          description: 'The provider key: "discord", "steam".'
        subject:
          type: string
          title: subject
          description: 'The stable id at the provider: a Discord user id, a SteamID64.'
        displayName:
          type: string
          title: display_name
          description: Display attributes refreshed at every login; may be empty.
        avatarUrl:
          type: string
          title: avatar_url
        verificationMethod:
          type: string
          title: verification_method
          description: 'How control was proven: "oauth2" or "openid".'
        verifiedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: verified_at
        linkedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: linked_at
        lastLoginAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: last_login_at
          description: When this identity was last used to log in; unset for one that was only linked.
      title: Identity
      additionalProperties: false
      description: |-
        Identity is one provider account linked to a user: a (provider, subject) pair, unique across
         the hub, with mutable display attributes and a record of how control was proven.
    gravel.hub.v1.IdentityEvent:
      type: object
      properties:
        id:
          type: string
          title: id
          format: int64
          description: The log position; ask for what comes after it next time.
        userId:
          type: string
          title: user_id
        provider:
          type: string
          title: provider
        subject:
          type: string
          title: subject
        event:
          type: string
          title: event
          description: '"registered", "login", "linked" or "unlinked".'
        at:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: at
      title: IdentityEvent
      additionalProperties: false
      description: |-
        IdentityEvent is one line of the append-only identity log: a registration, a login, a link or
         an unlink of one (provider, subject) pair.
    gravel.hub.v1.ListIdentityEventsRequest:
      type: object
      properties:
        afterId:
          type: string
          title: after_id
          format: int64
          description: Return events with an id greater than this; 0 for the start of the log.
        limit:
          type: integer
          title: limit
          format: int32
          description: At most 1000; 100 when unset.
      title: ListIdentityEventsRequest
      additionalProperties: false
    gravel.hub.v1.ListIdentityEventsResponse:
      type: object
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/gravel.hub.v1.IdentityEvent'
          title: events
        nextAfterId:
          type: string
          title: next_after_id
          format: int64
          description: 'The id to pass as after_id next time: the last event''s, or after_id itself when there were none.'
      title: ListIdentityEventsResponse
      additionalProperties: false
    gravel.hub.v1.ListUsersRequest:
      type: object
      properties:
        pageSize:
          type: integer
          title: page_size
          format: int32
          description: At most 500; 100 when unset.
        pageToken:
          type: string
          title: page_token
          description: The next_page_token of the previous page; empty for the first.
      title: ListUsersRequest
      additionalProperties: false
    gravel.hub.v1.ListUsersResponse:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/gravel.hub.v1.User'
          title: users
          description: Members with their identities, oldest registration first.
        nextPageToken:
          type: string
          title: next_page_token
          description: Empty on the last page.
      title: ListUsersResponse
      additionalProperties: false
    gravel.hub.v1.LogoutRequest:
      type: object
      title: LogoutRequest
      additionalProperties: false
    gravel.hub.v1.LogoutResponse:
      type: object
      title: LogoutResponse
      additionalProperties: false
    gravel.hub.v1.LookupUserRequest:
      type: object
      properties:
        provider:
          type: string
          title: provider
        subject:
          type: string
          title: subject
      title: LookupUserRequest
      additionalProperties: false
    gravel.hub.v1.LookupUserResponse:
      type: object
      properties:
        user:
          allOf:
            - $ref: '#/components/schemas/gravel.hub.v1.User'
          title: user
      title: LookupUserResponse
      additionalProperties: false
    gravel.hub.v1.NavLink:
      type: object
      properties:
        label:
          type: string
          title: label
        url:
          type: string
          title: url
        placement:
          type: string
          title: placement
          description: '"header" or "footer"; empty means header.'
        role:
          type: string
          title: role
          description: Empty for everyone, "owner" for the owner only.
      title: NavLink
      additionalProperties: false
      description: NavLink is a navigation extension link.
    gravel.hub.v1.Organization:
      type: object
      properties:
        id:
          type: string
          title: id
          description: Stable identifier (UUID).
        name:
          type: string
          title: name
          description: Display name, from the hub's configuration.
        owned:
          type: boolean
          title: owned
          description: Whether ownership has been claimed. An unowned hub accepts exactly one ClaimOwnership call.
        createdAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: created_at
        claimedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: claimed_at
          description: When ownership was claimed; unset while unowned.
        ownerUserId:
          type: string
          title: owner_user_id
          description: The user who claimed ownership; unset while unowned.
      title: Organization
      additionalProperties: false
      description: |-
        Organization is the single tenant a hub serves. Every top-level object carries an organization
         (the seam for a second tenant later); there is exactly one built-in organization today.
    gravel.hub.v1.OrganizationSettings:
      type: object
      properties:
        version:
          type: integer
          title: version
          format: int32
        theme:
          allOf:
            - $ref: '#/components/schemas/gravel.hub.v1.Theme'
          title: theme
        nav:
          type: array
          items:
            $ref: '#/components/schemas/gravel.hub.v1.NavLink'
          title: nav
        updatedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: updated_at
          description: When the settings were last written; unset while the defaults apply.
      title: OrganizationSettings
      additionalProperties: false
      description: |-
        OrganizationSettings is the Organization settings resource: every host-configurable knob in
         one document (theme and navigation first; the Discord role mapping, token lifetimes and layout
         overrides join it with their features). Version is the document format.
    gravel.hub.v1.RevokeSessionsRequest:
      type: object
      title: RevokeSessionsRequest
      additionalProperties: false
    gravel.hub.v1.RevokeSessionsResponse:
      type: object
      properties:
        revoked:
          type: integer
          title: revoked
          format: int32
          description: How many sessions were ended, the caller's included.
      title: RevokeSessionsResponse
      additionalProperties: false
    gravel.hub.v1.Theme:
      type: object
      properties:
        light:
          allOf:
            - $ref: '#/components/schemas/gravel.hub.v1.ThemeTokens'
          title: light
        dark:
          allOf:
            - $ref: '#/components/schemas/gravel.hub.v1.ThemeTokens'
          title: dark
        font:
          type: string
          title: font
          description: A CSS font-family list; empty means the system font.
        logoUrl:
          type: string
          title: logo_url
          description: An https URL or a site-relative path, or empty.
        faviconUrl:
          type: string
          title: favicon_url
      title: Theme
      additionalProperties: false
      description: Theme is how the organization's pages look.
    gravel.hub.v1.ThemeTokens:
      type: object
      properties:
        accent:
          type: string
          title: accent
        background:
          type: string
          title: background
        foreground:
          type: string
          title: foreground
        muted:
          type: string
          title: muted
        line:
          type: string
          title: line
        ok:
          type: string
          title: ok
        err:
          type: string
          title: err
      title: ThemeTokens
      additionalProperties: false
      description: ThemeTokens are one colour scheme's colours as CSS colours; an empty token means the default.
    gravel.hub.v1.UnlinkIdentityRequest:
      type: object
      properties:
        provider:
          type: string
          title: provider
        subject:
          type: string
          title: subject
      title: UnlinkIdentityRequest
      additionalProperties: false
    gravel.hub.v1.UnlinkIdentityResponse:
      type: object
      properties:
        user:
          allOf:
            - $ref: '#/components/schemas/gravel.hub.v1.User'
          title: user
          description: The caller, after the unlink.
      title: UnlinkIdentityResponse
      additionalProperties: false
    gravel.hub.v1.UpdateOrganizationSettingsRequest:
      type: object
      properties:
        settings:
          allOf:
            - $ref: '#/components/schemas/gravel.hub.v1.OrganizationSettings'
          title: settings
          description: The whole document; omitted tokens mean the default, an omitted nav means no links.
      title: UpdateOrganizationSettingsRequest
      additionalProperties: false
    gravel.hub.v1.UpdateOrganizationSettingsResponse:
      type: object
      properties:
        settings:
          allOf:
            - $ref: '#/components/schemas/gravel.hub.v1.OrganizationSettings'
          title: settings
      title: UpdateOrganizationSettingsResponse
      additionalProperties: false
    gravel.hub.v1.User:
      type: object
      properties:
        id:
          type: string
          title: id
          description: Stable identifier (UUID).
        displayName:
          type: string
          title: display_name
          description: Display name, taken from the first identity at registration.
        owner:
          type: boolean
          title: owner
          description: Whether this user owns the organization.
        createdAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: created_at
        lastLoginAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: last_login_at
        identities:
          type: array
          items:
            $ref: '#/components/schemas/gravel.hub.v1.Identity'
          title: identities
          description: The linked identities, oldest link first.
      title: User
      additionalProperties: false
      description: |-
        User is a member: what their linked identities resolve to. Stats are keyed by identity, never
         by this id.
security: []
tags:
  - name: gravel.hub.v1.IdentityService
    description: |-
      IdentityService is the logged-in member's account and the lookups role sync needs. Every
       procedure needs a session cookie; login itself is the browser flow under /auth/.
  - name: gravel.hub.v1.OrganizationService
    description: OrganizationService reads the built-in organization and claims its ownership once.
