components:
  schemas:
    connect-protocol-version:
      type: number
      examples:
        - 1
      title: Connect-Protocol-Version
      description: Define the version of the Connect protocol
      const: 1
    connect-timeout-header:
      type: number
      examples:
        - 1000
      title: Connect-Timeout-Ms
      description: Define the timeout, in ms
    connect.error:
      type: object
      properties:
        code:
          type: string
          examples:
            - not_found
          enum:
            - canceled
            - unknown
            - invalid_argument
            - deadline_exceeded
            - not_found
            - already_exists
            - permission_denied
            - resource_exhausted
            - failed_precondition
            - aborted
            - out_of_range
            - unimplemented
            - internal
            - unavailable
            - data_loss
            - unauthenticated
          description: The status code, which should be an enum value of [google.rpc.Code][google.rpc.Code].
        message:
          type: string
          description: A developer-facing error message, which should be in English. Any user-facing error message should be localized and sent in the [google.rpc.Status.details][google.rpc.Status.details] field, or localized by the client.
        details:
          type: array
          items:
            $ref: '#/components/schemas/connect.error_details.Any'
          description: A list of messages that carry the error details. There is no limit on the number of messages.
      title: Connect Error
      additionalProperties: true
      description: 'Error type returned by Connect: https://connectrpc.com/docs/go/errors/#http-representation'
    connect.error_details.Any:
      type: object
      properties:
        type:
          type: string
          description: 'A URL that acts as a globally unique identifier for the type of the serialized message. For example: `type.googleapis.com/google.rpc.ErrorInfo`.'
        value:
          type: string
          format: byte
          description: The Protobuf message, serialized as bytes and base64-encoded. The specific message type is identified by the `type` field.
        debug:
          type: object
          title: Debug
          additionalProperties: true
          description: Deserialized error detail payload. The 'type' field indicates the schema. This field is for easier debugging and should not be relied upon for application logic.
      additionalProperties: true
      description: Contains an arbitrary serialized message along with a @type that describes the type of the serialized message, with an additional debug field for ConnectRPC error details.
    google.protobuf.Timestamp:
      type: string
      examples:
        - "2023-01-15T01:30:15.01Z"
        - "2024-12-25T12:00:00Z"
      format: date-time
      description: A point in time in RFC 3339 format, with up to nanosecond precision. Output uses UTC (`Z`); input may use an offset from UTC.
    gravel.hub.v1.Actor:
      type: object
      properties:
        provider:
          type: string
          title: provider
          description: '"discord".'
        subject:
          type: string
          title: subject
      title: Actor
      additionalProperties: false
      description: |-
        Actor is the person an app says it acts for: a Discord moderator behind a bot command. The
         hub records it as the app asserted it; a logged-in user acts as themselves and sends none.
    gravel.hub.v1.AppGrant:
      type: object
      properties:
        clientId:
          type: string
          title: client_id
        appName:
          type: string
          title: app_name
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/gravel.hub.v1.ScopeInfo'
          title: scopes
        grantedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: granted_at
      title: AppGrant
      additionalProperties: false
      description: 'AppGrant is an app the member allowed (ADR-0015 §3): which, what, when.'
    gravel.hub.v1.ApplyServerConfigRequest:
      type: object
      properties:
        serverId:
          type: string
          title: server_id
        text:
          type: string
          title: text
        revision:
          type: string
          title: revision
          description: The revision PlanServerConfig answered; a server that moved since refuses (aborted).
        reason:
          type: string
          title: reason
          description: 'Recorded in the audit log: a commit, a change request.'
        onBehalfOf:
          allOf:
            - $ref: '#/components/schemas/gravel.hub.v1.Actor'
          title: on_behalf_of
      title: ApplyServerConfigRequest
      additionalProperties: false
    gravel.hub.v1.ApplyServerConfigResponse:
      type: object
      properties:
        auditId:
          type: string
          title: audit_id
          format: int64
        result:
          allOf:
            - $ref: '#/components/schemas/gravel.hub.v1.ConfigResult'
          title: result
      title: ApplyServerConfigResponse
      additionalProperties: false
    gravel.hub.v1.AuditEntry:
      type: object
      properties:
        id:
          type: string
          title: id
          format: int64
        at:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: at
        userId:
          type: string
          title: user_id
          description: |-
            Who asked: a user (user_id), an app (app_id and app_name), or a member through an app's
             token (both: the member acted, through that app; ADR-0015).
        appId:
          type: string
          title: app_id
        appName:
          type: string
          title: app_name
        onBehalfOf:
          allOf:
            - $ref: '#/components/schemas/gravel.hub.v1.Actor'
          title: on_behalf_of
          description: |-
            The person an app acting for itself acted for; unset for a user and for a member through
             an app.
        serverId:
          type: string
          title: server_id
        action:
          type: string
          title: action
          description: '"kick", "ban", "unban", "message", "broadcast" or "move_player".'
        targetProvider:
          type: string
          title: target_provider
          description: The player acted on, at the game's provider; empty for a broadcast.
        targetSubject:
          type: string
          title: target_subject
        reason:
          type: string
          title: reason
        message:
          type: string
          title: message
          description: The message sent (message, broadcast).
        team:
          type: string
          title: team
          description: The team moved to and whether the player was respawned (move_player).
        respawn:
          type: boolean
          title: respawn
        requestId:
          type: string
          title: request_id
        outcome:
          type: string
          title: outcome
          description: |-
            "ok", "player_not_found", "ban_not_found", "rejected", "not_available",
             "moved_not_respawned", "unreachable", "credential_refused", "credential_missing",
             "rate_limited" or "error"; empty while the call has no recorded result (the hub stopped
             mid-call). The cause of a failure is in the hub's log, never here.
        finishedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: finished_at
        userName:
          type: string
          title: user_name
          description: The acting member's display name, when a member acted (user_id).
      title: AuditEntry
      additionalProperties: false
      description: |-
        AuditEntry is one moderation call the hub made to a server. It is recorded before the call and
         finished once with the outcome; nothing changes it after that, and nothing deletes it.
    gravel.hub.v1.AuthorizationParams:
      type: object
      properties:
        responseType:
          type: string
          title: response_type
          description: '"code", the only response type.'
        clientId:
          type: string
          title: client_id
        redirectUri:
          type: string
          title: redirect_uri
          description: Exactly one of the redirect URIs the app registered; required.
        scope:
          type: string
          title: scope
          description: Space-separated scopes, each one the app holds; empty asks for sign-in only (GetMe).
        codeChallenge:
          type: string
          title: code_challenge
          description: 'The PKCE challenge: the unpadded base64url SHA-256 of the app''s verifier.'
        codeChallengeMethod:
          type: string
          title: code_challenge_method
          description: '"S256", the only method.'
      title: AuthorizationParams
      additionalProperties: false
      description: |-
        AuthorizationParams are an authorization request's parameters as the app sent them to
         /oauth/authorize (RFC 6749 §4.1.1 with RFC 7636 §4.3). The state is the page's to carry back
         and never reaches the API.
    gravel.hub.v1.AuthorizeRequest:
      type: object
      properties:
        params:
          allOf:
            - $ref: '#/components/schemas/gravel.hub.v1.AuthorizationParams'
          title: params
      title: AuthorizeRequest
      additionalProperties: false
    gravel.hub.v1.AuthorizeResponse:
      type: object
      properties:
        code:
          type: string
          title: code
          description: The authorization code, shown once; it lives 60 seconds.
        scopes:
          type: array
          items:
            type: string
          title: scopes
          description: The scopes the code carries.
      title: AuthorizeResponse
      additionalProperties: false
    gravel.hub.v1.Ban:
      type: object
      properties:
        provider:
          type: string
          title: provider
        subject:
          type: string
          title: subject
        bannedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: banned_at
          description: 'Unset when the server does not know (War Dogs: a ban from its configuration document).'
        bannedBy:
          type: string
          title: banned_by
          description: 'Who the server says made it (War Dogs: "config" for a configuration-document ban).'
        reason:
          type: string
          title: reason
        userId:
          type: string
          title: user_id
          description: The member the identity is linked to, resolved now; empty for a player who is not one.
        hub:
          type: boolean
          title: hub
          description: |-
            Whether the hub holds this ban (its list, written into the server's configuration); false
             for one only the server knows.
        auditId:
          type: string
          title: audit_id
          format: int64
          description: |-
            The audit entry of the BanPlayer call that made it; 0 for a hub ban imported when the hub
             adopted the server's list, or a ban the hub does not hold.
      title: Ban
      additionalProperties: false
      description: Ban is one ban a server holds.
    gravel.hub.v1.BanPlayerRequest:
      type: object
      properties:
        serverId:
          type: string
          title: server_id
        subject:
          type: string
          title: subject
        reason:
          type: string
          title: reason
          description: Required.
        onBehalfOf:
          allOf:
            - $ref: '#/components/schemas/gravel.hub.v1.Actor'
          title: on_behalf_of
      title: BanPlayerRequest
      additionalProperties: false
    gravel.hub.v1.BanPlayerResponse:
      type: object
      properties:
        auditId:
          type: string
          title: audit_id
          format: int64
      title: BanPlayerResponse
      additionalProperties: false
    gravel.hub.v1.Band:
      type: object
      properties:
        section:
          type: string
          title: section
        key:
          type: string
          title: key
        min:
          type:
            - string
            - "null"
          title: min
          format: int64
        max:
          type:
            - string
            - "null"
          title: max
          format: int64
        maxLength:
          type:
            - string
            - "null"
          title: max_length
          format: int64
        hosts:
          type: array
          items:
            type: string
          title: hosts
        unlessSet:
          type: string
          title: unless_set
          description: The band applies only while this key of the same section is empty ("" = always).
      title: Band
      additionalProperties: false
      description: |-
        Band is a publisher guardrail on one of a game's configuration keys, of one kind: a range (min,
         max; an unset bound is open), a longest value (max_length, in characters) or the hosts a URL
         value may point at (hosts: https, the host or a subdomain of one; an empty value passes).
    gravel.hub.v1.BoardEntry:
      type: object
      properties:
        rank:
          type: integer
          title: rank
          format: int32
        name:
          type: string
          title: name
        pseudonymous:
          type: boolean
          title: pseudonymous
        userId:
          type: string
          title: user_id
          description: The member, when shown by name.
        kills:
          type: integer
          title: kills
          format: int32
        deaths:
          type: integer
          title: deaths
          format: int32
        kd:
          type: number
          title: kd
          format: double
          description: kills / max(deaths, 1).
        secondsOn:
          type: integer
          title: seconds_on
          format: int32
        matches:
          type: integer
          title: matches
          format: int32
      title: BoardEntry
      additionalProperties: false
      description: |-
        BoardEntry is one player on a board. A player who has not linked the identity, or has not
         chosen to be shown by name, appears under their pseudonym (pseudonymous true, no user_id).
    gravel.hub.v1.BroadcastRequest:
      type: object
      properties:
        serverId:
          type: string
          title: server_id
        message:
          type: string
          title: message
        onBehalfOf:
          allOf:
            - $ref: '#/components/schemas/gravel.hub.v1.Actor'
          title: on_behalf_of
      title: BroadcastRequest
      additionalProperties: false
    gravel.hub.v1.BroadcastResponse:
      type: object
      properties:
        auditId:
          type: string
          title: audit_id
          format: int64
      title: BroadcastResponse
      additionalProperties: false
    gravel.hub.v1.ClaimOwnershipRequest:
      type: object
      properties:
        token:
          type: string
          title: token
          description: The one-time owner-claim token the hub printed to its log at start.
      title: ClaimOwnershipRequest
      additionalProperties: false
    gravel.hub.v1.ClaimOwnershipResponse:
      type: object
      properties:
        organization:
          allOf:
            - $ref: '#/components/schemas/gravel.hub.v1.Organization'
          title: organization
      title: ClaimOwnershipResponse
      additionalProperties: false
    gravel.hub.v1.ConfigChange:
      type: object
      properties:
        section:
          type: string
          title: section
        key:
          type: string
          title: key
        before:
          type: array
          items:
            type: string
          title: before
          description: The key's lines in order (array lines keep their prefix); empty when absent on that side.
        after:
          type: array
          items:
            type: string
          title: after
      title: ConfigChange
      additionalProperties: false
      description: ConfigChange is one key a plan changes; values are redacted.
    gravel.hub.v1.ConfigOutcome:
      type: object
      properties:
        section:
          type: string
          title: section
        state:
          type: string
          title: state
        detail:
          type: string
          title: detail
      title: ConfigOutcome
      additionalProperties: false
      description: |-
        ConfigOutcome is when a section's change takes effect: state "applied", "next-match",
         "next-restart" or "pending".
    gravel.hub.v1.ConfigProblem:
      type: object
      properties:
        section:
          type: string
          title: section
        key:
          type: string
          title: key
        code:
          type: string
          title: code
        message:
          type: string
          title: message
      title: ConfigProblem
      additionalProperties: false
      description: |-
        ConfigProblem is one reason a document is refused: by the hub (code "out_of_band",
         "hub_owned", "not_a_number") or by the server (its own codes).
    gravel.hub.v1.ConfigResult:
      type: object
      properties:
        ok:
          type: boolean
          title: ok
        revision:
          type: string
          title: revision
          description: The revision after an apply.
        problems:
          type: array
          items:
            $ref: '#/components/schemas/gravel.hub.v1.ConfigProblem'
          title: problems
        changed:
          type: array
          items:
            type: string
          title: changed
          description: The sections the document changes.
        outcomes:
          type: array
          items:
            $ref: '#/components/schemas/gravel.hub.v1.ConfigOutcome'
          title: outcomes
        shadowed:
          type: array
          items:
            $ref: '#/components/schemas/gravel.hub.v1.ConfigShadowed'
          title: shadowed
        stripped:
          type: array
          items:
            $ref: '#/components/schemas/gravel.hub.v1.ConfigStripped'
          title: stripped
        warnings:
          type: array
          items:
            type: string
          title: warnings
      title: ConfigResult
      additionalProperties: false
      description: ConfigResult is what the server said of a document it validated or applied.
    gravel.hub.v1.ConfigSection:
      type: object
      properties:
        name:
          type: string
          title: name
        appliesWhen:
          type: string
          title: applies_when
          description: 'When a change takes effect: "applied", "next-match", "next-restart".'
        keys:
          type: array
          items:
            type: string
          title: keys
        locked:
          type: array
          items:
            type: string
          title: locked
          description: 'Keys that may not be written, with what locks them: "Port: RCONPort".'
      title: ConfigSection
      additionalProperties: false
      description: ConfigSection is the server's schema for one section of its configuration.
    gravel.hub.v1.ConfigShadowed:
      type: object
      properties:
        section:
          type: string
          title: section
        key:
          type: string
          title: key
        declared:
          type: string
          title: declared
        effective:
          type: string
          title: effective
        branch:
          type: string
          title: branch
      title: ConfigShadowed
      additionalProperties: false
      description: ConfigShadowed is a key whose value in force comes from elsewhere (a command-line switch).
    gravel.hub.v1.ConfigStripped:
      type: object
      properties:
        section:
          type: string
          title: section
        key:
          type: string
          title: key
        reason:
          type: string
          title: reason
      title: ConfigStripped
      additionalProperties: false
      description: ConfigStripped is a key, or a whole section with no key, the server drops.
    gravel.hub.v1.DestroyServerHostRequest:
      type: object
      properties:
        serverId:
          type: string
          title: server_id
        deleteVolume:
          type: boolean
          title: delete_volume
          description: |-
            Delete the data volume (the game's install) and release the reserved address too; without
             them both stay, and a server put back in the manifest is made again on them.
        releaseAddress:
          type: boolean
          title: release_address
        reason:
          type: string
          title: reason
      title: DestroyServerHostRequest
      additionalProperties: false
    gravel.hub.v1.DestroyServerHostResponse:
      type: object
      properties:
        host:
          allOf:
            - $ref: '#/components/schemas/gravel.hub.v1.ServerHost'
          title: host
        auditId:
          type: string
          title: audit_id
          format: int64
      title: DestroyServerHostResponse
      additionalProperties: false
    gravel.hub.v1.DiscordNews:
      type: object
      properties:
        feeds:
          type: array
          items:
            $ref: '#/components/schemas/gravel.hub.v1.DiscordNewsFeed'
          title: feeds
          description: At most 20; a game once per channel.
      title: DiscordNews
      additionalProperties: false
      description: 'Steam news: each feed is one game''s announcements into one channel, posted as the bot finds them.'
    gravel.hub.v1.DiscordNewsFeed:
      type: object
      properties:
        appId:
          type: integer
          title: app_id
          format: int32
          description: 'The game''s Steam app id, as in its store URL: 730 for Counter-Strike 2.'
        channel:
          type: string
          title: channel
        label:
          type: string
          title: label
          description: The game's name in each post's footer, at most 64 characters.
        feeds:
          type: array
          items:
            type: string
          title: feeds
          description: Steam's feed names to read; none is "steam_community_announcements".
        color:
          type: integer
          title: color
          format: int32
          description: The posts' embed color as 0xRRGGBB; 0 is the bot's default.
      title: DiscordNewsFeed
      additionalProperties: false
      description: One game's Steam announcements posted into one channel.
    gravel.hub.v1.DiscordPresence:
      type: object
      properties:
        channel:
          type: string
          title: channel
        note:
          type: string
          title: note
          description: A line the host writes under the counts.
        games:
          type: array
          items:
            $ref: '#/components/schemas/gravel.hub.v1.DiscordPresenceGame'
          title: games
      title: DiscordPresence
      additionalProperties: false
      description: |-
        The "who's playing now" card: one message, edited when a count changes. Counts only; the hub
         and the bot keep no record of who played.
    gravel.hub.v1.DiscordPresenceGame:
      type: object
      properties:
        game:
          type: string
          title: game
          description: 'The line''s key, in the metrics: "wardogs".'
        label:
          type: string
          title: label
          description: 'What the card shows: "War Dogs".'
        activities:
          type: array
          items:
            type: string
          title: activities
          description: Activity names as Discord shows them ("WARDOGS"), compared without regard to case.
        applicationIds:
          type: array
          items:
            type: string
          title: application_ids
          description: The activities' Discord application ids.
      title: DiscordPresenceGame
      additionalProperties: false
      description: One game on the presence card and how its Discord activity is recognized.
    gravel.hub.v1.DiscordRecap:
      type: object
      properties:
        server:
          type: string
          title: server
          description: 'The server''s id in the hub: "htg-wardogs-1"; one rule per server.'
        channel:
          type: string
          title: channel
          description: Where the recap is posted.
        title:
          type: string
          title: title
          description: 'The session''s name in the post: "Wardogs Wednesday".'
        hours:
          type: array
          items:
            $ref: '#/components/schemas/gravel.hub.v1.DiscordSeedingHours'
          title: hours
          description: The sessions, as seeding's windows; none is a rule that never posts.
        floor:
          type: integer
          title: floor
          format: int32
          description: The player count "minutes at or above" counts against, 0 to 1000; 0 leaves it out.
        note:
          type: string
          title: note
          description: A line appended to the post, at most 200 characters.
      title: DiscordRecap
      additionalProperties: false
      description: After each of its weekly windows, the bot posts what the server's window held.
    gravel.hub.v1.DiscordRecognition:
      type: object
      properties:
        role:
          type: string
          title: role
        rule:
          type: string
          title: rule
          description: '"first_members": the first count members by registration.'
        count:
          type: integer
          title: count
          format: int32
      title: DiscordRecognition
      additionalProperties: false
      description: 'DiscordRecognition is a role earned once and kept: role sync adds it and never removes it.'
    gravel.hub.v1.DiscordRoles:
      type: object
      properties:
        linked:
          type: string
          title: linked
          description: The role for a member with any identity besides Discord; empty for none.
        providers:
          type: object
          title: providers
          additionalProperties:
            type: string
            title: value
          description: A provider ("steam") to the role for a member who linked it.
      title: DiscordRoles
      additionalProperties: false
      description: |-
        DiscordRoles are the roles that follow a member's linked identities; role sync adds and
         removes them.
    gravel.hub.v1.DiscordSeeding:
      type: object
      properties:
        server:
          type: string
          title: server
          description: 'The server''s id in the hub: "htg-wardogs-1"; one rule per server.'
        channel:
          type: string
          title: channel
          description: Where the call is posted.
        role:
          type: string
          title: role
          description: The opt-in seeder role the call pings; never the guild's id (@everyone).
        below:
          type: integer
          title: below
          format: int32
          description: 'The player count under which a call is due, 2 to 1000: the game''s floor (War Dogs, 20).'
        hours:
          type: array
          items:
            $ref: '#/components/schemas/gravel.hub.v1.DiscordSeedingHours'
          title: hours
          description: The weekly windows; at most 14. None is a rule that never calls.
        cooldown:
          type: string
          title: cooldown
          description: The least time between two calls, a Go duration from 15m to 24h; empty is 2h.
        callAtStart:
          type: boolean
          title: call_at_start
          description: |-
            Each window's first call goes out at its start, while the server is under below, without
             waiting out a cooldown left from before the window.
        note:
          type: string
          title: note
          description: 'A line appended to the call, at most 200 characters: how to join.'
      title: DiscordSeeding
      additionalProperties: false
      description: |-
        DiscordSeeding is when and where the bot calls for seeders for one server (ADR-0016): inside
         one of its windows, while the server is live and under below, at most once per cooldown. It
         pings role and nothing else. Outside every window nothing is posted.
    gravel.hub.v1.DiscordSeedingHours:
      type: object
      properties:
        days:
          type: array
          items:
            type: string
          title: days
        from:
          type: string
          title: from
        to:
          type: string
          title: to
      title: DiscordSeedingHours
      additionalProperties: false
      description: |-
        DiscordSeedingHours is one weekly window of a seeding rule, in StatsSettings.timezone: the days
         it starts on ("mon" … "sun") and the time of day from and to ("18:00", "23:00", 24-hour). A to
         before from ends the next day; a rule's windows do not overlap.
    gravel.hub.v1.DiscordServerCard:
      type: object
      properties:
        server:
          type: string
          title: server
          description: 'The server''s id in the hub: "htg-wardogs-1".'
        channel:
          type: string
          title: channel
        note:
          type: string
          title: note
          description: 'A line the host writes under the numbers: "Matches start at 20 players."'
      title: DiscordServerCard
      additionalProperties: false
      description: |-
        DiscordServerCard places one server's live status card in a channel: one message the bot edits
         in place.
    gravel.hub.v1.DiscordSettings:
      type: object
      properties:
        guildId:
          type: string
          title: guild_id
        roles:
          allOf:
            - $ref: '#/components/schemas/gravel.hub.v1.DiscordRoles'
          title: roles
        recognition:
          type: array
          items:
            $ref: '#/components/schemas/gravel.hub.v1.DiscordRecognition'
          title: recognition
        serverCards:
          type: array
          items:
            $ref: '#/components/schemas/gravel.hub.v1.DiscordServerCard'
          title: server_cards
        modLog:
          type: string
          title: mod_log
          description: The channel the bot posts every moderation action to (the audit log); empty is none.
        seeding:
          type: array
          items:
            $ref: '#/components/schemas/gravel.hub.v1.DiscordSeeding'
          title: seeding
          description: The seeding rules, at most 10 (the seeding module, ADR-0016).
        presence:
          allOf:
            - $ref: '#/components/schemas/gravel.hub.v1.DiscordPresence'
          title: presence
          description: The "who's playing now" card (the presence module, ADR-0017); unset is none.
        recaps:
          type: array
          items:
            $ref: '#/components/schemas/gravel.hub.v1.DiscordRecap'
          title: recaps
          description: The session recaps, at most 10, one per server (the recaps module, ADR-0018).
        streams:
          allOf:
            - $ref: '#/components/schemas/gravel.hub.v1.DiscordStreams'
          title: streams
          description: The go-live posts for the community's streamers (the streams module, ADR-0019); unset is none.
        news:
          allOf:
            - $ref: '#/components/schemas/gravel.hub.v1.DiscordNews'
          title: news
          description: The Steam news feeds (the news module); unset is none.
      title: DiscordSettings
      additionalProperties: false
      description: |-
        DiscordSettings is the guild the bot works in (ADR-0008): the roles role sync maps and the
         channels the server cards live in. Ids are Discord snowflakes as strings; empty means the bot
         has nothing to do.
    gravel.hub.v1.DiscordStreamer:
      type: object
      properties:
        platform:
          type: string
          title: platform
          description: '"twitch" or "kick".'
        login:
          type: string
          title: login
          description: 'The channel''s login on the platform, as in its URL: "hiddentoken" for twitch.tv/hiddentoken.'
        label:
          type: string
          title: label
          description: The name the post shows; the login when empty.
      title: DiscordStreamer
      additionalProperties: false
      description: One streamer the bot watches.
    gravel.hub.v1.DiscordStreams:
      type: object
      properties:
        channel:
          type: string
          title: channel
        role:
          type: string
          title: role
          description: A role the post pings when a stream starts (an opt-in role); empty pings no one.
        note:
          type: string
          title: note
          description: A line the host writes under each post.
        streamers:
          type: array
          items:
            $ref: '#/components/schemas/gravel.hub.v1.DiscordStreamer'
          title: streamers
          description: At most 10.
      title: DiscordStreams
      additionalProperties: false
      description: |-
        Go-live posts: one message per stream in the channel, edited when the stream ends. Stream
         metadata only; nothing about viewers is read.
    gravel.hub.v1.Game:
      type: object
      properties:
        id:
          type: string
          title: id
          description: '"wardogs".'
        name:
          type: string
          title: name
        identityProvider:
          type: string
          title: identity_provider
          description: 'The provider its players are keyed by: "steam".'
        bands:
          type: array
          items:
            $ref: '#/components/schemas/gravel.hub.v1.Band'
          title: bands
        noPaidPerks:
          type: boolean
          title: no_paid_perks
          description: |-
            The publisher forbids any paid benefit (a supporter perk, a crowdfunding reward) that depends
             on the game's data or features.
        layout:
          allOf:
            - $ref: '#/components/schemas/gravel.hub.v1.GameLayout'
          title: layout
          description: How the pages show the game (the Game spec's layout).
      title: Game
      additionalProperties: false
      description: |-
        Game is a game this hub's servers run: a Game spec gravel ships, with the deployment's
         tightenings of its bands applied.
    gravel.hub.v1.GameLayout:
      type: object
      properties:
        board:
          type: array
          items:
            type: string
          title: board
          description: A board's columns in order, each a GetBoardRequest metric; the first is the default ranking.
      title: GameLayout
      additionalProperties: false
      description: GameLayout is a game's page layout, declarative data from its Game spec.
    gravel.hub.v1.GameSettings:
      type: object
      properties:
        theme:
          allOf:
            - $ref: '#/components/schemas/gravel.hub.v1.GameTheme'
          title: theme
        nav:
          type: array
          items:
            $ref: '#/components/schemas/gravel.hub.v1.NavLink'
          title: nav
          description: |-
            Links shown on the game's pages, in the game's own navigation; at most 6. placement is
             unused and must be empty.
        maps:
          type: object
          title: maps
          additionalProperties:
            type: string
            title: value
          description: |-
            Image URLs (https) by map name as the game names it, a map in play or in its rotation
             (War Dogs: "Ozeti", "Europe"): the server card's picture. A "map/lighting" key
             ("Europe/DayClear") is the map in that lighting, tried before the plain name. At most 50.
        mapFallback:
          type: string
          title: map_fallback
          description: |-
            The image (https) for a map maps doesn't name; empty is gravel's generic placeholder, served
             by the hub, once the game has map images at all (maps or map_fallback set).
      title: GameSettings
      additionalProperties: false
      description: |-
        GameSettings are one game's settings, keyed by the game's id ("wardogs") in
         OrganizationSettings.games: its overlay on the theme and its links (gravel#66).
    gravel.hub.v1.GameTheme:
      type: object
      properties:
        light:
          allOf:
            - $ref: '#/components/schemas/gravel.hub.v1.ThemeTokens'
          title: light
          description: Only accent may be set; empty keeps the organization's.
        dark:
          allOf:
            - $ref: '#/components/schemas/gravel.hub.v1.ThemeTokens'
          title: dark
        bannerUrl:
          type: string
          title: banner_url
          description: 'An image at the top of the game''s pages: an https URL or a site-relative path, or empty.'
        bannerAlt:
          type: string
          title: banner_alt
          description: The banner's alternative text; empty when the banner is decorative.
      title: GameTheme
      additionalProperties: false
      description: |-
        GameTheme is a game's overlay on the organization's theme, applied to the game's pages: a
         server of the game, its moderation pages, and a board scoped to the game or one of its servers.
    gravel.hub.v1.GetBoardNameRequest:
      type: object
      title: GetBoardNameRequest
      additionalProperties: false
    gravel.hub.v1.GetBoardNameResponse:
      type: object
      properties:
        showName:
          type: boolean
          title: show_name
      title: GetBoardNameResponse
      additionalProperties: false
    gravel.hub.v1.GetBoardRequest:
      type: object
      properties:
        serverId:
          type: string
          title: server_id
          description: |-
            At most one of server_id and game_id; neither is the organization's board. A server's board
             counts its matches whatever its trust; a game's or the organization's counts Official
             servers' only (ADR-0011's trust mapping).
        gameId:
          type: string
          title: game_id
        window:
          type: string
          title: window
          description: '"week" (this week), "month" (this month), "season" (the named one), "all" (the default).'
        season:
          type: string
          title: season
        metric:
          type: string
          title: metric
          description: '"kills" (the default), "deaths", "kd", "time", "matches".'
        pageSize:
          type: integer
          title: page_size
          format: int32
        pageToken:
          type: string
          title: page_token
          description: The next_page_token of the previous page; empty for the first.
      title: GetBoardRequest
      additionalProperties: false
    gravel.hub.v1.GetBoardResponse:
      type: object
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/gravel.hub.v1.BoardEntry'
          title: entries
        nextPageToken:
          type: string
          title: next_page_token
        from:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: from
          description: The window's bounds; unset for "all".
        to:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: to
      title: GetBoardResponse
      additionalProperties: false
    gravel.hub.v1.GetMeRequest:
      type: object
      title: GetMeRequest
      additionalProperties: false
    gravel.hub.v1.GetMeResponse:
      type: object
      properties:
        user:
          allOf:
            - $ref: '#/components/schemas/gravel.hub.v1.User'
          title: user
      title: GetMeResponse
      additionalProperties: false
    gravel.hub.v1.GetMemberProfileRequest:
      type: object
      properties:
        userId:
          type: string
          title: user_id
          description: The member; empty is the logged-in caller.
      title: GetMemberProfileRequest
      additionalProperties: false
    gravel.hub.v1.GetMemberProfileResponse:
      type: object
      properties:
        userId:
          type: string
          title: user_id
        displayName:
          type: string
          title: display_name
        showName:
          type: boolean
          title: show_name
          description: The member chose to be shown by name on boards.
        self:
          type: boolean
          title: self
          description: The caller is the member.
        totals:
          type: array
          items:
            $ref: '#/components/schemas/gravel.hub.v1.ProfileTotals'
          title: totals
          description: All time, this week, this month and each season running now, counting Official servers.
        recent:
          type: array
          items:
            $ref: '#/components/schemas/gravel.hub.v1.PlayerMatch'
          title: recent
          description: Their most recent matches on any server, newest first.
        participation:
          type: array
          items:
            $ref: '#/components/schemas/gravel.hub.v1.ParticipationTotals'
          title: participation
          description: |-
            Their participation from first-party apps (ADR-0014) over the same windows as totals, one
             entry per window and kind they took part in, by window in totals' order, then kind.
      title: GetMemberProfileResponse
      additionalProperties: false
    gravel.hub.v1.GetOrganizationRequest:
      type: object
      title: GetOrganizationRequest
      additionalProperties: false
    gravel.hub.v1.GetOrganizationResponse:
      type: object
      properties:
        organization:
          allOf:
            - $ref: '#/components/schemas/gravel.hub.v1.Organization'
          title: organization
      title: GetOrganizationResponse
      additionalProperties: false
    gravel.hub.v1.GetOrganizationSettingsRequest:
      type: object
