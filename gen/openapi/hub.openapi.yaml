             player has no result for is absent; 0 is a reported zero.
      title: BoardEntry
      additionalProperties: false
      description: |-
        BoardEntry is one player on a board. A player who has not linked the identity, or has not
         chosen to be shown by name, appears under their pseudonym (pseudonymous true, no user_id).
