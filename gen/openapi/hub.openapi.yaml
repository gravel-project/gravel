openapi: 3.1.0
info:
  title: gravel hub
  description: The HTTP-JSON side of the gravel hub's Connect API. The same procedures serve gRPC and gRPC-Web.
  version: v1
  license:
    name: Apache-2.0
    identifier: Apache-2.0
paths:
  /gravel.hub.v1.IdentityService/GetMe:
    post:
      tags:
        - gravel.hub.v1.IdentityService
      summary: GetMe
      description: GetMe returns the caller and their linked identities.
      operationId: gravel.hub.v1.IdentityService.GetMe
      parameters:
        - name: Connect-Protocol-Version
          in: header
          description: Define the version of the Connect protocol
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: 1
        - name: Connect-Timeout-Ms
          in: header
          description: Define the timeout, in ms
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: 1000
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/gravel.hub.v1.GetMeRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/gravel.hub.v1.GetMeResponse'
  /gravel.hub.v1.IdentityService/ListIdentityEvents:
    post:
      tags:
        - gravel.hub.v1.IdentityService
      summary: ListIdentityEvents
      description: |-
        ListIdentityEvents returns the identity log after a position, oldest first: a reconciler's
         incremental pass. An app with identity:read, or the owner.
      operationId: gravel.hub.v1.IdentityService.ListIdentityEvents
      parameters:
        - name: Connect-Protocol-Version
          in: header
          description: Define the version of the Connect protocol
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: 1
        - name: Connect-Timeout-Ms
          in: header
          description: Define the timeout, in ms
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: 1000
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/gravel.hub.v1.ListIdentityEventsRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/gravel.hub.v1.ListIdentityEventsResponse'
  /gravel.hub.v1.IdentityService/ListUsers:
