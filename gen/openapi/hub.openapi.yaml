      type: object
      properties:
        channel:
          type: string
          title: channel
        servers:
          type: array
          items:
            type: string
          title: servers
          description: The servers whose results are posted, at most 50; none is every server.
      title: DiscordMatchResults
      additionalProperties: false
      description: |-
        Match results: each finished series a server's match plugin reported, posted once in the
         channel.
    gravel.hub.v1.DiscordNews:
      type: object
      properties:
        feeds:
          type: array
          items:
            $ref: '#/components/schemas/gravel.hub.v1.DiscordNewsFeed'
          title: feeds
          description: At most 20; a game once per channel.
      title: DiscordNews
      additionalProperties: false
      description: 'Steam news: each feed is one game''s announcements into one channel, posted as the bot finds them.'
    gravel.hub.v1.DiscordNewsFeed:
      type: object
      properties:
        appId:
          type: integer
          title: app_id
          format: int32
          description: 'The game''s Steam app id, as in its store URL: 730 for Counter-Strike 2.'
        channel:
          type: string
          title: channel
        label:
          type: string
          title: label
          description: The game's name in each post's footer, at most 64 characters.
        feeds:
          type: array
          items:
            type: string
          title: feeds
          description: Steam's feed names to read; none is "steam_community_announcements".
        color:
          type: integer
          title: color
          format: int32
          description: The posts' embed color as 0xRRGGBB; 0 is the bot's default.
      title: DiscordNewsFeed
      additionalProperties: false
      description: One game's Steam announcements posted into one channel.
    gravel.hub.v1.DiscordPresence:
      type: object
      properties:
        channel:
          type: string
          title: channel
        note:
          type: string
          title: note
          description: A line the host writes under the counts.
        games:
          type: array
          items:
            $ref: '#/components/schemas/gravel.hub.v1.DiscordPresenceGame'
          title: games
      title: DiscordPresence
      additionalProperties: false
      description: |-
        The "who's playing now" card: one message, edited when a count changes. Counts only; the hub
         and the bot keep no record of who played.
    gravel.hub.v1.DiscordPresenceGame:
      type: object
      properties:
        game:
          type: string
          title: game
          description: 'The line''s key, in the metrics: "wardogs".'
        label:
          type: string
          title: label
          description: 'What the card shows: "War Dogs".'
        activities:
          type: array
          items:
            type: string
          title: activities
          description: Activity names as Discord shows them ("WARDOGS"), compared without regard to case.
        applicationIds:
          type: array
          items:
            type: string
          title: application_ids
          description: The activities' Discord application ids.
      title: DiscordPresenceGame
      additionalProperties: false
      description: One game on the presence card and how its Discord activity is recognized.
    gravel.hub.v1.DiscordRecap:
      type: object
      properties:
        server:
          type: string
          title: server
          description: 'The server''s id in the hub: "htg-wardogs-1"; one rule per server.'
        channel:
          type: string
          title: channel
          description: Where the recap is posted.
        title:
          type: string
          title: title
          description: 'The session''s name in the post: "Wardogs Wednesday".'
        hours:
          type: array
          items:
            $ref: '#/components/schemas/gravel.hub.v1.DiscordSeedingHours'
          title: hours
          description: The sessions, as seeding's windows; none is a rule that never posts.
        floor:
          type: integer
          title: floor
          format: int32
          description: The player count "minutes at or above" counts against, 0 to 1000; 0 leaves it out.
        note:
          type: string
          title: note
          description: A line appended to the post, at most 200 characters.
      title: DiscordRecap
      additionalProperties: false
      description: After each of its weekly windows, the bot posts what the server's window held.
    gravel.hub.v1.DiscordRecognition:
      type: object
      properties:
        role:
          type: string
          title: role
        rule:
          type: string
          title: rule
          description: '"first_members": the first count members by registration.'
        count:
          type: integer
          title: count
          format: int32
        minMembers:
          type: integer
          title: min_members
          format: int32
          description: |-
            The rule stays off until the hub has this many registered members (gravel#181); 0 is no
             gate. A role given while it was on is never taken back.
      title: DiscordRecognition
      additionalProperties: false
      description: 'DiscordRecognition is a role earned once and kept: role sync adds it and never removes it.'
    gravel.hub.v1.DiscordRoles:
      type: object
      properties:
        linked:
          type: string
          title: linked
          description: The role for a member with any identity besides Discord; empty for none.
        providers:
          type: object
          title: providers
          additionalProperties:
            type: string
            title: value
          description: A provider ("steam") to the role for a member who linked it.
      title: DiscordRoles
      additionalProperties: false
      description: |-
        DiscordRoles are the roles that follow a member's linked identities; role sync adds and
         removes them.
    gravel.hub.v1.DiscordSeeding:
      type: object
      properties:
        server:
          type: string
          title: server
          description: 'The server''s id in the hub: "htg-wardogs-1"; one rule per server.'
        channel:
          type: string
          title: channel
          description: Where the call is posted.
        role:
          type: string
          title: role
          description: The opt-in seeder role the call pings; never the guild's id (@everyone).
        below:
          type: integer
          title: below
          format: int32
          description: 'The player count under which a call is due, 2 to 1000: the game''s floor (War Dogs, 20).'
        hours:
          type: array
          items:
            $ref: '#/components/schemas/gravel.hub.v1.DiscordSeedingHours'
          title: hours
          description: The weekly windows; at most 14. None is a rule that never calls.
        cooldown:
          type: string
          title: cooldown
          description: The least time between two calls, a Go duration from 15m to 24h; empty is 2h.
        callAtStart:
          type: boolean
          title: call_at_start
          description: |-
            Each window's first call goes out at its start, while the server is under below, without
             waiting out a cooldown left from before the window.
        note:
          type: string
          title: note
          description: 'A line appended to the call, at most 200 characters: how to join.'
      title: DiscordSeeding
      additionalProperties: false
      description: |-
        DiscordSeeding is when and where the bot calls for seeders for one server (ADR-0016): inside
         one of its windows, while the server is live and under below, at most once per cooldown. It
         pings role and nothing else. Outside every window nothing is posted.
    gravel.hub.v1.DiscordSeedingHours:
      type: object
      properties:
        days:
          type: array
          items:
            type: string
          title: days
        from:
          type: string
          title: from
        to:
          type: string
          title: to
      title: DiscordSeedingHours
      additionalProperties: false
      description: |-
        DiscordSeedingHours is one weekly window of a seeding rule, in StatsSettings.timezone: the days
         it starts on ("mon" … "sun") and the time of day from and to ("18:00", "23:00", 24-hour). A to
         before from ends the next day; a rule's windows do not overlap.
    gravel.hub.v1.DiscordServerCard:
      type: object
      properties:
        server:
          type: string
          title: server
          description: 'The server''s id in the hub: "htg-wardogs-1".'
        channel:
          type: string
          title: channel
        note:
          type: string
          title: note
          description: 'A line the host writes under the numbers: "Matches start at 20 players."'
      title: DiscordServerCard
      additionalProperties: false
      description: |-
        DiscordServerCard places one server's live status card in a channel: one message the bot edits
         in place.
    gravel.hub.v1.DiscordSettings:
      type: object
      properties:
        guildId:
          type: string
          title: guild_id
        roles:
          allOf:
            - $ref: '#/components/schemas/gravel.hub.v1.DiscordRoles'
          title: roles
        recognition:
          type: array
          items:
            $ref: '#/components/schemas/gravel.hub.v1.DiscordRecognition'
          title: recognition
        serverCards:
          type: array
          items:
            $ref: '#/components/schemas/gravel.hub.v1.DiscordServerCard'
          title: server_cards
        modLog:
          type: string
          title: mod_log
          description: The channel the bot posts every moderation action to (the audit log); empty is none.
        seeding:
          type: array
          items:
            $ref: '#/components/schemas/gravel.hub.v1.DiscordSeeding'
          title: seeding
          description: The seeding rules, at most 10 (the seeding module, ADR-0016).
        presence:
          allOf:
            - $ref: '#/components/schemas/gravel.hub.v1.DiscordPresence'
          title: presence
          description: The "who's playing now" card (the presence module, ADR-0017); unset is none.
        recaps:
          type: array
          items:
            $ref: '#/components/schemas/gravel.hub.v1.DiscordRecap'
          title: recaps
          description: The session recaps, at most 10, one per server (the recaps module, ADR-0018).
        streams:
          allOf:
            - $ref: '#/components/schemas/gravel.hub.v1.DiscordStreams'
          title: streams
          description: The go-live posts for the community's streamers (the streams module, ADR-0019); unset is none.
        news:
          allOf:
            - $ref: '#/components/schemas/gravel.hub.v1.DiscordNews'
          title: news
          description: The Steam news feeds (the news module); unset is none.
        matchResults:
          allOf:
            - $ref: '#/components/schemas/gravel.hub.v1.DiscordMatchResults'
          title: match_results
          description: The finished match results (the matchresults module, ADR-0024); unset is none.
        events:
          allOf:
            - $ref: '#/components/schemas/gravel.hub.v1.DiscordEvents'
          title: events
          description: The events feed (the events module, gravel#200); unset is none.
      title: DiscordSettings
      additionalProperties: false
      description: |-
        DiscordSettings is the guild the bot works in (ADR-0008): the roles role sync maps and the
         channels the server cards live in. Ids are Discord snowflakes as strings; empty means the bot
         has nothing to do.
    gravel.hub.v1.DiscordStreamer:
      type: object
      properties:
        platform:
          type: string
          title: platform
          description: '"twitch" or "kick".'
        login:
          type: string
          title: login
          description: 'The channel''s login on the platform, as in its URL: "hiddentoken" for twitch.tv/hiddentoken.'
        label:
          type: string
          title: label
          description: The name the post shows; the login when empty.
      title: DiscordStreamer
      additionalProperties: false
      description: One streamer the bot watches.
    gravel.hub.v1.DiscordStreams:
      type: object
      properties:
        channel:
          type: string
          title: channel
        role:
          type: string
          title: role
          description: A role the post pings when a stream starts (an opt-in role); empty pings no one.
        note:
          type: string
          title: note
          description: A line the host writes under each post.
        streamers:
          type: array
          items:
            $ref: '#/components/schemas/gravel.hub.v1.DiscordStreamer'
          title: streamers
          description: At most 10.
      title: DiscordStreams
      additionalProperties: false
      description: |-
        Go-live posts: one message per stream in the channel, edited when the stream ends. Stream
         metadata only; nothing about viewers is read.
    gravel.hub.v1.EraseIdentityRequest:
      type: object
      properties:
        provider:
          type: string
          title: provider
          description: 'The identity to erase: "steam" and a SteamID64.'
        subject:
          type: string
          title: subject
      title: EraseIdentityRequest
      additionalProperties: false
      description: |-
        StatsService is the stats boards (ADR-0012): counts from the hub's own polls of each server,
         keyed by provider identity, unlinked players under pseudonyms; and participation from
    gravel.hub.v1.EraseIdentityResponse:
      type: object
      properties:
        matchRows:
          type: integer
          title: match_rows
          format: int32
        monthlyRows:
          type: integer
          title: monthly_rows
          format: int32
        participationRows:
          type: integer
          title: participation_rows
          format: int32
        participationMonthlyRows:
          type: integer
          title: participation_monthly_rows
          format: int32
        ingestBatches:
          type: integer
          title: ingest_batches
          format: int32
        pseudonymDeleted:
          type: boolean
          title: pseudonym_deleted
        resultRows:
          type: integer
          title: result_rows
          format: int32
          description: Match results' player rows (ADR-0024), one per map the identity played; their names blanked.
        sessionRows:
          type: integer
          title: session_rows
          format: int32
          description: Player sessions and their monthly rows (ADR-0035).
        activityMonthlyRows:
          type: integer
          title: activity_monthly_rows
          format: int32
      title: EraseIdentityResponse
      additionalProperties: false
      description: EraseIdentityResponse counts what the erasure re-keyed; it never repeats the identity.
    gravel.hub.v1.Event:
      type: object
      properties:
        id:
          type: string
          title: id
          format: int64
        at:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: at
        kind:
          type: string
          title: kind
          description: 'A kind from the registry: "host.running", "moderation.ban", "role.granted"…'
        severity:
          type: string
          title: severity
          description: '"info", "notice", "warning" or "critical": fixed per kind.'
        actorUserId:
          type: string
          title: actor_user_id
        actorAppId:
          type: string
          title: actor_app_id
        onBehalfProvider:
          type: string
          title: on_behalf_provider
          description: The member an app said it acted for.
        onBehalfSubject:
          type: string
          title: on_behalf_subject
        serverId:
          type: string
          title: server_id
        gameId:
          type: string
          title: game_id
        subjectUserId:
          type: string
          title: subject_user_id
          description: The member the event is about (a grant, a link).
        summary:
          type: string
          title: summary
          description: One line a person reads.
        detail:
          type: object
          title: detail
          additionalProperties:
            type: string
            title: value
          description: A few words more, by name; never a secret, an address or a SteamID.
        requestId:
          type: string
          title: request_id
        actorName:
          type: string
          title: actor_name
          description: |-
            Who acted, by name as the hub has them now (a member's display name, an app's name), read
             with the event; empty when nobody did (the hub itself) or they are gone.
      title: Event
      additionalProperties: false
      description: 'Event is one entry of the events log (ADR-0028): what the hub did, who did it, to what.'
    gravel.hub.v1.EventKind:
      type: object
      properties:
        name:
          type: string
          title: name
          description: '"server.down".'
        group:
          type: string
          title: group
          description: 'Its family, the part before the dot: "server". ListEventsRequest.kinds takes either.'
        severity:
          type: string
          title: severity
          description: '"info", "notice", "warning" or "critical": fixed per kind.'
        about:
          type: string
          title: about
          description: What it means, in a line.
      title: EventKind
      additionalProperties: false
      description: EventKind is one kind of event the hub records.
    gravel.hub.v1.EventsSettings:
      type: object
      properties:
        retentionDays:
          type: integer
          title: retention_days
          format: int32
          description: Days an event is kept; 0 is the default, 400; else 30 to 3650.
      title: EventsSettings
      additionalProperties: false
      description: EventsSettings is how long the events log keeps what it holds (ADR-0028).
    gravel.hub.v1.ExportServersRequest:
      type: object
      title: ExportServersRequest
      additionalProperties: false
    gravel.hub.v1.ExportServersResponse:
      type: object
      properties:
        manifest:
          type: string
          title: manifest
          description: The stored games, locations and servers as a servers.yaml manifest.
      title: ExportServersResponse
      additionalProperties: false
    gravel.hub.v1.ExportSettingsRequest:
      type: object
      title: ExportSettingsRequest
      additionalProperties: false
      description: |-
        The settings as a YAML manifest over the API (gravel#201): what `gravel-hub settings` does on
         the host, for an operator's `gravel settings`. The hub parses, validates and compares the
         manifest with its own rules, so a client carries none of them.
    gravel.hub.v1.ExportSettingsResponse:
      type: object
      properties:
        manifest:
          type: string
          title: manifest
          description: The stored settings as a manifest, notifiers included.
        updatedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: updated_at
          description: 'When they were last written: ApplySettings'' if_updated_at.'
      title: ExportSettingsResponse
      additionalProperties: false
    gravel.hub.v1.FieldViolation:
      type: object
      properties:
        path:
          type: string
          title: path
        message:
          type: string
          title: message
      title: FieldViolation
      additionalProperties: false
      description: |-
        FieldViolation is one field of a settings document the hub refused (gravel#205), attached to an
         invalid_argument error as a detail, one per problem: the field's path as the manifest names it
         ("notifiers[0].url") and what is wrong with it. The error's message lists the same problems.
    gravel.hub.v1.FleetAlarm:
      type: object
      properties:
        kind:
          type: string
          title: kind
          description: |-
            "server.down" (down for 2 minutes), "server.credential_refused", "server.credential_missing",
             "host.failing", "backup.stale", "backup.failed", "wal.failing", "hub.unowned".
        severity:
          type: string
          title: severity
          description: '"warning" or "critical".'
        serverId:
          type: string
          title: server_id
          description: The server it is about; empty for the hub itself.
        since:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: since
        detail:
          type: string
          title: detail
          description: One line saying what is wrong.
      title: FleetAlarm
      additionalProperties: false
      description: |-
        FleetAlarm is something wrong that needs a person, open for as long as its cause lasts; it is
         computed on every read, never stored.
    gravel.hub.v1.FleetServer:
      type: object
      properties:
        id:
          type: string
          title: id
        name:
          type: string
          title: name
        gameId:
          type: string
          title: game_id
        gameName:
          type: string
          title: game_name
        trust:
          type: string
          title: trust
        driver:
          type: string
          title: driver
        health:
          type: string
          title: health
          description: '"up", "degraded", "down", "idle" (parked or absent, as asked) or "unknown" (not polled yet).'
        reason:
          type: string
          title: reason
          description: 'One line saying why: "answering", "not answering", "the host is booting", ...'
        healthSince:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: health_since
          description: Since when the health holds; unset when not known.
        state:
          type: string
          title: state
          description: The monitor's state (ServerStatus.state).
        players:
          type: integer
          title: players
          format: int32
        maxPlayers:
          type: integer
          title: max_players
          format: int32
        map:
          type: string
          title: map
        observedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: observed_at
          description: The last successful poll; unset when there was none.
        pollMs:
          type: integer
          title: poll_ms
          format: int32
          description: How long the last poll took, in milliseconds, and the failed polls in a row.
        misses:
          type: integer
          title: misses
          format: int32
        hostState:
          type: string
          title: host_state
          description: |-
            A cloud-VM server's host: its state and the code of the step it keeps failing; empty for a
             server whose host gravel doesn't make.
        hostErrorCode:
          type: string
          title: host_error_code
        leaseState:
          type: string
          title: lease_state
          description: 'The server''s live lease: "starting", "ready", "ending"; empty for none.'
      title: FleetServer
      additionalProperties: false
      description: FleetServer is one server's health, with what it is judged on.
    gravel.hub.v1.FleetTotals:
      type: object
      properties:
        servers:
          type: integer
          title: servers
          format: int32
        up:
          type: integer
          title: up
          format: int32
        degraded:
          type: integer
          title: degraded
          format: int32
        down:
          type: integer
          title: down
          format: int32
        idle:
          type: integer
          title: idle
          format: int32
        unknown:
          type: integer
          title: unknown
          format: int32
        players:
          type: integer
          title: players
          format: int32
          description: Players on, and public slots, over the servers that are not idle and have answered.
        capacity:
          type: integer
          title: capacity
          format: int32
      title: FleetTotals
      additionalProperties: false
      description: FleetTotals counts the fleet (gravel#190).
    gravel.hub.v1.Game:
      type: object
      properties:
        id:
          type: string
          title: id
          description: '"wardogs".'
        name:
          type: string
          title: name
        identityProvider:
          type: string
          title: identity_provider
          description: 'The provider its players are keyed by: "steam".'
        bands:
          type: array
          items:
            $ref: '#/components/schemas/gravel.hub.v1.Band'
          title: bands
        noPaidPerks:
          type: boolean
          title: no_paid_perks
          description: |-
            The publisher forbids any paid benefit (a supporter perk, a crowdfunding reward) that depends
             on the game's data or features.
        layout:
          allOf:
            - $ref: '#/components/schemas/gravel.hub.v1.GameLayout'
          title: layout
          description: How the pages show the game (the Game spec's layout).
        statExtensions:
          type: array
          items:
            $ref: '#/components/schemas/gravel.hub.v1.StatExtension'
          title: stat_extensions
          description: |-
            The game's own stats beyond kills and deaths (the Game spec's stats.extensions, ADR-0033), in
             the order the pages show them.
      title: Game
      additionalProperties: false
      description: |-
        Game is a game this hub's servers run: a Game spec gravel ships, with the deployment's
         tightenings of its bands applied.
    gravel.hub.v1.GameLayout:
      type: object
      properties:
        board:
          type: array
          items:
            type: string
          title: board
          description: A board's columns in order, each a GetBoardRequest metric; the first is the default ranking.
      title: GameLayout
      additionalProperties: false
      description: GameLayout is a game's page layout, declarative data from its Game spec.
    gravel.hub.v1.GameSettings:
      type: object
      properties:
        theme:
          allOf:
            - $ref: '#/components/schemas/gravel.hub.v1.GameTheme'
          title: theme
        nav:
          type: array
          items:
            $ref: '#/components/schemas/gravel.hub.v1.NavLink'
          title: nav
          description: |-
            Links shown on the game's pages, in the game's own navigation; at most 6. placement is
             unused and must be empty.
        maps:
          type: object
          title: maps
          additionalProperties:
            type: string
            title: value
          description: |-
            Image URLs (https) by map name as the game names it, a map in play or in its rotation
             (War Dogs: "Ozeti", "Europe"): the server card's picture. A "map/lighting" key
             ("Europe/DayClear") is the map in that lighting, tried before the plain name. At most 50.
        mapFallback:
          type: string
          title: map_fallback
          description: |-
            The image (https) for a map maps doesn't name; empty is gravel's generic placeholder, served
             by the hub, once the game has map images at all (maps or map_fallback set).
      title: GameSettings
      additionalProperties: false
      description: |-
        GameSettings are one game's settings, keyed by the game's id ("wardogs") in
         OrganizationSettings.games: its overlay on the theme and its links (gravel#66).
    gravel.hub.v1.GameTheme:
      type: object
      properties:
        light:
          allOf:
            - $ref: '#/components/schemas/gravel.hub.v1.ThemeTokens'
          title: light
          description: Only accent may be set; empty keeps the organization's.
        dark:
          allOf:
            - $ref: '#/components/schemas/gravel.hub.v1.ThemeTokens'
          title: dark
        bannerUrl:
          type: string
          title: banner_url
          description: 'An image at the top of the game''s pages: an https URL or a site-relative path, or empty.'
        bannerAlt:
