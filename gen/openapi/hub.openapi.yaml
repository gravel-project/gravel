          title: dry_run
          description: Say what would change and change nothing.
      title: ApplyServersRequest
      additionalProperties: false
    gravel.hub.v1.ApplyServersResponse:
      type: object
      properties:
        changes:
          type: array
          items:
            type: string
          title: changes
          description: Each change, "server htg-wardogs-1 changed"; empty when nothing would change.
        applied:
          type: boolean
          title: applied
          description: Whether the changes were made (false on a dry run, and when there were none).
      title: ApplyServersResponse
      additionalProperties: false
    gravel.hub.v1.ApplySettingsRequest:
      type: object
      properties:
        manifest:
          type: string
          title: manifest
          description: A settings manifest, the whole of it.
        dryRun:
          type: boolean
          title: dry_run
          description: Say what would change and change nothing.
        ifUpdatedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: if_updated_at
          description: 'As UpdateOrganizationSettings'': the updated_at the caller read; aborted when they changed since.'
      title: ApplySettingsRequest
      additionalProperties: false
    gravel.hub.v1.ApplySettingsResponse:
      type: object
      properties:
        changes:
          type: array
          items:
            type: string
          title: changes
          description: |-
            The top-level sections that differ from the stored settings, sorted ("discord", "nav");
             empty when nothing would change.
        applied:
          type: boolean
          title: applied
          description: Whether the changes were made (false on a dry run, and when there were none).
        summary:
          type: string
          title: summary
          description: The manifest in one line, as CheckSettings has it.
      title: ApplySettingsResponse
      additionalProperties: false
    gravel.hub.v1.AuditEntry:
      type: object
      properties:
        id:
          type: string
          title: id
          format: int64
        at:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: at
        userId:
          type: string
          title: user_id
          description: |-
            Who asked: a user (user_id), an app (app_id and app_name), or a member through an app's
             token (both: the member acted, through that app; ADR-0015).
        appId:
          type: string
          title: app_id
        appName:
          type: string
          title: app_name
        onBehalfOf:
          allOf:
            - $ref: '#/components/schemas/gravel.hub.v1.Actor'
          title: on_behalf_of
          description: |-
            The person an app acting for itself acted for; unset for a user and for a member through
             an app.
        serverId:
          type: string
          title: server_id
        action:
          type: string
          title: action
          description: '"kick", "ban", "unban", "message", "broadcast" or "move_player".'
        targetProvider:
          type: string
          title: target_provider
          description: The player acted on, at the game's provider; empty for a broadcast.
        targetSubject:
          type: string
          title: target_subject
        reason:
          type: string
          title: reason
        message:
          type: string
          title: message
          description: The message sent (message, broadcast).
        team:
          type: string
          title: team
          description: The team moved to and whether the player was respawned (move_player).
        respawn:
          type: boolean
          title: respawn
        requestId:
          type: string
          title: request_id
        outcome:
          type: string
          title: outcome
          description: |-
            "ok", "player_not_found", "ban_not_found", "rejected", "not_available",
             "moved_not_respawned", "unreachable", "credential_refused", "credential_missing",
             "rate_limited" or "error"; empty while the call has no recorded result (the hub stopped
             mid-call). The cause of a failure is in the hub's log, never here.
        finishedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: finished_at
        userName:
          type: string
          title: user_name
          description: The acting member's display name, when a member acted (user_id).
      title: AuditEntry
      additionalProperties: false
      description: |-
        AuditEntry is one moderation call the hub made to a server. It is recorded before the call and
         finished once with the outcome; nothing changes it after that, and nothing deletes it.
    gravel.hub.v1.AuthorizationParams:
      type: object
      properties:
        responseType:
          type: string
          title: response_type
          description: '"code", the only response type.'
        clientId:
          type: string
          title: client_id
        redirectUri:
          type: string
          title: redirect_uri
          description: Exactly one of the redirect URIs the app registered; required.
        scope:
          type: string
          title: scope
          description: Space-separated scopes, each one the app holds; empty asks for sign-in only (GetMe).
        codeChallenge:
          type: string
          title: code_challenge
          description: 'The PKCE challenge: the unpadded base64url SHA-256 of the app''s verifier.'
        codeChallengeMethod:
          type: string
          title: code_challenge_method
          description: '"S256", the only method.'
      title: AuthorizationParams
      additionalProperties: false
      description: |-
        AuthorizationParams are an authorization request's parameters as the app sent them to
         /oauth/authorize (RFC 6749 §4.1.1 with RFC 7636 §4.3). The state is the page's to carry back
         and never reaches the API.
    gravel.hub.v1.AuthorizeRequest:
      type: object
      properties:
        params:
          allOf:
            - $ref: '#/components/schemas/gravel.hub.v1.AuthorizationParams'
          title: params
      title: AuthorizeRequest
      additionalProperties: false
    gravel.hub.v1.AuthorizeResponse:
      type: object
      properties:
        code:
          type: string
          title: code
          description: The authorization code, shown once; it lives 60 seconds.
        scopes:
          type: array
          items:
            type: string
          title: scopes
          description: The scopes the code carries.
      title: AuthorizeResponse
      additionalProperties: false
    gravel.hub.v1.Ban:
      type: object
      properties:
        provider:
          type: string
          title: provider
        subject:
          type: string
          title: subject
        bannedAt:
          allOf:
