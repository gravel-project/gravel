        gameId:
          type: string
          title: game_id
        location:
          type: string
          title: location
          description: 'Where it runs: "qonzer-slc".'
        trust:
          type: string
          title: trust
          description: '"official" or "community".'
        seeding:
          allOf:
            - $ref: '#/components/schemas/gravel.hub.v1.Seeding'
          title: seeding
          description: Unset when the server does not seed.
