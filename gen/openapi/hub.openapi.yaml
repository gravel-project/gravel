  /gravel.hub.v1.IdentityService/SetUserRole:
    post:
      tags:
        - gravel.hub.v1.IdentityService
      summary: SetUserRole
      description: |-
        SetUserRole grants or revokes a member's role, instance-wide or for one game (ADR-0027 §5):
         roles:grant for that scope; only the owner changes an admin grant; an app changes moderator
         only; nobody changes their own. Every change is recorded with who made it.
      operationId: gravel.hub.v1.IdentityService.SetUserRole
      parameters:
        - name: Connect-Protocol-Version
          in: header
          description: Define the version of the Connect protocol
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: 1
        - name: Connect-Timeout-Ms
          in: header
          description: Define the timeout, in ms
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: 1000
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/gravel.hub.v1.SetUserRoleRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/gravel.hub.v1.SetUserRoleResponse'
  /gravel.hub.v1.IdentityService/StartProof:
    post:
      tags:
        - gravel.hub.v1.IdentityService
      summary: StartProof
      description: |-
        StartProof draws a one-time code the caller types in a game server's chat to prove the account
         they play as (gravel#5): the server's log names the account, and the hub links it to the
         caller (or proves an existing link again; another member's account stays theirs). Good for ten
         minutes and once; a new code replaces the open one. In person only; five codes an hour
         (resource_exhausted past that).
      operationId: gravel.hub.v1.IdentityService.StartProof
      parameters:
        - name: Connect-Protocol-Version
          in: header
          description: Define the version of the Connect protocol
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: 1
        - name: Connect-Timeout-Ms
          in: header
          description: Define the timeout, in ms
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: 1000
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/gravel.hub.v1.StartProofRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/gravel.hub.v1.StartProofResponse'
  /gravel.hub.v1.IdentityService/UnlinkIdentity:
    post:
      tags:
        - gravel.hub.v1.IdentityService
      summary: UnlinkIdentity
      description: |-
        UnlinkIdentity removes one of the caller's identities. The last one is refused
         (failed_precondition): a provider-only account would be unreachable.
      operationId: gravel.hub.v1.IdentityService.UnlinkIdentity
      parameters:
        - name: Connect-Protocol-Version
          in: header
          description: Define the version of the Connect protocol
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: 1
        - name: Connect-Timeout-Ms
          in: header
