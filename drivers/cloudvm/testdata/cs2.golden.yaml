#cloud-config
# A gravel game host (the cloud-VM driver, ADR-0003) for server cs2-1, made by the hub.
# Anything on the instance can read this document from the metadata service, so it holds no
# secret: the hub pushes the game's environment file over SSH once the host is up.
#
# The data volume is the runtime user's home. Everything stateful lives there: podman's storage
# (images, volumes, the secret store), the units, the configuration. A replacement instance that
# boots this document on the same volume comes back as it was; the first boot of a volume is the
# only one that formats it or installs anything into it.
# The hostname is set in runcmd: cloud-init's own attempt runs before the system bus is up on
# Fedora, fails once and marks the whole run degraded even though its retry succeeds.
preserve_hostname: true
timezone: Etc/UTC
ssh_pwauth: false
disable_root: true

# Format the volume only if it holds no filesystem yet, then mount it as the runtime user's home.
# disk_setup and mounts run before users_groups, so the user is created onto the mounted home.
fs_setup:
  - label: gravel-data
    filesystem: ext4
    device: /dev/disk/by-id/scsi-0DO_Volume_cs2-1-data
    overwrite: false
mounts:
  - [ "LABEL=gravel-data", "/home/gravel", "ext4", "defaults,nofail,x-systemd.device-timeout=60s", "0", "2" ]

# admin maintains the OS (sudo). The runtime user runs the hub's rootless containers and has no
# sudo; its uid and subordinate id ranges are fixed (bootcmd below), so the files on the volume
# belong to the same ids on every instance that mounts it.
users:
  - name: admin
    groups: [wheel]
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    shell: /bin/bash
    lock_passwd: true
    ssh_authorized_keys:
      - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGravelTestKeyGravelTestKeyGravelTestKey000 gravel-hub"
  - name: gravel
    uid: 1100
    homedir: /home/gravel
    shell: /bin/bash
    lock_passwd: true
    ssh_authorized_keys:
      - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGravelTestKeyGravelTestKeyGravelTestKey000 gravel-hub"

# Before useradd: the runtime user's subordinate ids, so useradd keeps them instead of choosing
# the next free range (which would depend on the order users were made).
bootcmd:
  - [ sh, -c, "grep -q '^gravel:' /etc/subuid 2>/dev/null || echo 'gravel:524288:65536' >> /etc/subuid" ]
  - [ sh, -c, "grep -q '^gravel:' /etc/subgid 2>/dev/null || echo 'gravel:524288:65536' >> /etc/subgid" ]

package_update: true
package_upgrade: false
packages:
  - podman
  - dnf5-plugin-automatic

write_files:
  - path: /etc/ssh/sshd_config.d/10-gravel.conf
    permissions: "0644"
    content: |
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
  # Security updates only, applied by dnf-automatic's daily timer; no automatic reboot.
  - path: /etc/dnf/automatic.conf
    permissions: "0644"
    content: |
      [commands]
      upgrade_type = security
      apply_updates = yes
      reboot = never
      [emitters]
      emit_via = stdio
  - path: /usr/local/libexec/gravel/first-boot
    permissions: "0755"
    content: |
      #!/bin/bash
      # gravel game host for cs2-1, on the first boot of every instance (cloud-init runcmd runs
      # once per instance, so also on one that replaces an earlier instance on the same volume).
      set -euo pipefail
      user=gravel
      home=/home/$user
      home_marker=$home/.gravel-home

      mountpoint -q "$home" || { echo "first-boot: $home is not mounted: is the data volume attached?" >&2; exit 1; }

      # The volume's first boot: give the home to the user, with the usual dotfiles and SELinux labels.
      # On a later instance the volume already carries all of it, and relabelling podman's storage
      # would be wrong, so nothing here runs twice.
      if [[ ! -e "$home_marker" ]]; then
        chown "$user:$user" "$home"
        chmod 0700 "$home"
        cp -r --update=none /etc/skel/. "$home/"
        chown -R "$user:$user" "$home"
        restorecon -R "$home"
        install -o "$user" -g "$user" -m 0644 /dev/null "$home_marker"
      fi

      # The user's systemd instance outlives logins (linger lives on the root disk, so every instance
      # sets it); wait for it before talking to it.
      loginctl enable-linger "$user"
      uid=$(id -u "$user")
      for _ in $(seq 1 60); do
        [[ -S /run/user/$uid/bus ]] && break
        sleep 1
      done
      as_user() { runuser -u "$user" -- env HOME="$home" XDG_RUNTIME_DIR="/run/user/$uid" DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$uid/bus" "$@"; }

      # The game's unit, installed on every new instance (the root disk is new; the volume keeps the
      # install and the environment file). Until the hub pushes the environment file over SSH the unit's
      # condition skips it; on an instance that replaces another the file is already there and it starts.
      as_user mkdir -p "$home/.config/containers/systemd" "$home/.config/cs2" "$home/cs2"
      install -o "$user" -g "$user" -m 0644 /usr/local/share/gravel/cs2.container "$home/.config/containers/systemd/cs2.container"
      restorecon -R "$home/.config"
      as_user systemctl --user daemon-reload
      as_user systemctl --user start cs2.service || true
      install -o "$user" -g "$user" -m 0644 /dev/null "$home/.gravel-boot-done"

      echo "first-boot: done"
  - path: /usr/local/share/gravel/cs2.container
    permissions: "0644"
    content: |
      # Written by the gravel hub (the cloud-VM driver, ADR-0003) for server cs2-1: Counter-Strike 2
      # in its container. The environment file holds the server's settings and secrets; the hub pushes
      # it over SSH, never in cloud-init, and the unit waits for it. The game's install lives on the data
      # volume (~/cs2), so a new instance on the same volume starts without downloading it again.
      [Unit]
      Description=Counter-Strike 2 (cs2-1)
      ConditionPathExists=%h/.config/cs2/env

      [Container]
      Image=ghcr.io/joedwards32/cs2:5.0.0@sha256:90e6ef414ec29da557b9e615e7a86dd992606689a9bae31334805cf6e5d92531
      ContainerName=cs2
      Network=host
      UserNS=keep-id:uid=1000,gid=1000
      Volume=%h/cs2:/home/steam/cs2-dedicated:Z
      EnvironmentFile=%h/.config/cs2/env

      [Service]
      Restart=always
      RestartSec=10
      # The image is pulled at the first start.
      TimeoutStartSec=900

      [Install]
      WantedBy=default.target

runcmd:
  - [ hostnamectl, set-hostname, cs2-1 ]
  - [ systemctl, enable, --now, dnf5-automatic.timer ]
  - [ systemctl, reload, sshd ]
  - [ /usr/local/libexec/gravel/first-boot ]
