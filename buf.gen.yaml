version: v2
clean: true
plugins:
  - local: protoc-gen-go
    out: gen
    opt: paths=source_relative
  - local: protoc-gen-connect-go
    out: gen
    opt: paths=source_relative
  - local: protoc-gen-connect-openapi
    out: gen/openapi
    opt:
      - base=proto/openapi.base.yaml
      - path=hub.openapi.yaml
      - format=yaml
