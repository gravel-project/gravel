# goreleaser v2. CI's release-config job validates this file on every PR; release.yml runs it on a tag.
# (goreleaser can't be `go install`ed, its module uses replace directives, so there is no local pin.)
version: 2
project_name: gravel

# The hub embeds the admin dashboard (ADR-0029); the archives and the ko images build from the tree,
# so the bundle is built into it first (release.yml sets up node).
before:
  hooks:
    - make admin

builds:
  - id: gravel-hub
    main: ./cmd/gravel-hub
    binary: gravel-hub
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}

  - id: gravel-bot
    main: ./cmd/gravel-bot
    binary: gravel-bot
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
  # The operator's CLI (ADR-0020): an archive on the release, no image. It runs on the operator's
  # machine, so macOS too.
  - id: gravel
    main: ./cmd/gravel
    binary: gravel
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: gravel-hub
    ids:
      - gravel-hub
    formats:
      - tar.gz
    name_template: "gravel-hub_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
  - id: gravel-bot
    ids:
      - gravel-bot
    formats:
      - tar.gz
    name_template: "gravel-bot_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
  - id: gravel
    ids:
      - gravel
    formats:
      - tar.gz
    name_template: "gravel_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive

kos:
  - id: gravel-hub
    build: gravel-hub
    main: ./cmd/gravel-hub
    repositories:
      - ghcr.io/gravel-project/gravel-hub
    bare: true
    base_image: gcr.io/distroless/static-debian12:nonroot
    platforms:
      - linux/amd64
      - linux/arm64
    tags:
      - "{{ .Version }}"
      - latest
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    sbom: spdx
    labels:
      org.opencontainers.image.source: https://github.com/gravel-project/gravel
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.licenses: Apache-2.0

  - id: gravel-bot
    build: gravel-bot
    main: ./cmd/gravel-bot
    repositories:
      - ghcr.io/gravel-project/gravel-bot
    bare: true
    base_image: gcr.io/distroless/static-debian12:nonroot
    platforms:
      - linux/amd64
      - linux/arm64
    tags:
      - "{{ .Version }}"
      - latest
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    sbom: spdx
    labels:
      org.opencontainers.image.source: https://github.com/gravel-project/gravel
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.licenses: Apache-2.0
docker_signs:
  - cmd: cosign
    artifacts: all
    args:
      - sign
      - "${artifact}@${digest}"
      - --yes

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^chore"
      - "^ci"

release:
  github:
    owner: gravel-project
    name: gravel
  draft: false
  prerelease: auto
