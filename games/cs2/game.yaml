# The Counter-Strike 2 Game spec gravel ships. Its cloudvm section is how the cloud-VM driver
# (ADR-0003) runs a server on a VM the hub makes.
id: cs2
name: Counter-Strike 2
# Logs carry SteamID3 ([U:1:N]); gravel keys players by the SteamID64 it converts to.
identity_provider: steam
drivers: [cloudvm]
plugins:
  # Valve's server guidelines forbid item spoofing (weapon skins, knives, gloves, stickers, music
  # kits, fake ranks or coins). The penalty is every GSLT on the operator's account disabled and
  # the account barred from making new ones: https://blog.counter-strike.net/server_guidelines/
  deny:
    - match: weaponpaint
      reason: weapon skins are item spoofing (Valve server guidelines)
    - match: skin
      reason: skins are item spoofing (Valve server guidelines)
    - match: knife
      reason: knives are item spoofing (Valve server guidelines)
    - match: glove
      reason: gloves are item spoofing (Valve server guidelines)
    - match: sticker
      reason: stickers are item spoofing (Valve server guidelines)
    - match: musickit
      reason: music kits are item spoofing (Valve server guidelines)
    - match: inventory
      reason: inventory changers are item spoofing (Valve server guidelines)
    - match: fakerank
      reason: fake ranks are forbidden (Valve server guidelines)
    - match: coin
      reason: fake coins are forbidden (Valve server guidelines)
# CS2 items are never a paid benefit, and supporter reserved slots are a grey area under the same
# guidelines: off until counsel says otherwise.
no_paid_perks: true

# How a CS2 server runs on a VM the hub makes (the cloud-VM driver, ADR-0003): joedwards32/cs2, the
# maintained image the community runs (steamrt4; it runs SteamCMD's app_update 730 at every start,
# so a restart is the patch-day step), with its ~60 GB install on the data volume. The hub writes the
# environment file it reads over SSH; nothing here is secret.
cloudvm:
  image: ghcr.io/joedwards32/cs2:5.0.0@sha256:90e6ef414ec29da557b9e615e7a86dd992606689a9bae31334805cf6e5d92531
  runtime_uid: 1000                       # the image's steam user
  install_dir: /home/steam/cs2-dedicated
  volume_min_gib: 100                     # the install was 73.4 GB on 2026-10-12 and grows with updates
  log_timezone: Etc/UTC                   # the image's
  ready_timeout: 90m                      # a first start downloads the install (~31 min at DigitalOcean's 40 MB/s)
  ports:
    - {name: game, protocol: udp, port: 27015, public: true}
    - {name: rcon, protocol: tcp, port: 27015, public: false}   # the game port over TCP; the hub only
    - {name: tv, protocol: udp, port: 27020, public: true, when: tv}
  rcon_port: 27015
  join_port: 27015
  join_hint: "In CS2's console: connect <address>; password <password>. The password is shared where you found this server."
  env:
    CS2_PORT: "27015"
    CS2_LAN: "0"
    CS2_LOG: "on"
    # The image warns that hibernation crashes the server, and a hibernating server would not
    # answer the hub's status polls.
    CS2_SERVER_HIBERNATE: "0"
    TV_PORT: "27020"
  secrets:
    rcon_password: CS2_RCONPW
    join_password: CS2_PW
    publisher_token: SRCDS_TOKEN          # a Game Server Login Token, when the server needs one
    feed_url: CS2_LOG_HTTP_URL            # logaddress_add_http: the hub's ingest route, token in the path
  settings:
    # The image sed-substitutes the name into server.cfg and evals its command line, so the name is
    # held to characters neither treats specially (no slash, quote, backslash, dollar or semicolon),
    # and the image's free-form CS2_ADDITIONAL_ARGS is not offered at all.
    - {key: server_name, env: CS2_SERVERNAME, type: string, max_length: 64, default_from: name, pattern: '[A-Za-z0-9 _.,:!#|()+@-]+'}
    - {key: game_alias, env: CS2_GAMEALIAS, type: enum, values: [competitive, wingman, casual, deathmatch, custom], default: competitive, conflicts: [game_type, game_mode]}
    - {key: game_type, env: CS2_GAMETYPE, type: int, min: 0, max: 6, conflicts: [game_alias]}
    - {key: game_mode, env: CS2_GAMEMODE, type: int, min: 0, max: 3, requires: [game_type], conflicts: [game_alias]}
    - {key: map_group, env: CS2_MAPGROUP, type: string, pattern: 'mg_[a-z0-9_]+', default: mg_active}
    - {key: start_map, env: CS2_STARTMAP, type: string, pattern: '[a-z0-9_]+', max_length: 64, default: de_inferno}
    - {key: max_players, env: CS2_MAXPLAYERS, type: int, min: 2, max: 64, default: "10"}
    - {key: tv, env: TV_ENABLE, type: bool, default: "false"}
  # The sizes a server with a scaling policy moves through as it fills (#37), DigitalOcean's
  # dedicated-CPU plans; each rung's players become max_players. Measured on HTG's server
  # (2026-10-12): c-2 to c-4 in place is 2 min 21 s from request to playable, back is 2 min 31 s,
  # and the root disk stays c-2's 25 GB, so the way down stays open.
  ladder:
    - {size: c-2, players: 10}
    - {size: c-4, players: 20}
  players_setting: max_players
  # Files the hub keeps in the install on the volume, rewritten with the environment and put back
  # when edited (#170). The image's entry.sh sources pre.sh in its own shell right before it
  # starts the server, and copies its own no-op only when the file is absent.
  hooks:
    - path: pre.sh
      content: |
        #!/bin/bash
        # gravel's pre-start hook for Counter-Strike 2. The hub writes this file and puts it back
        # when it changes; edit games/cs2/game.yaml instead.
        #
        # The server prints its command line, and the image passes the game server login token, the
        # RCON password and the join password on it (+sv_setsteamaccount, +rcon_password,
        # +sv_password). From here on everything the container prints reaches the journal through a
        # filter that masks those three values (gravel#170) and any bearer token (gravel#176). The
        # filter is a process substitution, not a wrapper, so the image's entry.sh stays the
        # container's first process: stop signals, the RCON quit and the unit's restarts are
        # unchanged.
        exec > >(exec sed -u -E -e 's/([Bb]earer[[:space:]]+)[^"[:space:]]+/\1[redacted]/g' -e 's/((sv_setsteamaccount|rcon_password|sv_password)"?[[:space:]=]+"?)[^"[:space:]]+/\1[redacted]/g') 2>&1
        echo "gravel pre-hook: the login token and passwords are masked from here on"

        # The plugin channel (gravel#176): the server runs a pinned plugin set or runs vanilla, as the
        # environment file the hub writes says. SteamCMD has already updated the install when this
        # runs, and the update rewrites game/csgo/gameinfo.gi, so the file is patched at every start.
        #
        #   GRAVEL_PLUGINS             "" runs vanilla; "matchzy" runs Metamod:Source,
        #                              CounterStrikeSharp and MatchZy.
        #   GRAVEL_PLUGIN_FILES        The pinned files, space-separated, each url|sha256|kind|dest:
        #                              kind is tar.gz or zip, and dest is a directory relative to
        #                              game/csgo (normally "."). They come from the Game spec.
        #   GRAVEL_MATCHZY_EVENTS_URL  Where MatchZy posts its match events (matchzy_remote_log_url).
        #   GRAVEL_MATCHZY_DEMO_URL    Where MatchZy uploads its demos, when set.
        #   GRAVEL_MATCHZY_TOKEN       The bearer token MatchZy sends to both. It is never printed.
        #   GRAVEL_MATCH_FILE          A match configuration the hub pushed under game/csgo (such as
        #                              gravel-match.json). This hook leaves it alone: the hub loads it
        #                              over RCON once the server is up.
        #
        # A file is fetched once into .gravel/plugins/<sha256> on the volume and checked against its
        # pin at every start. The outcome is one line in .gravel/plugins.status for the hub to read:
        # "ok matchzy", "vanilla off" when no plugins were asked for, or "vanilla <reason>" when a step
        # failed. A failure never stops the server: it starts vanilla, with the Metamod search path
        # removed so the plugins on disk stay inert.
        #
        # Everything runs in a subshell, so nothing here can end entry.sh or leave a variable behind.
        gravel_plugins() (
          set +eu
          say() { printf 'gravel pre-hook: %s\n' "$*"; }
          if [[ -z ${STEAMAPPDIR:-} ]]; then
            say "STEAMAPPDIR is not set, so plugins are left alone"
            return 0
          fi
          local csgo=$STEAMAPPDIR/game/csgo state=$STEAMAPPDIR/.gravel
          local gameinfo=$csgo/gameinfo.gi
          mkdir -p "$state/plugins" || say "could not make $state/plugins"

          status() {
            if printf '%s\n' "$1" > "$state/plugins.status.tmp" && mv -f "$state/plugins.status.tmp" "$state/plugins.status"; then
              say "status: $1"
            else
              say "could not write $state/plugins.status"
            fi
          }
          # strip removes Metamod's search path from gameinfo.gi, which turns every plugin off.
          strip() {
            [[ -f $gameinfo ]] || return 0
            grep -Eq '^[[:space:]]*Game[[:space:]]+csgo/addons/metamod[[:space:]]*$' "$gameinfo" || return 0
            if sed -E -i '\#^[[:space:]]*Game[[:space:]]+csgo/addons/metamod[[:space:]]*$#d' "$gameinfo"; then
              say "removed Metamod's search path from gameinfo.gi"
            else
              say "could not remove Metamod's search path from gameinfo.gi"
            fi
          }
          fail() {
            say "$1, so the server starts vanilla"
            strip
            status "vanilla $1"
          }
          fetch() {
            if command -v wget > /dev/null; then
              wget -q --tries=3 --timeout=60 -O "$2" "$1"
            elif command -v curl > /dev/null; then
              curl -fsSL --retry 3 --connect-timeout 60 --max-time 900 -o "$2" "$1"
            else
              say "neither wget nor curl is here"
              return 1
            fi
          }

          case ${GRAVEL_PLUGINS:-} in
            '')
              say "no plugins asked for, so the server runs vanilla"
              strip
              status "vanilla off"
              return 0
              ;;
            matchzy) say "plugin set matchzy asked for" ;;
            *)
              fail "GRAVEL_PLUGINS names a plugin set this hook does not know"
              return 0
              ;;
          esac

          # The config's values go between double quotes in a file the server executes, so a quote, a
          # semicolon or a line break would end the value and start another command.
          local name value bad=$'["\n\r;]'
          for name in GRAVEL_MATCHZY_EVENTS_URL GRAVEL_MATCHZY_DEMO_URL GRAVEL_MATCHZY_TOKEN; do
            value=${!name:-}
            if [[ $value =~ $bad ]]; then
              fail "$name holds a quote, semicolon or line break, which MatchZy's config cannot carry"
              return 0
            fi
          done
          if [[ ! -f $gameinfo ]]; then
            fail "$gameinfo is missing"
            return 0
          fi

          local -a entries
          read -r -a entries <<< "${GRAVEL_PLUGIN_FILES:-}"
          if ((${#entries[@]} == 0)); then
            fail "GRAVEL_PLUGIN_FILES pins no files"
            return 0
          fi
          local entry url sum kind dest extra cache got file
          for entry in "${entries[@]}"; do
            IFS='|' read -r url sum kind dest extra <<< "$entry"
            if [[ -n $extra || ! $url =~ ^https?://[^[:space:]]+$ || ! $sum =~ ^[0-9a-f]{64}$ || ! $kind =~ ^(tar\.gz|zip)$ ||
              ! $dest =~ ^[A-Za-z0-9._/-]+$ || $dest == /* || /$dest/ == */../* ]]; then
              fail "GRAVEL_PLUGIN_FILES holds an entry that is not url|sha256|tar.gz or zip|relative dest"
              return 0
            fi
            file=${url##*/}
            cache=$state/plugins/$sum
            if [[ -f $cache ]]; then
              read -r got _ < <(sha256sum "$cache")
              if [[ $got == "$sum" ]]; then
                say "$file is cached"
                continue
              fi
              say "the cached $file does not match its pin, so it is fetched again"
              rm -f "$cache"
            fi
            say "fetching $url"
            if ! fetch "$url" "$cache.part"; then
              rm -f "$cache.part"
              fail "fetching $file failed"
              return 0
            fi
            read -r got _ < <(sha256sum "$cache.part")
            if [[ $got != "$sum" ]]; then
              rm -f "$cache.part"
              fail "$file has sha256 $got, not its pinned $sum"
              return 0
            fi
            mv -f "$cache.part" "$cache" || { fail "could not keep $file in $state/plugins"; return 0; }
            say "$file matches its pin"
          done

          # The files are unpacked again only when the pins change or the addons directory is gone, so
          # a config edited on the volume survives a restart.
          local pins="${entries[*]}" marker=$csgo/addons/.gravel-unpacked
          if [[ -f $marker && $(< "$marker") == "$pins" ]]; then
            say "the pinned files are already unpacked"
          else
            for entry in "${entries[@]}"; do
              IFS='|' read -r url sum kind dest _ <<< "$entry"
              file=${url##*/}
              mkdir -p "$csgo/$dest" || { fail "could not make $csgo/$dest"; return 0; }
              if [[ $kind == zip ]]; then
                unzip -o -q "$state/plugins/$sum" -d "$csgo/$dest"
              else
                tar -xzf "$state/plugins/$sum" -C "$csgo/$dest"
              fi || { fail "unpacking $file failed"; return 0; }
              say "unpacked $file into game/csgo/$dest"
            done
            mkdir -p "$csgo/addons" && printf '%s\n' "$pins" > "$marker" || { fail "could not write $marker"; return 0; }
          fi

          # MatchZy's config keeps every line it ships; only the keys below are replaced, and a key
          # whose value is not set is left out.
          local cfg=$csgo/cfg/MatchZy/config.cfg
          local note="// The lines below are written by gravel's pre.sh at every start."
          local -a keys=(matchzy_remote_log_url matchzy_remote_log_header_key matchzy_remote_log_header_value
            matchzy_demo_upload_url matchzy_demo_upload_header_key matchzy_demo_upload_header_value
            matchzy_autostart_mode matchzy_kick_when_no_match_loaded)
          config() {
            local line events=${GRAVEL_MATCHZY_EVENTS_URL:-} demo=${GRAVEL_MATCHZY_DEMO_URL:-} token=${GRAVEL_MATCHZY_TOKEN:-}
            if [[ -f $cfg ]]; then
              while IFS= read -r line || [[ -n $line ]]; do
                [[ $line == "$note" ]] && continue
                [[ $line =~ ^[[:space:]]*([A-Za-z0-9_]+) && " ${keys[*]} " == *" ${BASH_REMATCH[1]} "* ]] && continue
                printf '%s\n' "$line"
              done < "$cfg" || return 1
            fi
            printf '%s\n' "$note"
            if [[ -n $events ]]; then
              printf 'matchzy_remote_log_url "%s"\n' "$events"
              if [[ -n $token ]]; then
                printf 'matchzy_remote_log_header_key "Authorization"\nmatchzy_remote_log_header_value "Bearer %s"\n' "$token"
              fi
            fi
            if [[ -n $demo ]]; then
              printf 'matchzy_demo_upload_url "%s"\n' "$demo"
              if [[ -n $token ]]; then
                printf 'matchzy_demo_upload_header_key "Authorization"\nmatchzy_demo_upload_header_value "Bearer %s"\n' "$token"
              fi
            fi
            printf 'matchzy_autostart_mode 1\nmatchzy_kick_when_no_match_loaded false\n'
          }
          if ! mkdir -p "${cfg%/*}" || ! (umask 077 && config > "$cfg.tmp") || ! mv -f "$cfg.tmp" "$cfg"; then
            rm -f "$cfg.tmp"
            fail "could not write MatchZy's config"
            return 0
          fi
          local events=off demo=off auth=without
          [[ -n ${GRAVEL_MATCHZY_EVENTS_URL:-} ]] && events=on
          [[ -n ${GRAVEL_MATCHZY_DEMO_URL:-} ]] && demo=on
          [[ -n ${GRAVEL_MATCHZY_TOKEN:-} ]] && auth=with
          say "wrote MatchZy's config: match events $events, demo upload $demo, $auth a token"

          # Metamod loads when its directory is a search path right after Game_LowViolence, as its
          # documentation says. Any copy is removed first, so the line is never there twice.
          strip > /dev/null
          if ! sed -E -i 's#^([[:space:]]*)(Game_LowViolence[[:space:]]+csgo_lv([[:space:]].*)?)$#\1\2\n\1Game\tcsgo/addons/metamod#' "$gameinfo" ||
            [[ $(grep -Ec '^[[:space:]]*Game[[:space:]]+csgo/addons/metamod[[:space:]]*$' "$gameinfo") != 1 ]]; then
            fail "gameinfo.gi has no single Game_LowViolence line to put Metamod after"
            return 0
          fi
          say "added Metamod's search path to gameinfo.gi"
          status "ok matchzy"
        )
        gravel_plugins || true
        unset -f gravel_plugins
  # How a lease takes a match (#20, #176): MatchZy, on Metamod:Source and CounterStrikeSharp,
  # installed by pre.sh from these pins when a lease asks for it, with a vanilla server if it
  # doesn't load (MatchZy's with-cssharp zip carries CounterStrikeSharp and its .NET runtime;
  # Metamod comes on its own). A lease's match config is MatchZy's JSON, written into the install
  # and loaded over RCON once the plugins answer.
  lease:
    match_file: game/csgo/gravel-match.json
    match_format: matchzy
    load_command: matchzy_loadmatch gravel-match.json
    connect: "connect <address>; password <password>"
    plugins:
      matchzy:
        files:
          - url: https://github.com/alliedmodders/metamod-source/releases/download/2.0.0.1476/mmsource-2.0.0-git1476-linux.tar.gz
            sha256: fc8b4dce5b72ee8d3222cecba2c0efab6cd4e46bbfc381aec58f834ed9842f8e
            kind: tar.gz
            dest: .
          - url: https://github.com/shobhit-pathak/MatchZy/releases/download/0.9.1/MatchZy-0.9.1-with-cssharp-linux.zip
            sha256: 5f1045c2ceb628b7223c8b41b788841b64b603e0129f6638dc0f9e7ca83d4fdd
            kind: zip
            dest: .
        check: css_plugins list
        expect: MatchZy
        env:
          GRAVEL_MATCHZY_EVENTS_URL: "{hub}/api/ingest/matchzy"
          GRAVEL_MATCHZY_DEMO_URL: "{hub}/api/ingest/matchzy/demo"
          GRAVEL_MATCHZY_TOKEN: "{token}"
  # The teams a server's card counts players on (#159); a player's team is the side the log gives
  # them, and spectators are on neither. The log carries no running score.
  teams:
    - {name: CT}
    - {name: T, key: TERRORIST}
