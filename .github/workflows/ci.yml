# Every check `make check` runs locally, plus the integration job against Postgres. The Makefile
# is the source of truth for tool versions; the lint job pins the same golangci-lint version.
# Every job is a required check in .github/rulesets/main.json: a new or renamed job goes there too,
# and the owner applies it: gh api -X PUT repos/gravel-project/gravel/rulesets/24379347 --input .github/rulesets/main.json
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make fmt-check vet build test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0 # keep in step with GOLANGCI_LINT_VERSION in the Makefile

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make vuln

  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # buf breaking compares against origin/main
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make proto-lint proto-breaking generate-check

  quadlet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update -q && sudo apt-get install -y -q podman
      - run: make quadlet-check

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: sudo apt-get update -q && sudo apt-get install -y -q podman
      - run: make image bot-image
      - run: podman run --rm localhost/gravel-hub:dev version
      - run: podman run --rm localhost/gravel-bot:dev version

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: gravel
          POSTGRES_PASSWORD: gravel
          POSTGRES_DB: gravel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gravel -d gravel"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      GRAVEL_TEST_DATABASE_URL: postgres://gravel:gravel@localhost:5432/gravel?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make test-integration

  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: sudo apt-get update -q && sudo apt-get install -y -q podman
      - run: make backup-drill

  observability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: sudo apt-get update -q && sudo apt-get install -y -q podman
      # promtool from the pinned Prometheus image: both scrape configs, then every panel's query
      # as a recording rule (internal/tools/dashboards rules), so a PromQL typo fails here.
      - name: promtool
        run: |
          image="$(sed -n 's/^Image=//p' deploy/quadlet/observability/gravel-prometheus.container)"
          for f in deploy/observability/prometheus/*.yml; do
            podman run --rm -v "$PWD/$f:/p.yml:ro" --entrypoint promtool "$image" check config /p.yml
          done
          go run ./internal/tools/dashboards rules > "$RUNNER_TEMP/dashboards.rules.yml"
          podman run --rm -v "$RUNNER_TEMP/dashboards.rules.yml:/r.yml:ro" --entrypoint promtool "$image" check rules /r.yml
      # Postgres, the hub, Prometheus and Grafana in a pod: provisioning loads cleanly and every
      # hub panel has data or is marked optional (deploy/observability/check.sh).
      - run: make observability-check

  a11y:
    runs-on: ubuntu-latest # ships Chrome, which @axe-core/cli drives
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      # axe bundles a ChromeDriver that drifts from the runner's Chrome; install a synced pair.
      - run: npx --yes browser-driver-manager@2.0.1 install chrome
      - run: |
          # shellcheck source=/dev/null # written by the step above
          . ~/.browser-driver-manager/.env
          case "$CHROME_TEST_PATH" in /*) ;; *) CHROME_TEST_PATH="$HOME/$CHROME_TEST_PATH" ;; esac
          case "$CHROMEDRIVER_TEST_PATH" in /*) ;; *) CHROMEDRIVER_TEST_PATH="$HOME/$CHROMEDRIVER_TEST_PATH" ;; esac
          AXE_CHROME_PATH="$CHROME_TEST_PATH" AXE_CHROMEDRIVER_PATH="$CHROMEDRIVER_TEST_PATH" make a11y

  release-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2.18" # keep in step with release.yml
          args: check
