# Every check `make check` runs locally, plus the integration job against Postgres. The Makefile
# is the source of truth for tool versions; the lint job pins the same golangci-lint version.
# Every job is a required check in .github/rulesets/main.json: a new or renamed job goes there too,
# and the owner applies it: gh api -X PUT repos/gravel-project/gravel/rulesets/24379347 --input .github/rulesets/main.json
# The one exception is publish, which runs only on a push to main, after every other job passed.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7 # the admin dashboard's bundle, which the hub embeds (ADR-0029)
        with:
          node-version-file: web/admin/.nvmrc
          cache: npm
          cache-dependency-path: web/admin/package-lock.json
      - run: make fmt-check vet build test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0 # keep in step with GOLANGCI_LINT_VERSION in the Makefile

  # The admin dashboard (web/admin, ADR-0029): lint (no style prop), typecheck, the tests with axe
  # over each route on fake services, the build, then the Go check that the bundle the hub embeds
  # holds nothing the pages' CSP refuses.
  admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7 # the admin dashboard's bundle, which the hub embeds (ADR-0029)
        with:
          node-version-file: web/admin/.nvmrc
          cache: npm
          cache-dependency-path: web/admin/package-lock.json
      - run: make admin-check admin
      - run: GRAVEL_ADMIN_BUILT=1 go test -count=1 ./internal/web/admin/

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make vuln

  proto:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # the breaking label (.github/scripts/proto-breaking.sh)
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # buf breaking compares against origin/main
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make proto-lint generate-check
      - name: The wire stays compatible, unless the PR declares an intentional break
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: .github/scripts/proto-breaking.sh

  quadlet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update -q && sudo apt-get install -y -q podman
      - run: make quadlet-check

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7 # the admin dashboard's bundle, which the hub embeds (ADR-0029)
        with:
          node-version-file: web/admin/.nvmrc
          cache: npm
          cache-dependency-path: web/admin/package-lock.json
      - run: sudo apt-get update -q && sudo apt-get install -y -q podman
      - run: make image bot-image
      - run: podman run --rm localhost/gravel-hub:dev version
      - run: podman run --rm localhost/gravel-bot:dev version

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:17 # AWS's mirror of the official image, not Docker Hub (#79)
        env:
          POSTGRES_USER: gravel
          POSTGRES_PASSWORD: gravel
          POSTGRES_DB: gravel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gravel -d gravel"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      GRAVEL_TEST_DATABASE_URL: postgres://gravel:gravel@localhost:5432/gravel?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make test-integration

  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7 # the admin dashboard's bundle, which the hub embeds (ADR-0029)
        with:
          node-version-file: web/admin/.nvmrc
          cache: npm
          cache-dependency-path: web/admin/package-lock.json
      - run: sudo apt-get update -q && sudo apt-get install -y -q podman
      - run: make backup-drill

  observability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7 # the admin dashboard's bundle, which the hub embeds (ADR-0029)
        with:
          node-version-file: web/admin/.nvmrc
          cache: npm
          cache-dependency-path: web/admin/package-lock.json
      - run: sudo apt-get update -q && sudo apt-get install -y -q podman
      # promtool from the pinned Prometheus image: both scrape configs, then every panel's query
      # as a recording rule (internal/tools/dashboards rules), so a PromQL typo fails here.
      - name: promtool
        run: |
          image="$(sed -n 's/^Image=//p' deploy/quadlet/observability/gravel-prometheus.container)"
          for f in deploy/observability/prometheus/*.yml; do
            podman run --rm -v "$PWD/$f:/p.yml:ro" --entrypoint promtool "$image" check config /p.yml
          done
          go run ./internal/tools/dashboards rules > "$RUNNER_TEMP/dashboards.rules.yml"
          podman run --rm -v "$RUNNER_TEMP/dashboards.rules.yml:/r.yml:ro" --entrypoint promtool "$image" check rules /r.yml
      # Postgres, the hub, Prometheus and Grafana in a pod: provisioning loads cleanly and every
      # hub panel has data or is marked optional (deploy/observability/check.sh).
      - run: make observability-check

  a11y:
    runs-on: ubuntu-latest # public repo: GitHub's runners only (no self-hosted runner runs a fork's code)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7 # the admin dashboard's bundle, which the hub embeds (ADR-0029)
        with:
          node-version-file: web/admin/.nvmrc
          cache: npm
          cache-dependency-path: web/admin/package-lock.json
      # npx keeps @axe-core/cli in ~/.npm; GitHub's cache brings it back, keyed on the Makefile's pin.
      - uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-axe-${{ runner.os }}-${{ hashFiles('Makefile') }}
      # axe drives Chrome through a ChromeDriver of the same version (its bundled one drifts). GitHub's
      # image ships Chrome and the ChromeDriver built for it: use them when their majors match, else
      # download a matched pair.
      - name: Chrome and its driver
        run: |
          chrome="$(command -v google-chrome || true)"
          driver="${CHROMEWEBDRIVER:+$CHROMEWEBDRIVER/chromedriver}"
          major() { "$1" --version | grep -oE '[0-9]+' | head -1; }
          if [[ -x "$chrome" && -x "$driver" && "$(major "$chrome")" == "$(major "$driver")" ]]; then
            echo "the image's: $("$chrome" --version)"
          else
            npx --yes browser-driver-manager@2.0.1 install chrome
            # shellcheck source=/dev/null # written by the line above
            . ~/.browser-driver-manager/.env
            chrome="$CHROME_TEST_PATH" driver="$CHROMEDRIVER_TEST_PATH"
            case "$chrome" in /*) ;; *) chrome="$HOME/$chrome" ;; esac
            case "$driver" in /*) ;; *) driver="$HOME/$driver" ;; esac
          fi
          { echo "AXE_CHROME_PATH=$chrome"; echo "AXE_CHROMEDRIVER_PATH=$driver"; } >>"$GITHUB_ENV"
      - run: make a11y

  # A hub host from its cloud-init document (ADR-0020): Fedora Cloud under KVM, the stock profile
  # booted to a ready hub, then a new instance on the same data disk with the same database and
  # secrets. GitHub's Linux runners have /dev/kvm; the udev rule opens it to the runner user.
  hub-vm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: KVM, qemu and an SSH key
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          sudo apt-get update -q && sudo apt-get install -y -q qemu-system-x86 qemu-utils genisoimage
          ssh-keygen -q -t ed25519 -N '' -f ~/.ssh/id_ed25519
      # The Fedora image (about 500 MB) is keyed on the script, which names its release.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/gravel/hub-vm
          key: hub-vm-image-${{ hashFiles('deploy/hub-vm.sh') }}
      - run: make hub-vm
      - name: The console, on failure
        if: failure()
        run: tail -n 200 .hub-vm/console.log || true

  release-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the diff against the base below
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2.18" # keep in step with release.yml
          args: check
      # release.yml builds gravel-postgres only when deploy/postgres/ changed, so a change there (or
      # to release.yml) runs the same multi-arch build here, without pushing.
      - id: postgres
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -eu
          if git cat-file -e "${BASE}^{commit}" 2>/dev/null && git diff --quiet "$BASE" HEAD -- deploy/postgres .github/workflows/release.yml; then
            echo "deploy/postgres and release.yml unchanged: no gravel-postgres build"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.postgres.outputs.build == 'true'
        uses: docker/setup-qemu-action@v4
      - if: steps.postgres.outputs.build == 'true'
        uses: docker/setup-buildx-action@v4
      - if: steps.postgres.outputs.build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: deploy/postgres
          file: deploy/postgres/Containerfile
          platforms: linux/amd64,linux/arm64
          push: false

  # Every green push to main publishes the hub and bot images as main-<commit> and main, signed like
  # a release (keyless, GitHub OIDC, identity ci.yml@refs/heads/main), so a host can deploy main
  # without waiting for a release; docs/releasing.md "Images from main". gravel-postgres too, only
  # when deploy/postgres/ changed in the push. latest and the version tags stay with release.yml.
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [go, lint, admin, vuln, proto, quadlet, image, integration, backup, observability, a11y, hub-vm, release-config]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    concurrency: # one at a time, oldest first, so :main ends on the newest commit
      group: publish-main
      cancel-in-progress: false
    env:
      HUB_REPO: ghcr.io/gravel-project/gravel-hub
      BOT_REPO: ghcr.io/gravel-project/gravel-bot
      POSTGRES_REPO: ghcr.io/gravel-project/gravel-postgres
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # git describe for the version, and the diff against the push's base
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7 # the admin dashboard's bundle, which the hub embeds (ADR-0029)
        with:
          node-version-file: web/admin/.nvmrc
          cache: npm
          cache-dependency-path: web/admin/package-lock.json
      - run: make admin # ko builds from the tree: the bundle must be in it
      - uses: ko-build/setup-ko@v0.9
        with:
          version: v0.19.1 # keep in step with KO_VERSION in the Makefile
      - uses: sigstore/cosign-installer@v4.1.2 # no floating v4 tag is published; pin the release
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The version a main build reports (version command, /healthz, *_build_info): the last
      # release, the commits since it and the commit, like `make image` locally: 0.8.0-3-gabc1234.
      - id: version
        run: |
          set -eu
          v="$(git describe --tags --match 'v*' --always)"
          echo "version=${v#v}" >> "$GITHUB_OUTPUT"
      - name: gravel-hub and gravel-bot
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eu
          labels="org.opencontainers.image.source=https://github.com/gravel-project/gravel,org.opencontainers.image.revision=${GITHUB_SHA},org.opencontainers.image.version=${VERSION},org.opencontainers.image.licenses=Apache-2.0"
          echo "### main-${GITHUB_SHA} (${VERSION})" >> "$GITHUB_STEP_SUMMARY"
          for app in hub bot; do
            repo="$HUB_REPO"; [ "$app" = bot ] && repo="$BOT_REPO"
            ref="$(KO_DOCKER_REPO="$repo" ko build "./cmd/gravel-$app" --bare \
              --platform=linux/amd64,linux/arm64 --tags="main-${GITHUB_SHA},main" --sbom=spdx \
              --image-label="$labels")"
            cosign sign --yes "$ref"
            echo "- \`${ref}\`" >> "$GITHUB_STEP_SUMMARY"
          done
      - id: postgres
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -eu
          if git cat-file -e "${BEFORE}^{commit}" 2>/dev/null && git diff --quiet "$BEFORE" "$GITHUB_SHA" -- deploy/postgres; then
            echo "deploy/postgres unchanged in this push: no gravel-postgres image"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.postgres.outputs.build == 'true'
        uses: docker/setup-qemu-action@v4
      - if: steps.postgres.outputs.build == 'true'
        uses: docker/setup-buildx-action@v4
      - if: steps.postgres.outputs.build == 'true'
        id: postgres-build
        uses: docker/build-push-action@v7
        with:
          context: deploy/postgres
          file: deploy/postgres/Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.POSTGRES_REPO }}:main-${{ github.sha }}
            ${{ env.POSTGRES_REPO }}:main
          labels: |
            org.opencontainers.image.source=https://github.com/gravel-project/gravel
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
      - if: steps.postgres.outputs.build == 'true'
        env:
          DIGEST: ${{ steps.postgres-build.outputs.digest }}
        run: |
          set -eu
          cosign sign --yes "${POSTGRES_REPO}@${DIGEST}"
          echo "- \`${POSTGRES_REPO}@${DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"
