# On a v* tag: binaries, checksums and SBOMs on the GitHub release, and the hub image pushed to
# ghcr.io/gravel-project/gravel-hub and signed with cosign (keyless, GitHub OIDC).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  # The hub's Postgres image (Postgres 17 plus WAL-G, deploy/postgres/Containerfile), versioned
  # with gravel and signed like the hub image; consumers pin it by digest.
  postgres-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: sigstore/cosign-installer@v4.1.2
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/gravel-project/gravel-postgres
          tags: | # the version without its v, like the hub image, plus latest
            type=semver,pattern={{version}}
            type=raw,value=latest
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: deploy/postgres
          file: deploy/postgres/Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - run: cosign sign --yes ghcr.io/gravel-project/gravel-postgres@${{ steps.build.outputs.digest }}

  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: sigstore/cosign-installer@v4.1.2 # no floating v4 tag is published; pin the release
      - uses: anchore/sbom-action/download-syft@v0
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2.18" # keep in step with GORELEASER_VERSION in the Makefile
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
