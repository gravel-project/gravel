syntax = "proto3";

package gravel.hub.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/gravel-project/gravel/gen/gravel/hub/v1;hubv1";

// User is a member: what their linked identities resolve to. Stats are keyed by identity, never
// by this id.
message User {
  // Stable identifier (UUID).
  string id = 1;
  // Display name, taken from the first identity at registration.
  string display_name = 2;
  // Whether this user owns the organization.
  bool owner = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp last_login_at = 5;
  // The linked identities, oldest link first.
  repeated Identity identities = 6;
  // The member's instance-wide grants by role name, sorted: "admin", "moderator", "operator"
  // (ADR-0027). A game-scoped grant is in grants, not here.
  repeated string roles = 7;
  // The capabilities the member holds in person, as "area:verb" names (ADR-0027): what their
  // roles admit, or every capability a person can hold for the owner. A token an app holds for
  // the member is narrowed further, to the token's scopes.
  repeated string capabilities = 8;
  // Every grant the member holds, instance-wide (no game_id) or for one game (ADR-0027 §4).
  repeated RoleGrant grants = 9;
}

// RoleGrant is a role a member holds (ADR-0027 §3, §4).
message RoleGrant {
  string user_id = 1;
  // "admin", "operator" or "moderator".
  string role = 2;
  // The game it is for; empty is instance-wide.
  string game_id = 3;
  google.protobuf.Timestamp granted_at = 4;
  // Who granted it: a member, an app, or neither (the migration from ADR-0013's roles).
  string granted_by_user_id = 5;
  string granted_by_app_id = 6;
}

// Identity is one provider account linked to a user: a (provider, subject) pair, unique across
// the hub, with mutable display attributes and a record of how control was proven.
message Identity {
  // The provider key: "discord", "steam".
  string provider = 1;
  // The stable id at the provider: a Discord user id, a SteamID64.
  string subject = 2;
  // Display attributes refreshed at every login; may be empty.
  string display_name = 3;
  string avatar_url = 4;
  // How control was proven: "oauth2", "openid", or "game-chat" (a one-time code typed in a game
  // server's chat, gravel#5).
  string verification_method = 5;
  google.protobuf.Timestamp verified_at = 6;
  google.protobuf.Timestamp linked_at = 7;
  // When this identity was last used to log in; unset for one that was only linked.
  google.protobuf.Timestamp last_login_at = 8;
}

message GetMeRequest {}

message GetMeResponse {
  User user = 1;
}

message UnlinkIdentityRequest {
  string provider = 1;
  string subject = 2;
}

message UnlinkIdentityResponse {
  // The caller, after the unlink.
  User user = 1;
}

message LogoutRequest {}

message LogoutResponse {}

message RevokeSessionsRequest {}

message RevokeSessionsResponse {
  // How many sessions were ended, the caller's included.
  int32 revoked = 1;
}

message LookupUserRequest {
  string provider = 1;
  string subject = 2;
}

message LookupUserResponse {
  User user = 1;
}

message ListUsersRequest {
  // At most 500; 100 when unset.
  int32 page_size = 1;
  // The next_page_token of the previous page; empty for the first.
  string page_token = 2;
}

message ListUsersResponse {
  // Members with their identities, oldest registration first.
  repeated User users = 1;
  // Empty on the last page.
  string next_page_token = 2;
}

// IdentityEvent is one line of the append-only identity log: a registration, a login, a link or
// an unlink of one (provider, subject) pair.
message IdentityEvent {
  // The log position; ask for what comes after it next time.
  int64 id = 1;
  string user_id = 2;
  string provider = 3;
  string subject = 4;
  // "registered", "login", "linked" or "unlinked".
  string event = 5;
  google.protobuf.Timestamp at = 6;
}

message ListIdentityEventsRequest {
  // Return events with an id greater than this; 0 for the start of the log.
  int64 after_id = 1;
  // At most 1000; 100 when unset.
  int32 limit = 2;
}

message ListIdentityEventsResponse {
  repeated IdentityEvent events = 1;
  // The id to pass as after_id next time: the last event's, or after_id itself when there were none.
  int64 next_after_id = 2;
  // The newest id in the log when it was read; 0 for an empty log. A reader that starts with a
  // full pass begins its incremental reads here instead of paging through the history.
  int64 head_id = 3;
}

message SetUserRoleRequest {
  string user_id = 1;
  // "admin", "operator" or "moderator".
  string role = 2;
  // true grants the role, false revokes it.
  bool granted = 3;
  // The game the grant is for; empty is instance-wide.
  string game_id = 4;
}

message ListRoleGrantsRequest {
  // One member's grants; empty for every member's.
  string user_id = 1;
}

message ListRoleGrantsResponse {
  repeated RoleGrant grants = 1;
}

message SetUserRoleResponse {
  User user = 1;
}

// PasswordLink is a one-time link that sets a local account's password (ADR-0026, gravel#187).
// It is shown once: the hub keeps only a hash of it.
message PasswordLink {
  // The link to hand to the member: auth.base_url + /auth/local/reset/<token>, or only the path
  // when the hub has no base_url.
  string url = 1;
  // "set" (a new account's first password) or "reset".
  string purpose = 2;
  // A link works once, for an hour.
  google.protobuf.Timestamp expires_at = 3;
}

message CreateLocalAccountRequest {
  // 3 to 32 of a-z 0-9 . _ -, starting with a letter or a digit; compared after NFKC and lower case.
  string username = 1;
  // Optional, and only ever for recovery: the hub never matches accounts by email.
  string email = 2;
}

message CreateLocalAccountResponse {
  User user = 1;
  PasswordLink link = 2;
}

message IssuePasswordResetRequest {
  // The local account's username.
  string username = 1;
}

message IssuePasswordResetResponse {
  PasswordLink link = 1;
}

message StartProofRequest {
  // The server whose chat the code is typed in: one whose status has the "chat" capability.
  string server_id = 1;
  // An account the caller has linked at the server's game's provider, to prove again; empty to
  // link a new one.
  string subject = 2;
}

message StartProofResponse {
  string proof_id = 1;
  // The code, shown once ("7K3M-9QXA"); only its hash is kept.
  string code = 2;
  google.protobuf.Timestamp expires_at = 3;
  // What to do with it: "Join the server, then type in chat: !link 7K3M-9QXA".
  string instructions = 4;
  // The provider the account it proves is at: "steam".
  string provider = 5;
}

message GetProofRequest {
  string proof_id = 1;
}

message GetProofResponse {
  string proof_id = 1;
  string server_id = 2;
  string provider = 3;
  google.protobuf.Timestamp expires_at = 4;
  // "open", "expired", "proven" (linked, or proven again), "taken" (another member's account;
  // nothing moved), "replaced" (a newer code took its place).
  string state = 5;
  // The account that proved it, once proven or taken.
  string subject = 6;
}

// IdentityService is the logged-in member's account and the lookups role sync needs. Every
// procedure needs a session cookie; login itself is the browser flow under /auth/.
service IdentityService {
  // GetMe returns the caller and their linked identities.
  rpc GetMe(GetMeRequest) returns (GetMeResponse);
  // UnlinkIdentity removes one of the caller's identities. The last one is refused
  // (failed_precondition): a provider-only account would be unreachable.
  rpc UnlinkIdentity(UnlinkIdentityRequest) returns (UnlinkIdentityResponse);
  // Logout ends the calling session and clears its cookie.
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  // RevokeSessions logs the caller out everywhere, this session included.
  rpc RevokeSessions(RevokeSessionsRequest) returns (RevokeSessionsResponse);
  // LookupUser resolves a (provider, subject) pair to its user, for role sync. Owner only until
  // first-party apps get their own credentials (gravel#6).
  rpc LookupUser(LookupUserRequest) returns (LookupUserResponse);
  // ListUsers pages through the members with their identities, oldest first: a role-sync
  // reconciler's full pass. An app with identity:read, or the owner.
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  // ListIdentityEvents returns the identity log after a position, oldest first: a reconciler's
  // incremental pass. An app with identity:read, or the owner.
  rpc ListIdentityEvents(ListIdentityEventsRequest) returns (ListIdentityEventsResponse);
  // SetUserRole grants or revokes a member's role, instance-wide or for one game (ADR-0027 §5):
  // roles:grant for that scope; only the owner changes an admin grant; an app changes moderator
  // only; nobody changes their own. Every change is recorded with who made it.
  rpc SetUserRole(SetUserRoleRequest) returns (SetUserRoleResponse);
  // CreateLocalAccount makes a member with a local account (ADR-0026) and returns the one-time link
  // that sets its password: how staff give someone an account while registration is closed.
  // members:manage, in person; failed_precondition when local accounts are off.
  rpc CreateLocalAccount(CreateLocalAccountRequest) returns (CreateLocalAccountResponse);
  // IssuePasswordReset returns a one-time link that resets a local account's password; the
  // account's earlier unused links stop working. members:manage, in person.
  rpc IssuePasswordReset(IssuePasswordResetRequest) returns (IssuePasswordResetResponse);
  // ListRoleGrants lists who holds which role where. identity:read.
  rpc ListRoleGrants(ListRoleGrantsRequest) returns (ListRoleGrantsResponse);
  // StartProof draws a one-time code the caller types in a game server's chat to prove the account
  // they play as (gravel#5): the server's log names the account, and the hub links it to the
  // caller (or proves an existing link again; another member's account stays theirs). Good for ten
  // minutes and once; a new code replaces the open one. In person only; five codes an hour
  // (resource_exhausted past that).
  rpc StartProof(StartProofRequest) returns (StartProofResponse);
  // GetProof is one of the caller's proofs: open, proven, taken, replaced or expired. In person only.
  rpc GetProof(GetProofRequest) returns (GetProofResponse);
}
