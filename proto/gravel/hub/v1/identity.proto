syntax = "proto3";

package gravel.hub.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/gravel-project/gravel/gen/gravel/hub/v1;hubv1";

// User is a member: what their linked identities resolve to. Stats are keyed by identity, never
// by this id.
message User {
  // Stable identifier (UUID).
  string id = 1;
  // Display name, taken from the first identity at registration.
  string display_name = 2;
  // Whether this user owns the organization.
  bool owner = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp last_login_at = 5;
  // The linked identities, oldest link first.
  repeated Identity identities = 6;
  // Roles the owner granted (ADR-0013): "moderator".
  repeated string roles = 7;
}

// Identity is one provider account linked to a user: a (provider, subject) pair, unique across
// the hub, with mutable display attributes and a record of how control was proven.
message Identity {
  // The provider key: "discord", "steam".
  string provider = 1;
  // The stable id at the provider: a Discord user id, a SteamID64.
  string subject = 2;
  // Display attributes refreshed at every login; may be empty.
  string display_name = 3;
  string avatar_url = 4;
  // How control was proven: "oauth2" or "openid".
  string verification_method = 5;
  google.protobuf.Timestamp verified_at = 6;
  google.protobuf.Timestamp linked_at = 7;
  // When this identity was last used to log in; unset for one that was only linked.
  google.protobuf.Timestamp last_login_at = 8;
}

message GetMeRequest {}

message GetMeResponse {
  User user = 1;
}

message UnlinkIdentityRequest {
  string provider = 1;
  string subject = 2;
}

message UnlinkIdentityResponse {
  // The caller, after the unlink.
  User user = 1;
}

message LogoutRequest {}

message LogoutResponse {}

message RevokeSessionsRequest {}

message RevokeSessionsResponse {
  // How many sessions were ended, the caller's included.
  int32 revoked = 1;
}

message LookupUserRequest {
  string provider = 1;
  string subject = 2;
}

message LookupUserResponse {
  User user = 1;
}

message ListUsersRequest {
  // At most 500; 100 when unset.
  int32 page_size = 1;
  // The next_page_token of the previous page; empty for the first.
  string page_token = 2;
}

message ListUsersResponse {
  // Members with their identities, oldest registration first.
  repeated User users = 1;
  // Empty on the last page.
  string next_page_token = 2;
}

// IdentityEvent is one line of the append-only identity log: a registration, a login, a link or
// an unlink of one (provider, subject) pair.
message IdentityEvent {
  // The log position; ask for what comes after it next time.
  int64 id = 1;
  string user_id = 2;
  string provider = 3;
  string subject = 4;
  // "registered", "login", "linked" or "unlinked".
  string event = 5;
  google.protobuf.Timestamp at = 6;
}

message ListIdentityEventsRequest {
  // Return events with an id greater than this; 0 for the start of the log.
  int64 after_id = 1;
  // At most 1000; 100 when unset.
  int32 limit = 2;
}

message ListIdentityEventsResponse {
  repeated IdentityEvent events = 1;
  // The id to pass as after_id next time: the last event's, or after_id itself when there were none.
  int64 next_after_id = 2;
  // The newest id in the log when it was read; 0 for an empty log. A reader that starts with a
  // full pass begins its incremental reads here instead of paging through the history.
  int64 head_id = 3;
}

message SetUserRoleRequest {
  string user_id = 1;
  // "moderator".
  string role = 2;
  // true grants the role, false revokes it.
  bool granted = 3;
}

message SetUserRoleResponse {
  User user = 1;
}

// IdentityService is the logged-in member's account and the lookups role sync needs. Every
// procedure needs a session cookie; login itself is the browser flow under /auth/.
service IdentityService {
  // GetMe returns the caller and their linked identities.
  rpc GetMe(GetMeRequest) returns (GetMeResponse);
  // UnlinkIdentity removes one of the caller's identities. The last one is refused
  // (failed_precondition): a provider-only account would be unreachable.
  rpc UnlinkIdentity(UnlinkIdentityRequest) returns (UnlinkIdentityResponse);
  // Logout ends the calling session and clears its cookie.
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  // RevokeSessions logs the caller out everywhere, this session included.
  rpc RevokeSessions(RevokeSessionsRequest) returns (RevokeSessionsResponse);
  // LookupUser resolves a (provider, subject) pair to its user, for role sync. Owner only until
  // first-party apps get their own credentials (gravel#6).
  rpc LookupUser(LookupUserRequest) returns (LookupUserResponse);
  // ListUsers pages through the members with their identities, oldest first: a role-sync
  // reconciler's full pass. An app with identity:read, or the owner.
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  // ListIdentityEvents returns the identity log after a position, oldest first: a reconciler's
  // incremental pass. An app with identity:read, or the owner.
  rpc ListIdentityEvents(ListIdentityEventsRequest) returns (ListIdentityEventsResponse);
  // SetUserRole grants or revokes a member's role (ADR-0013); every change is recorded with who
  // made it. The owner only; the owner holds every power already and needs no role.
  rpc SetUserRole(SetUserRoleRequest) returns (SetUserRoleResponse);
}
