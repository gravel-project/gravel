syntax = "proto3";

package gravel.hub.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/gravel-project/gravel/gen/gravel/hub/v1;hubv1";

// Band is a publisher guardrail on one of a game's configuration keys, of one kind: a range (min,
// max; an unset bound is open), a longest value (max_length, in characters) or the hosts a URL
// value may point at (hosts: https, the host or a subdomain of one; an empty value passes).
message Band {
  string section = 1;
  string key = 2;
  optional int64 min = 3;
  optional int64 max = 4;
  optional int64 max_length = 5;
  repeated string hosts = 6;
  // The band applies only while this key of the same section is empty ("" = always).
  string unless_set = 7;
}

// Game is a game this hub's servers run: a Game spec gravel ships, with the deployment's
// tightenings of its bands applied.
message Game {
  // "wardogs".
  string id = 1;
  string name = 2;
  // The provider its players are keyed by: "steam".
  string identity_provider = 3;
  repeated Band bands = 4;
  // The publisher forbids any paid benefit (a supporter perk, a crowdfunding reward) that depends
  // on the game's data or features.
  bool no_paid_perks = 5;
  // How the pages show the game (the Game spec's layout).
  GameLayout layout = 6;
}

// GameLayout is a game's page layout, declarative data from its Game spec.
message GameLayout {
  // A board's columns in order, each a GetBoardRequest metric; the first is the default ranking.
  repeated string board = 1;
}

// TeamScore is one team's (faction's) score and, when the hub knows it, how many players it has.
message TeamScore {
  string name = 1;
  // A CSS colour, "#4CB1EF"; empty when the game has none.
  string color = 2;
  int64 score = 3;
  // The players on the team at the last poll, counted from the server's players. Unset when the
  // hub doesn't know: the server's players aren't read, or the game doesn't say who is on which
  // team (#159).
  optional int32 players = 4;
}

// ServerStatus is the hub's last observation of a server. It carries no personal data.
message ServerStatus {
  // "unknown" (not polled yet), "ok", "unreachable", "credential_refused", "credential_missing",
  // "rate_limited" or "error"; for a cloud-VM server whose host is not running, "parked" or
  // "provisioning" (being made, started, resized or parked). The cause of a failure is in the
  // hub's log, never here.
  string state = 1;
  // False after two failed polls in a row; true again on the next success.
  bool reachable = 2;
  // The last successful poll; unset when there was none. The fields below are from it.
  google.protobuf.Timestamp observed_at = 3;
  // The server's build string.
  string build = 4;
  // What the server lets the hub do right now: "status", "players", "kick", "ban", … An absent
  // capability is shown as not available.
  repeated string capabilities = 5;
  int32 players = 6;
  int32 max_players = 7;
  // The map as the game names it in play (War Dogs: the level, "Ozeti").
  string map = 8;
  repeated string experiences = 9;
  string lighting = 10;
  repeated TeamScore teams = 11;
  // The score period in force; 0 when the game has none.
  int32 score_tick = 12;
  // The map rotation's position; -1 when unknown.
  int32 rotation_index = 13;
  int32 next_rotation_index = 14;
  // The rotation's current and next map as the game names them in its rotation and catalog (War
  // Dogs: the theatre, "Europe", where map is the level in play); empty when unknown.
  string rotation_map = 15;
  string next_rotation_map = 16;
  // How a player gets onto the server from the game, when the driver knows; unset otherwise.
  ServerJoin join = 17;
}

// ServerJoin is how a player reaches a server from the game. It is public, what a community
// shares to bring players in, except password, which only an app holding servers:read sees.
message ServerJoin {
  // "id": paste value into the game's own server browser (War Dogs: Join by ID); "address":
  // value is host:port; "uri": value is a link that launches the game onto the server.
  string method = 1;
  string value = 2;
  // One line saying where the value goes, in the game's terms.
  string hint = 3;
  // The password players join with, only for an app holding servers:read, and only while the
  // server is up, is not leased, and its manifest entry shares it (vm.share_password, #180).
  // Never in a public read: an anonymous caller, a member and the web pages get "".
  string password = 4;
}

// Server is a server a driver controls (ManagedServer), as the public sees it: never its control
// address or where its credential is.
message Server {
  // "htg-wardogs-1".
  string id = 1;
  string name = 2;
  string game_id = 3;
  // Where it runs: "qonzer-slc".
  string location = 4;
  // "official" or "community".
  string trust = 5;
  // 6 was seeding, the servers manifest's seeding section, removed in 0.8.0: seeding rules are the
  // Organization settings' DiscordSettings.seeding (ADR-0016).
  reserved 6;
  reserved "seeding";
  ServerStatus status = 7;
  // The driver that controls it: "wardogs" (a server the hub reaches), "cloudvm" (one on a VM the
  // hub makes, which has a ServerHost).
  string driver = 8;
}

// ServerPlayer is one connected player at the last successful poll.
message ServerPlayer {
  string name = 1;
  // The player's identity at the game's provider: ("steam", a SteamID64).
  string provider = 2;
  string subject = 3;
  string team = 4;
  int32 kills = 5;
  int32 deaths = 6;
  int32 ping_ms = 7;
  // The member that identity is linked to, resolved now; empty for a player who is not one.
  string user_id = 8;
}

message ListGamesRequest {}

message ListGamesResponse {
  repeated Game games = 1;
}

message ListServersRequest {}

message ListServersResponse {
  repeated Server servers = 1;
}

message GetServerStatusRequest {
  string server_id = 1;
}

message GetServerStatusResponse {
  Server server = 1;
}

message ListServerPlayersRequest {
  string server_id = 1;
}

message ListServerPlayersResponse {
  repeated ServerPlayer players = 1;
  // The poll the list is from; unset when there was none.
  google.protobuf.Timestamp observed_at = 2;
}

message GetFleetSummaryRequest {}

// FleetTotals counts the fleet (gravel#190).
message FleetTotals {
  int32 servers = 1;
  int32 up = 2;
  int32 degraded = 3;
  int32 down = 4;
  int32 idle = 5;
  int32 unknown = 6;
  // Players on, and public slots, over the servers that are not idle and have answered.
  int32 players = 7;
  int32 capacity = 8;
}

// FleetAlarm is something wrong that needs a person, open for as long as its cause lasts; it is
// computed on every read, never stored.
message FleetAlarm {
  // "server.down" (down for 2 minutes), "server.credential_refused", "server.credential_missing",
  // "host.failing", "backup.stale", "backup.failed", "wal.failing", "hub.unowned".
  string kind = 1;
  // "warning" or "critical".
  string severity = 2;
  // The server it is about; empty for the hub itself.
  string server_id = 3;
  google.protobuf.Timestamp since = 4;
  // One line saying what is wrong.
  string detail = 5;
}

// FleetServer is one server's health, with what it is judged on.
message FleetServer {
  string id = 1;
  string name = 2;
  string game_id = 3;
  string game_name = 4;
  string trust = 5;
  string driver = 6;
  // "up", "degraded", "down", "idle" (parked or absent, as asked) or "unknown" (not polled yet).
  string health = 7;
  // One line saying why: "answering", "not answering", "the host is booting", ...
  string reason = 8;
  // Since when the health holds; unset when not known.
  google.protobuf.Timestamp health_since = 9;
  // The monitor's state (ServerStatus.state).
  string state = 10;
  int32 players = 11;
  int32 max_players = 12;
  string map = 13;
  // The last successful poll; unset when there was none.
  google.protobuf.Timestamp observed_at = 14;
  // How long the last poll took, in milliseconds, and the failed polls in a row.
  int32 poll_ms = 15;
  int32 misses = 16;
  // A cloud-VM server's host: its state and the code of the step it keeps failing; empty for a
  // server whose host gravel doesn't make.
  string host_state = 17;
  string host_error_code = 18;
  // The server's live lease: "starting", "ready", "ending"; empty for none.
  string lease_state = 19;
}

message GetFleetSummaryResponse {
  FleetTotals totals = 1;
  // The open alarms, critical first, then oldest first.
  repeated FleetAlarm alarms = 2;
  // Trouble first: down, degraded, unknown, up, idle; then by players, most first.
  repeated FleetServer servers = 3;
  // When the summary was taken.
  google.protobuf.Timestamp as_of = 4;
}

message ExportServersRequest {}

message ExportServersResponse {
  // The stored games, locations and servers as a servers.yaml manifest.
  string manifest = 1;
}

message ApplyServersRequest {
  // A servers.yaml manifest, the whole of it.
  string manifest = 1;
  // Say what would change and change nothing.
  bool dry_run = 2;
}

message ApplyServersResponse {
  // Each change, "server htg-wardogs-1 changed"; empty when nothing would change.
  repeated string changes = 1;
  // Whether the changes were made (false on a dry run, and when there were none).
  bool applied = 2;
}

message CheckServersRequest {
  string manifest = 1;
}

message CheckServersResponse {
  // "2 games [cs2 wardogs], 3 servers [...]".
  string summary = 1;
}

// ServerService reads the games and servers the hub controls (ADR-0010). They are applied from a
// deployment's servers.yaml by `gravel-hub servers apply`; the hub polls each server through its
// driver and answers from the last observation, so a caller never reaches a game server.
service ServerService {
  // ListGames is the enabled games; public.
  rpc ListGames(ListGamesRequest) returns (ListGamesResponse);
  // ListServers is every server with its last observation; public, no personal data.
  rpc ListServers(ListServersRequest) returns (ListServersResponse);
  // GetServerStatus is one server; public. not_found for an unknown id.
  rpc GetServerStatus(GetServerStatusRequest) returns (GetServerStatusResponse);
  // ListServerPlayers is who was on at the last poll: names and provider identities, so a
  // logged-in member, the owner, or an app with the servers:read scope.
  rpc ListServerPlayers(ListServerPlayersRequest) returns (ListServerPlayersResponse);
  // GetFleetSummary is every server's health, the fleet's totals and the open alarms (gravel#190):
  // servers:read. A caller holding it for some games sees those games' servers and their alarms;
  // the hub's own alarms (backups, WAL, the claim) need events:read everywhere.
  rpc GetFleetSummary(GetFleetSummaryRequest) returns (GetFleetSummaryResponse);
  // ExportServers is the stored manifest: servers:manage.
  rpc ExportServers(ExportServersRequest) returns (ExportServersResponse);
  // ApplyServers makes the stored games and servers match a manifest, or with dry_run says what
  // would change: servers:manage (#195). Over the API it may not add or change a location, add a
  // server, or change a server's driver, location, endpoint, credential file, feed, or its VM's
  // password, publisher token or share_password: those name files on the hub's host or where
  // their secrets go, and are the host's (`gravel-hub servers apply`): failed_precondition names
  // each. invalid_argument names every problem with the manifest.
  rpc ApplyServers(ApplyServersRequest) returns (ApplyServersResponse);
  // CheckServers validates a manifest against this hub's games, drivers and clouds and changes
  // nothing: servers:manage.
  rpc CheckServers(CheckServersRequest) returns (CheckServersResponse);
}
