syntax = "proto3";

package gravel.hub.v1;

import "google/protobuf/timestamp.proto";
import "gravel/hub/v1/servers.proto";

option go_package = "github.com/gravel-project/gravel/gen/gravel/hub/v1;hubv1";

// BoardEntry is one player on a board. A player who has not linked the identity, or has not
// chosen to be shown by name, appears under their pseudonym (pseudonymous true, no user_id).
message BoardEntry {
  int32 rank = 1;
  string name = 2;
  bool pseudonymous = 3;
  // The member, when shown by name.
  string user_id = 4;
  int32 kills = 5;
  int32 deaths = 6;
  // kills / max(deaths, 1).
  double kd = 7;
  int32 seconds_on = 8;
  int32 matches = 9;
}

message GetBoardRequest {
  // At most one of server_id and game_id; neither is the organization's board. A server's board
  // counts its matches whatever its trust; a game's or the organization's counts Official
  // servers' only (ADR-0011's trust mapping).
  string server_id = 1;
  string game_id = 2;
  // "week" (this week), "month" (this month), "season" (the named one), "all" (the default).
  string window = 3;
  string season = 4;
  // "kills" (the default), "deaths", "kd", "time", "matches".
  string metric = 5;
  int32 page_size = 6;
  // The next_page_token of the previous page; empty for the first.
  string page_token = 7;
}

message GetBoardResponse {
  repeated BoardEntry entries = 1;
  string next_page_token = 2;
  // The window's bounds; unset for "all".
  google.protobuf.Timestamp from = 3;
  google.protobuf.Timestamp to = 4;
}

// MatchSummary is one match on a server.
message MatchSummary {
  string id = 1;
  string server_id = 2;
  string game_id = 3;
  google.protobuf.Timestamp started_at = 4;
  // Unset while the match is on.
  google.protobuf.Timestamp ended_at = 5;
  string map = 6;
  int32 players = 7;
  int32 kills = 8;
}

message ListMatchesRequest {
  string server_id = 1;
  int32 page_size = 2;
  // The next_page_token of the previous page; empty for the first.
  string page_token = 3;
}

message ListMatchesResponse {
  repeated MatchSummary matches = 1;
  string next_page_token = 2;
}

message GetBoardNameRequest {}

message GetBoardNameResponse {
  bool show_name = 1;
}

message SetBoardNameRequest {
  // Show the member's display name on boards instead of their pseudonym.
  bool show_name = 1;
}

message SetBoardNameResponse {
  bool show_name = 1;
}

// ProfileTotals is a member's totals over one window: "all", "week", "month", or "season" with
// season naming one running now. from and to are unset for all time.
message ProfileTotals {
  string window = 1;
  string season = 2;
  google.protobuf.Timestamp from = 3;
  google.protobuf.Timestamp to = 4;
  int32 kills = 5;
  int32 deaths = 6;
  double kd = 7;
  int32 seconds_on = 8;
  int32 matches = 9;
}

// PlayerMatch is one match a member played, with their row in it.
message PlayerMatch {
  string match_id = 1;
  string server_id = 2;
  string server_name = 3;
  google.protobuf.Timestamp started_at = 4;
  // Unset while the match is open.
  google.protobuf.Timestamp ended_at = 5;
  string map = 6;
  int32 kills = 7;
  int32 deaths = 8;
  int32 seconds_on = 9;
}

message GetMemberProfileRequest {
  // The member; empty is the logged-in caller.
  string user_id = 1;
}

message GetMemberProfileResponse {
  string user_id = 1;
  string display_name = 2;
  // The member chose to be shown by name on boards.
  bool show_name = 3;
  // The caller is the member.
  bool self = 4;
  // All time, this week, this month and each season running now, counting Official servers.
  repeated ProfileTotals totals = 5;
  // Their most recent matches on any server, newest first.
  repeated PlayerMatch recent = 6;
  // Their participation from first-party apps (ADR-0014) over the same windows as totals, one
  // entry per window and kind they took part in, by window in totals' order, then kind.
  repeated ParticipationTotals participation = 7;
}

// PlayerIdentity is a player at an identity provider, as the stats store keys them (never a
// member id: an identity is resolved to a member only when a board or profile is read).
message PlayerIdentity {
  // "discord" or "steam".
  string provider = 1;
  // The stable id at the provider: a Discord user id, a SteamID64.
  string subject = 2;
}

// ParticipationEvent is one time a player took part in something a first-party app tracks
// (ADR-0014): a seeding session, an event they attended. It feeds participation boards and
// profiles only, never a combat board.
message ParticipationEvent {
  // The app's idempotency key: 1 to 128 printable ASCII characters, unique per app. An event
  // sent again with a key the app used before is a duplicate and is not stored again, even when
  // its other fields differ.
  string key = 1;
  // What the player did, as the app names it: a lower-case letter, then up to 31 lower-case
  // letters, digits or underscores ("seeding", "attendance").
  string kind = 2;
  PlayerIdentity identity = 3;
  // A game this hub ships, optional. With server_id, it must be that server's game; with only
  // server_id, the server's game is stored.
  string game_id = 4;
  // A server the hub knows, optional.
  string server_id = 5;
  // The app's own reference for the session or event, at most 128 characters, optional.
  string session = 6;
  // When it happened: required, at most 5 minutes ahead of the hub's clock, and not older than
  // the stats store keeps raw rows (the Organization settings' stats.raw_retention_months).
  google.protobuf.Timestamp occurred_at = 7;
  // How long it lasted, 0 to 86400.
  int32 duration_seconds = 8;
  // The event's schema version: 0 (the current one) or 1.
  int32 schema_version = 9;
}

message RecordParticipationRequest {
  // 1 to 100 events. The request is checked whole first: one invalid event refuses them all,
  // and nothing is stored.
  repeated ParticipationEvent events = 1;
}

// ParticipationResult is what became of one event.
message ParticipationResult {
  string key = 1;
  // "recorded", or "duplicate" when the app sent the key before.
  string outcome = 2;
}

message RecordParticipationResponse {
  // One per event, in the request's order.
  repeated ParticipationResult results = 1;
}

// ParticipationEntry is one player on a participation board, named as on GetBoard.
message ParticipationEntry {
  int32 rank = 1;
  string name = 2;
  bool pseudonymous = 3;
  // The member, when shown by name.
  string user_id = 4;
  // How many times they took part, and for how long in all.
  int32 events = 5;
  int32 seconds = 6;
}

message GetParticipationBoardRequest {
  // The kind to rank; empty is the first of the organization's kinds.
  string kind = 1;
  // Only this game's events; empty is every event, with a game or without.
  string game_id = 2;
  // "week" (this week), "month" (this month), "season" (the named one), "all" (the default).
  string window = 3;
  string season = 4;
  int32 page_size = 5;
  // The next_page_token of the previous page; empty for the first.
  string page_token = 6;
}

message GetParticipationBoardResponse {
  // Ranked by time, then times taken part.
  repeated ParticipationEntry entries = 1;
  string next_page_token = 2;
  // The window's bounds; unset for "all".
  google.protobuf.Timestamp from = 3;
  google.protobuf.Timestamp to = 4;
  // The kind ranked; empty when nothing has been recorded.
  string kind = 5;
  // Every kind recorded in the organization, sorted, for a picker.
  repeated string kinds = 6;
}

// ParticipationTotals is a member's participation of one kind over one window: "all", "week",
// "month", or "season" with season naming one running now. from and to are unset for all time.
message ParticipationTotals {
  string window = 1;
  string season = 2;
  google.protobuf.Timestamp from = 3;
  google.protobuf.Timestamp to = 4;
  string kind = 5;
  int32 events = 6;
  int32 seconds = 7;
}

// StatsService is the stats boards (ADR-0012): counts from the hub's own polls of each server,
// keyed by provider identity, unlinked players under pseudonyms; and participation from
// first-party apps, on boards of its own (ADR-0014).
service StatsService {
  // GetBoard ranks the players of a server, a game or the organization over a window. Public when
  // the Organization settings make stats public; otherwise the owner or an app with stats:read.
  rpc GetBoard(GetBoardRequest) returns (GetBoardResponse);
  // ListMatches is a server's matches, newest first; the same access as GetBoard.
  rpc ListMatches(ListMatchesRequest) returns (ListMatchesResponse);
  // GetBoardName is the logged-in member's choice to be shown by name on boards.
  rpc GetBoardName(GetBoardNameRequest) returns (GetBoardNameResponse);
  // SetBoardName changes it; a logged-in member, for themselves only.
  rpc SetBoardName(SetBoardNameRequest) returns (SetBoardNameResponse);
  // GetMemberProfile is a member's stats across their linked identities: the member's own, the
  // owner's, an app's with stats:read, or anyone's when the member shows their name on boards and
  // the Organization settings make stats public. Anyone else gets not_found, so a profile
  // doesn't reveal who is behind a pseudonym.
  rpc GetMemberProfile(GetMemberProfileRequest) returns (GetMemberProfileResponse);
  // RecordParticipation stores participation events from a first-party app (ADR-0014): only an
  // app holding participation:write; a member's session, the owner's included, is refused.
  rpc RecordParticipation(RecordParticipationRequest) returns (RecordParticipationResponse);
  // GetParticipationBoard ranks the players who took part in one kind of thing over a window,
  // with the same access as GetBoard.
  rpc GetParticipationBoard(GetParticipationBoardRequest) returns (GetParticipationBoardResponse);
  // GetSessionRecap is what one server's window held (ADR-0018): its occupancy, the matches that
  // overlap it and the top five by kills. The window is at most 24 hours and must have ended.
  // The same access as GetBoard.
  rpc GetSessionRecap(GetSessionRecapRequest) returns (GetSessionRecapResponse);
  // ListMatchResults is the series a match plugin reported (MatchZy, ADR-0024), newest first,
  // without their maps and players. Who may GetBoard.
  rpc ListMatchResults(ListMatchResultsRequest) returns (ListMatchResultsResponse);
  // GetMatchResult is a series with its maps and each player's totals on each map, players shown
  // as on a board: a member's name when they chose it, else a pseudonym. Who may GetBoard.
  rpc GetMatchResult(GetMatchResultRequest) returns (GetMatchResultResponse);
  // GetMatchDemo is a link to download a map's demo, good for 15 minutes; not_found when the map
  // has none. Who may GetBoard.
  rpc GetMatchDemo(GetMatchDemoRequest) returns (GetMatchDemoResponse);
}

// MatchResult is one series a server's match plugin ran.
message MatchResult {
  string id = 1;
  string server_id = 2;
  // The lease the server was under (a PUG), if any.
  string lease_id = 3;
  string team1_name = 4;
  string team2_name = 5;
  int32 num_maps = 6;
  // Maps won, once the series ended.
  int32 team1_score = 7;
  int32 team2_score = 8;
  // "team1", "team2", "none" (a draw), or "" while it lasts.
  string winner = 9;
  google.protobuf.Timestamp started_at = 10;
  google.protobuf.Timestamp ended_at = 11;
  repeated MatchResultMap maps = 12;
  repeated MatchResultPlayer players = 13;
}

// MatchResultMap is one map of a series.
message MatchResultMap {
  // From 0, in the order played.
  int32 map_number = 1;
  string map_name = 2;
  int32 team1_score = 3;
  int32 team2_score = 4;
  string winner = 5;
  google.protobuf.Timestamp started_at = 6;
  google.protobuf.Timestamp ended_at = 7;
  bool has_demo = 8;
}

// MatchResultPlayer is a player's totals on one map, shown as a board shows them.
message MatchResultPlayer {
  int32 map_number = 1;
  string name = 2;
  bool pseudonymous = 3;
  // The member, when shown by name.
  string user_id = 4;
  // "team1" or "team2".
  string team = 5;
  int32 kills = 6;
  int32 deaths = 7;
  int32 assists = 8;
  int32 damage = 9;
  int32 headshot_kills = 10;
  int32 mvps = 11;
  int32 score = 12;
}

message ListMatchResultsRequest {
  string server_id = 1;
  string lease_id = 2;
  bool ended_only = 3;
  // Only series that ended after this (a bot's next look).
  google.protobuf.Timestamp ended_after = 4;
  // At most this many (50 when 0, at most 200).
  int32 page_size = 5;
}

message ListMatchResultsResponse {
  repeated MatchResult results = 1;
}

message GetMatchResultRequest {
  string id = 1;
}

message GetMatchResultResponse {
  MatchResult result = 1;
}

message GetMatchDemoRequest {
  string id = 1;
  int32 map_number = 2;
}

message GetMatchDemoResponse {
  string url = 1;
  google.protobuf.Timestamp expires_at = 2;
}

message GetSessionRecapRequest {
  string server_id = 1;
  google.protobuf.Timestamp from = 2;
  google.protobuf.Timestamp to = 3;
  // The player count minutes_at_floor counts against, 0 to 1000; 0 counts none.
  int32 floor = 4;
}

// RecapMatch is one match that overlaps a recap's window.
message RecapMatch {
  string id = 1;
  google.protobuf.Timestamp started_at = 2;
  // Unset while the match is on.
  google.protobuf.Timestamp ended_at = 3;
  string map = 4;
  // The last team scores the polls saw: the final ones once the match ended.
  repeated TeamScore teams = 5;
  // The players seen in it during the window.
  int32 players = 6;
}

message GetSessionRecapResponse {
  google.protobuf.Timestamp from = 1;
  google.protobuf.Timestamp to = 2;
  int32 floor = 3;
  // The most players on at once, by the minute.
  int32 peak_players = 4;
  // The minutes anyone was on, and those whose fewest players reached the floor.
  int32 minutes = 5;
  int32 minutes_at_floor = 6;
  // The distinct players seen in the window.
  int32 players = 7;
  repeated RecapMatch matches = 8;
  // The players with the most kills in those matches, at most five, each with a kill.
  repeated BoardEntry top = 9;
}
