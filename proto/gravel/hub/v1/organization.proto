syntax = "proto3";

package gravel.hub.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/gravel-project/gravel/gen/gravel/hub/v1;hubv1";

// Organization is the single tenant a hub serves. Every top-level object carries an organization
// (the seam for a second tenant later); there is exactly one built-in organization today.
message Organization {
  // Stable identifier (UUID).
  string id = 1;
  // Display name, from the hub's configuration.
  string name = 2;
  // Whether ownership has been claimed. An unowned hub accepts exactly one ClaimOwnership call.
  bool owned = 3;
  google.protobuf.Timestamp created_at = 4;
  // When ownership was claimed; unset while unowned.
  google.protobuf.Timestamp claimed_at = 5;
  // The user who claimed ownership; unset while unowned.
  string owner_user_id = 6;
  // Whether this hub is a demo (hub.yaml demo: true): its members, matches and stats are made up,
  // and a client says so wherever it shows them.
  bool demo = 7;
  // The member the owner nominated to take the hub over (#197), their name, and until when they
  // may accept; set only for the owner and the nominee, unset when there is no nomination.
  string pending_owner_user_id = 8;
  string pending_owner_name = 9;
  google.protobuf.Timestamp pending_owner_expires_at = 10;
}

message GetOrganizationRequest {}

message GetOrganizationResponse {
  Organization organization = 1;
}

message ClaimOwnershipRequest {
  // The one-time owner-claim token the hub printed to its log at start.
  string token = 1;
}

message ClaimOwnershipResponse {
  Organization organization = 1;
}

// ThemeTokens are one colour scheme's colours as CSS colours; an empty token means the default.
message ThemeTokens {
  string accent = 1;
  string background = 2;
  string foreground = 3;
  string muted = 4;
  string line = 5;
  string ok = 6;
  string err = 7;
}

// Theme is how the organization's pages look.
message Theme {
  ThemeTokens light = 1;
  ThemeTokens dark = 2;
  // A CSS font-family list; empty means the system font.
  string font = 3;
  // An https URL or a site-relative path, or empty.
  string logo_url = 4;
  string favicon_url = 5;
}

// NavLink is a navigation extension link.
message NavLink {
  string label = 1;
  string url = 2;
  // "header" or "footer"; empty means header.
  string placement = 3;
  // Empty for everyone, "owner" for the owner only.
  string role = 4;
}

// GameSettings are one game's settings, keyed by the game's id ("wardogs") in
// OrganizationSettings.games: its overlay on the theme and its links (gravel#66).
message GameSettings {
  GameTheme theme = 1;
  // Links shown on the game's pages, in the game's own navigation; at most 6. placement is
  // unused and must be empty.
  repeated NavLink nav = 2;
  // Image URLs (https) by map name as the game names it, a map in play or in its rotation
  // (War Dogs: "Ozeti", "Europe"): the server card's picture. A "map/lighting" key
  // ("Europe/DayClear") is the map in that lighting, tried before the plain name. At most 50.
  map<string, string> maps = 3;
  // The image (https) for a map maps doesn't name; empty is gravel's generic placeholder, served
  // by the hub, once the game has map images at all (maps or map_fallback set).
  string map_fallback = 4;
}

// GameTheme is a game's overlay on the organization's theme, applied to the game's pages: a
// server of the game, its moderation pages, and a board scoped to the game or one of its servers.
message GameTheme {
  // Only accent may be set; empty keeps the organization's.
  ThemeTokens light = 1;
  ThemeTokens dark = 2;
  // An image at the top of the game's pages: an https URL or a site-relative path, or empty.
  string banner_url = 3;
  // The banner's alternative text; empty when the banner is decorative.
  string banner_alt = 4;
}

// DiscordRoles are the roles that follow a member's linked identities; role sync adds and
// removes them.
message DiscordRoles {
  // The role for a member with any identity besides Discord; empty for none.
  string linked = 1;
  // A provider ("steam") to the role for a member who linked it.
  map<string, string> providers = 2;
}

// DiscordRecognition is a role earned once and kept: role sync adds it and never removes it.
message DiscordRecognition {
  string role = 1;
  // "first_members": the first count members by registration.
  string rule = 2;
  int32 count = 3;
}

// DiscordServerCard places one server's live status card in a channel: one message the bot edits
// in place.
message DiscordServerCard {
  // The server's id in the hub: "htg-wardogs-1".
  string server = 1;
  string channel = 2;
  // A line the host writes under the numbers: "Matches start at 20 players."
  string note = 3;
}

// DiscordSeedingHours is one weekly window of a seeding rule, in StatsSettings.timezone: the days
// it starts on ("mon" … "sun") and the time of day from and to ("18:00", "23:00", 24-hour). A to
// before from ends the next day; a rule's windows do not overlap.
message DiscordSeedingHours {
  repeated string days = 1;
  string from = 2;
  string to = 3;
}

// DiscordSeeding is when and where the bot calls for seeders for one server (ADR-0016): inside
// one of its windows, while the server is live and under below, at most once per cooldown. It
// pings role and nothing else. Outside every window nothing is posted.
message DiscordSeeding {
  // The server's id in the hub: "htg-wardogs-1"; one rule per server.
  string server = 1;
  // Where the call is posted.
  string channel = 2;
  // The opt-in seeder role the call pings; never the guild's id (@everyone).
  string role = 3;
  // The player count under which a call is due, 2 to 1000: the game's floor (War Dogs, 20).
  int32 below = 4;
  // The weekly windows; at most 14. None is a rule that never calls.
  repeated DiscordSeedingHours hours = 5;
  // The least time between two calls, a Go duration from 15m to 24h; empty is 2h.
  string cooldown = 6;
  // Each window's first call goes out at its start, while the server is under below, without
  // waiting out a cooldown left from before the window.
  bool call_at_start = 7;
  // A line appended to the call, at most 200 characters: how to join.
  string note = 8;
}

// DiscordSettings is the guild the bot works in (ADR-0008): the roles role sync maps and the
// channels the server cards live in. Ids are Discord snowflakes as strings; empty means the bot
// has nothing to do.
message DiscordSettings {
  string guild_id = 1;
  DiscordRoles roles = 2;
  repeated DiscordRecognition recognition = 3;
  repeated DiscordServerCard server_cards = 4;
  // The channel the bot posts every moderation action to (the audit log); empty is none.
  string mod_log = 5;
  // The seeding rules, at most 10 (the seeding module, ADR-0016).
  repeated DiscordSeeding seeding = 6;
  // The "who's playing now" card (the presence module, ADR-0017); unset is none.
  DiscordPresence presence = 7;
  // The session recaps, at most 10, one per server (the recaps module, ADR-0018).
  repeated DiscordRecap recaps = 8;
  // The go-live posts for the community's streamers (the streams module, ADR-0019); unset is none.
  DiscordStreams streams = 9;
  // The Steam news feeds (the news module); unset is none.
  DiscordNews news = 10;
  // The finished match results (the matchresults module, ADR-0024); unset is none.
  DiscordMatchResults match_results = 11;
}

// Match results: each finished series a server's match plugin reported, posted once in the
// channel.
message DiscordMatchResults {
  string channel = 1;
  // The servers whose results are posted, at most 50; none is every server.
  repeated string servers = 2;
}

// One game's Steam announcements posted into one channel.
message DiscordNewsFeed {
  // The game's Steam app id, as in its store URL: 730 for Counter-Strike 2.
  int32 app_id = 1;
  string channel = 2;
  // The game's name in each post's footer, at most 64 characters.
  string label = 3;
  // Steam's feed names to read; none is "steam_community_announcements".
  repeated string feeds = 4;
  // The posts' embed color as 0xRRGGBB; 0 is the bot's default.
  int32 color = 5;
}

// Steam news: each feed is one game's announcements into one channel, posted as the bot finds them.
message DiscordNews {
  // At most 20; a game once per channel.
  repeated DiscordNewsFeed feeds = 1;
}

// One streamer the bot watches.
message DiscordStreamer {
  // "twitch" or "kick".
  string platform = 1;
  // The channel's login on the platform, as in its URL: "hiddentoken" for twitch.tv/hiddentoken.
  string login = 2;
  // The name the post shows; the login when empty.
  string label = 3;
}

// Go-live posts: one message per stream in the channel, edited when the stream ends. Stream
// metadata only; nothing about viewers is read.
message DiscordStreams {
  string channel = 1;
  // A role the post pings when a stream starts (an opt-in role); empty pings no one.
  string role = 2;
  // A line the host writes under each post.
  string note = 3;
  // At most 10.
  repeated DiscordStreamer streamers = 4;
}

// After each of its weekly windows, the bot posts what the server's window held.
message DiscordRecap {
  // The server's id in the hub: "htg-wardogs-1"; one rule per server.
  string server = 1;
  // Where the recap is posted.
  string channel = 2;
  // The session's name in the post: "Wardogs Wednesday".
  string title = 3;
  // The sessions, as seeding's windows; none is a rule that never posts.
  repeated DiscordSeedingHours hours = 4;
  // The player count "minutes at or above" counts against, 0 to 1000; 0 leaves it out.
  int32 floor = 5;
  // A line appended to the post, at most 200 characters.
  string note = 6;
}

// One game on the presence card and how its Discord activity is recognized.
message DiscordPresenceGame {
  // The line's key, in the metrics: "wardogs".
  string game = 1;
  // What the card shows: "War Dogs".
  string label = 2;
  // Activity names as Discord shows them ("WARDOGS"), compared without regard to case.
  repeated string activities = 3;
  // The activities' Discord application ids.
  repeated string application_ids = 4;
}

// The "who's playing now" card: one message, edited when a count changes. Counts only; the hub
// and the bot keep no record of who played.
message DiscordPresence {
  string channel = 1;
  // A line the host writes under the counts.
  string note = 2;
  repeated DiscordPresenceGame games = 3;
}

// StatsSeason is a named window of matches: from (included) to to (excluded), dates
// ("2026-10-15") in StatsSettings.timezone. An empty game is every game.
message StatsSeason {
  string name = 1;
  string game = 2;
  string from = 3;
  string to = 4;
}

// StatsSettings is how the stats boards behave (ADR-0012).
message StatsSettings {
  // Boards and match lists for everyone; off, the owner and apps with stats:read only.
  bool public = 1;
  // Matches a player needs before a K/D board shows them; 0 is the default, 3.
  int32 min_matches = 2;
  // The IANA zone weeks, months and season dates are in; empty is UTC.
  string timezone = 3;
  repeated StatsSeason seasons = 4;
  // Months a player's per-match rows are kept before they roll up into monthly totals; 0 is the
  // default, 13.
  int32 raw_retention_months = 5;
}

// LocalAccountsSettings is who may register a username and password when the hub has local
// accounts on (hub.yaml auth.local.enabled; ADR-0026).
message LocalAccountsSettings {
  // "closed" (the default, empty: staff create accounts) or "open" (anyone may register).
  string registration = 1;
  // The shortest password in characters; 0 is the default, 12; else 8 to 128.
  int32 min_password_length = 2;
}

// OrganizationSettings is the Organization settings resource: every host-configurable knob in
// one document (theme and navigation, the Discord role mapping; token lifetimes and layout
// overrides join it with their features). Version is the document format.
message OrganizationSettings {
  int32 version = 1;
  Theme theme = 2;
  repeated NavLink nav = 3;
  // When the settings were last written; unset while the defaults apply.
  google.protobuf.Timestamp updated_at = 4;
  DiscordSettings discord = 5;
  StatsSettings stats = 6;
  // Per-game settings by game id; at most 20, each a game this hub ships.
  map<string, GameSettings> games = 7;
  LocalAccountsSettings local_accounts = 8;
  EventsSettings events = 9;
  // The notifiers, at most 20 (ADR-0028 §5). GetOrganizationSettings returns them only to a
  // caller who may change the settings; to anyone else the list is empty.
  repeated Notifier notifiers = 10;
}

// Notifier is one way the hub tells people what happened: the events its filter takes, carried
// to a webhook, an ntfy topic or email addresses. Its secret (a JSON webhook's signing key, a
// Discord webhook's URL, an ntfy access token) is in hub.yaml's notify.secrets, never here.
message Notifier {
  // Lower case letters, digits and hyphens, at most 32: its cursor, its secret's key, its metrics
  // label.
  string name = 1;
  // "webhook", "ntfy" or "email".
  string kind = 2;
  // Sends nothing and lets the log pass; TestNotifier still reaches it.
  bool disabled = 3;
  // A JSON webhook's endpoint, or an ntfy server (empty: https://ntfy.sh). https, or http to the
  // loopback interface.
  string url = 4;
  // A webhook's body: "json" (the default, signed) or "discord" (the URL is the secret).
  string flavour = 5;
  // An ntfy topic.
  string topic = 6;
  // An email notifier's addresses, at most 10.
  repeated string to = 7;
  NotifierEvents events = 8;
}

// NotifierEvents is which events a notifier takes; empty takes every warning and critical event.
message NotifierEvents {
  // Kinds ("server.unreachable") or groups ("server"); empty is every kind.
  repeated string kinds = 1;
  // "info", "notice", "warning" or "critical"; empty is "warning".
  string min_severity = 2;
  // Only these games' events, or these servers'; an event about no server passes neither.
  repeated string games = 3;
  repeated string servers = 4;
}

// EventsSettings is how long the events log keeps what it holds (ADR-0028).
message EventsSettings {
  // Days an event is kept; 0 is the default, 400; else 30 to 3650.
  int32 retention_days = 1;
}

// Event is one entry of the events log (ADR-0028): what the hub did, who did it, to what.
message Event {
  int64 id = 1;
  google.protobuf.Timestamp at = 2;
  // A kind from the registry: "host.running", "moderation.ban", "role.granted"…
  string kind = 3;
  // "info", "notice", "warning" or "critical": fixed per kind.
  string severity = 4;
  string actor_user_id = 5;
  string actor_app_id = 6;
  // The member an app said it acted for.
  string on_behalf_provider = 7;
  string on_behalf_subject = 8;
  string server_id = 9;
  string game_id = 10;
  // The member the event is about (a grant, a link).
  string subject_user_id = 11;
  // One line a person reads.
  string summary = 12;
  // A few words more, by name; never a secret, an address or a SteamID.
  map<string, string> detail = 13;
  string request_id = 14;
  // Who acted, by name as the hub has them now (a member's display name, an app's name), read
  // with the event; empty when nobody did (the hub itself) or they are gone.
  string actor_name = 15;
}

message ListEventsRequest {
  // The events after this id, oldest first: following the log. 0 reads the newest first.
  int64 after_id = 1;
  // With after_id 0, the events before this id, newest first: paging back.
  int64 before_id = 2;
  // At most 500; 0 is 100.
  int32 limit = 3;
  // Kinds ("host.running") or groups ("host"); empty is every kind.
  repeated string kinds = 4;
  // "info" (or empty), "notice", "warning" or "critical": this severity and above.
  string min_severity = 5;
  // One server's events.
  string server_id = 6;
  // One game's events (#193). A caller holding events:read for some games gets the intersection.
  string game_id = 7;
  // The events one member (a user id) or one app (an app id) did; a member acting through an app
  // matches both.
  string actor_user_id = 8;
  string actor_app_id = 9;
}

message ListEventsResponse {
  repeated Event events = 1;
  // Pass as after_id next: the newest id returned, or the request's after_id when none came.
  int64 next_after_id = 2;
  // The newest id in the log when it was read; 0 for an empty log.
  int64 head_id = 3;
  // Pass as before_id to page further back; 0 when there is nothing older.
  int64 next_before_id = 4;
}

message ListEventKindsRequest {}

// EventKind is one kind of event the hub records.
message EventKind {
  // "server.down".
  string name = 1;
  // Its family, the part before the dot: "server". ListEventsRequest.kinds takes either.
  string group = 2;
  // "info", "notice", "warning" or "critical": fixed per kind.
  string severity = 3;
  // What it means, in a line.
  string about = 4;
}

message ListEventKindsResponse {
  // In the registry's order: grouped, a family's kinds together.
  repeated EventKind kinds = 1;
}

message NominateOwnerRequest {
  // The member to hand the hub to: a member of this hub, not the owner.
  string user_id = 1;
}

message NominateOwnerResponse {
  Organization organization = 1;
}

message AcceptOwnershipRequest {}

message AcceptOwnershipResponse {
  Organization organization = 1;
}

message CancelOwnershipTransferRequest {}

message CancelOwnershipTransferResponse {
  Organization organization = 1;
}

message GetOrganizationSettingsRequest {}

message GetOrganizationSettingsResponse {
  OrganizationSettings settings = 1;
}

message UpdateOrganizationSettingsRequest {
  // The whole document; omitted tokens mean the default, an omitted nav means no links.
  OrganizationSettings settings = 1;
}

message UpdateOrganizationSettingsResponse {
  OrganizationSettings settings = 1;
}

message TestNotifierRequest {
  // A notifier's name in the settings; a disabled one is tested too.
  string name = 1;
}

message TestNotifierResponse {
  // Whether the notifier delivered the test event.
  bool delivered = 1;
  // Why it did not, without secrets; empty when it did.
  string error = 2;
}

// OrganizationService reads the built-in organization and claims its ownership once.
service OrganizationService {
  rpc GetOrganization(GetOrganizationRequest) returns (GetOrganizationResponse);
  // ClaimOwnership consumes the one-time owner-claim token and makes the caller the owner. It
  // needs a session (unauthenticated otherwise) and succeeds once per hub: the token is
  // single-use, expires, and no token exists once the hub is owned.
  rpc ClaimOwnership(ClaimOwnershipRequest) returns (ClaimOwnershipResponse);
  // NominateOwner names the member who may take the hub over, for 7 days, replacing any earlier
  // nomination (ADR-0027 §6): org:transfer, the owner in person. invalid_argument for the owner
  // themselves, not_found for someone who isn't a member.
  rpc NominateOwner(NominateOwnerRequest) returns (NominateOwnerResponse);
  // AcceptOwnership makes the nominee the owner, and the old owner an admin, in one transaction:
  // the nominee in person. failed_precondition when there is no unexpired nomination for them.
  rpc AcceptOwnership(AcceptOwnershipRequest) returns (AcceptOwnershipResponse);
  // CancelOwnershipTransfer ends the nomination: the owner cancels it, or the nominee declines
  // it, in person. failed_precondition when there is none.
  rpc CancelOwnershipTransfer(CancelOwnershipTransferRequest) returns (CancelOwnershipTransferResponse);
  // GetOrganizationSettings returns the settings; public, because the pages render the theme
  // before anyone logs in, and the document holds no credential. The notifiers are left out
  // unless the caller holds settings:write.
  rpc GetOrganizationSettings(GetOrganizationSettingsRequest) returns (GetOrganizationSettingsResponse);
  // UpdateOrganizationSettings replaces the settings. The owner only; invalid_argument names
  // every invalid field.
  rpc UpdateOrganizationSettings(UpdateOrganizationSettingsRequest) returns (UpdateOrganizationSettingsResponse);
  // ListEvents reads the events log by cursor (ADR-0028): events:read, and a caller holding it
  // for some games sees those games' events only.
  rpc ListEvents(ListEventsRequest) returns (ListEventsResponse);
  // ListEventKinds is the registry of event kinds (ADR-0028), for a filter: events:read anywhere.
  rpc ListEventKinds(ListEventKindsRequest) returns (ListEventKindsResponse);
  // TestNotifier sends a test event (kind notifier.test, never in the log) to a notifier and says
  // whether it was delivered: settings:write. not_found for a name the settings don't have.
  rpc TestNotifier(TestNotifierRequest) returns (TestNotifierResponse);
}
