# Hub configuration for the compose stack. Copy and edit for a real deployment; the reference is
# docs/hub.md. No secrets here: the database URL is the podman secret gravel-db-url, mounted under /run/secrets.
version: 1

organization:
  name: Local gravel

server:
  listen: 0.0.0.0:8080          # published on 127.0.0.1 by compose.yaml
  internal_listen: 0.0.0.0:9090 # /metrics and pprof; published on 127.0.0.1 only

database:
  url_file: /run/secrets/gravel-db-url
  migrate: auto

log:
  level: info
  format: json

# The backup job's status file (compose mounts the gravel-backup volume; docs/hub.md "Backups").
backup:
  status_file: /var/lib/gravel/backup/status.json

# Login (docs/hub.md "Login"). Disabled here so the stack runs with no Discord application; to
# enable it, register http://127.0.0.1:8080/auth/discord/callback on your Discord app, load the
# secrets (deploy/README.md) and turn the providers on.
auth:
  base_url: http://127.0.0.1:8080
  discord:
    enabled: false
    client_id: ""
    client_secret_file: /run/secrets/gravel-discord-client-secret
  steam:
    enabled: false
    api_key_file: /run/secrets/gravel-steam-api-key
