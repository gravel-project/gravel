# WAL archiving to object storage with WAL-G (ADR-0006). Edit the prefix and endpoint for your
# bucket; the credentials are the podman secret gravel-backup-credentials (an AWS shared
# credentials file). archive_timeout bounds how far the archive trails the database when it is idle.
[Container]
Image=ghcr.io/gravel-project/gravel-postgres@sha256:4a68eda56a109a795bb684d3c6e8a16a5753c8be4a5268ba80d1fd4ff6fce2d5
# %%p, not %p: systemd expands specifiers in the generated ExecStart, so the percent is doubled
# to reach Postgres as %p (the WAL file's path).
Exec=postgres -c archive_mode=on -c archive_command='wal-g wal-push %%p' -c archive_timeout=60
Environment=WALG_S3_PREFIX=s3://my-bucket/gravel
Environment=AWS_ENDPOINT=https://ACCOUNT_ID.r2.cloudflarestorage.com
Environment=AWS_REGION=auto
Environment=AWS_S3_FORCE_PATH_STYLE=true
Environment=AWS_SHARED_CREDENTIALS_FILE=/run/secrets/gravel-backup-credentials
Secret=gravel-backup-credentials
