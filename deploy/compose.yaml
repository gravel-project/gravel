# Local hub: `make up` builds the image with ko, loads the dev secrets into podman's secret store
# (deploy/dev-secrets.sh) and starts this stack with podman compose. Secrets are never bind-mounted:
# podman copies them into each container's tmpfs, exactly as the quadlet units in quadlet/ do.
name: gravel

services:
  postgres:
    # Postgres 17 plus WAL-G (deploy/postgres), archiving every WAL segment to the local store
    # below, as production does to object storage (ADR-0006). `make backup` takes a base backup.
    image: localhost/gravel-postgres:dev
    pull_policy: never
    command: ["postgres", "-c", "archive_mode=on", "-c", "archive_command=wal-g wal-push %p", "-c", "archive_timeout=60"]
    environment:
      POSTGRES_USER: gravel
      POSTGRES_DB: gravel
      POSTGRES_PASSWORD_FILE: /run/secrets/gravel-db-password
      WALG_S3_PREFIX: s3://gravel/hub
      AWS_ENDPOINT: http://store:7070
      AWS_REGION: us-east-1
      AWS_S3_FORCE_PATH_STYLE: "true"
      AWS_SHARED_CREDENTIALS_FILE: /run/secrets/gravel-backup-credentials
    secrets:
      - gravel-db-password
      - gravel-backup-credentials
    volumes:
      - gravel-postgres:/var/lib/postgresql/data
    depends_on:
      - store
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gravel -d gravel"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  store:
    # A local S3-compatible store for the development stack's backups (a directory per bucket);
    # production uses a real bucket. The root key pair is the dev credentials file's.
    image: ghcr.io/versity/versitygw:v1.8.0
    command: ["posix", "/data"]
    environment: # versitygw takes its root key from the environment only; make exports it from deploy/secrets/store-secret
      ROOT_ACCESS_KEY: gravel
      ROOT_SECRET_KEY: ${GRAVEL_STORE_SECRET:-unset}
    volumes:
      - ./store:/data:Z
    restart: unless-stopped

  backup:
    # `make backup`: one base backup into the store, then the status file the hub reads.
    image: localhost/gravel-postgres:dev
    pull_policy: never
    profiles: ["tools"]
    entrypoint: ["gravel-backup"]
    environment:
      PGHOST: postgres
      PGUSER: gravel
      PGDATABASE: gravel
      PGPASSFILE: /run/secrets/gravel-backup-pgpass
      WALG_S3_PREFIX: s3://gravel/hub
      AWS_ENDPOINT: http://store:7070
      AWS_REGION: us-east-1
      AWS_S3_FORCE_PATH_STYLE: "true"
      AWS_SHARED_CREDENTIALS_FILE: /run/secrets/gravel-backup-credentials
      GRAVEL_BACKUP_RETAIN_FULL: "30"
    secrets:
      - gravel-backup-credentials
      - source: gravel-backup-pgpass
        mode: 0400
    volumes:
      - gravel-postgres:/var/lib/postgresql/data:ro
      - gravel-backup:/var/lib/gravel/backup
    depends_on:
      - postgres

  hub:
    image: localhost/gravel-hub:dev
    pull_policy: never
    depends_on:
      - postgres # the hub itself waits for the database (database.connect_timeout)
    command: ["serve", "--config", "/etc/gravel/hub.yaml"]
    secrets:
      - gravel-db-url
      # With login enabled in hub.yaml (deploy/README.md):
      # - gravel-discord-client-secret
      # - gravel-steam-api-key
    volumes:
      - ./hub.yaml:/etc/gravel/hub.yaml:ro,Z
      - gravel-backup:/var/lib/gravel/backup:ro
    ports: # host ports: GRAVEL_PORT / GRAVEL_INTERNAL_PORT (make up exports them)
      - "127.0.0.1:${GRAVEL_PORT:-8080}:8080"
      - "127.0.0.1:${GRAVEL_INTERNAL_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD", "/ko-app/gravel-hub", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped

  # The Discord bot (docs/bot.md), opt-in: `podman compose --profile bot up`. Needs deploy/bot.yaml
  # filled in and the two secrets below created (make bot-register prints the hub credentials).
  bot:
    image: localhost/gravel-bot:dev
    profiles: ["bot"]
    depends_on: [hub]
    ports: ["127.0.0.1:8081:8081", "127.0.0.1:9091:9091"]
    volumes: ["./bot.yaml:/etc/gravel/bot.yaml:ro,Z"]
    command: ["serve", "--config", "/etc/gravel/bot.yaml"]
    secrets:
      - gravel-bot-discord-token
      - gravel-bot-hub-client-secret

  # Prometheus and Grafana with gravel's dashboards (ADR-0009), opt-in: `make up-observability`.
  # The images are the ones deploy/quadlet/observability/ pins; Grafana logs in as admin with
  # the dev secret gravel-grafana-admin-password (deploy/secrets/grafana-admin-password).
  prometheus:
    image: quay.io/prometheus/prometheus@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e # v3.15.0; Quay, not Docker Hub (#79)
    profiles: ["observability"]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=30d", "--storage.tsdb.retention.size=2GB"]
    volumes:
      - ./observability/prometheus/compose.yml:/etc/prometheus/prometheus.yml:ro,Z
      - gravel-prometheus:/prometheus
    ports: ["127.0.0.1:${GRAVEL_PROMETHEUS_PORT:-9092}:9090"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped

  grafana:
    image: mirror.gcr.io/grafana/grafana@sha256:b28bae15e219c998fb0e0424ed724930cc61b1f61fb404d47c862f9a23f9e572 # 13.2.3; Google's cache until ghcr.io/gravel-project/mirror/grafana is public (#79)
    profiles: ["observability"]
    depends_on: [prometheus]
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/gravel-grafana-admin-password
      GRAVEL_PROMETHEUS_URL: http://prometheus:9090
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    secrets:
      - gravel-grafana-admin-password
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro,Z
      - ./observability/grafana/dashboards:/etc/grafana/dashboards/gravel:ro,Z
      - gravel-grafana:/var/lib/grafana
    ports: ["127.0.0.1:${GRAVEL_GRAFANA_PORT:-3000}:3000"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped

secrets:
  gravel-grafana-admin-password:
    external: true
  gravel-bot-discord-token:
    external: true
  gravel-bot-hub-client-secret:
    external: true
  gravel-db-password:
    external: true
  gravel-db-url:
    external: true
  # gravel-discord-client-secret:
  #   external: true
  # gravel-steam-api-key:
  #   external: true
  gravel-backup-credentials:
    external: true
  gravel-backup-pgpass:
    external: true

volumes:
  gravel-postgres: {}
  gravel-backup: {}
  gravel-prometheus: {}
  gravel-grafana: {}
