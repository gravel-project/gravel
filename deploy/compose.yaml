# Local hub: `make up` builds the image with ko, loads the dev secrets into podman's secret store
# (deploy/dev-secrets.sh) and starts this stack with podman compose. Secrets are never bind-mounted:
# podman copies them into each container's tmpfs, exactly as the quadlet units in quadlet/ do.
name: gravel

services:
  postgres:
    # Postgres 17 plus WAL-G (deploy/postgres), archiving every WAL segment to the local store
    # below, as production does to object storage (ADR-0006). `make backup` takes a base backup.
    image: localhost/gravel-postgres:dev
    pull_policy: never
    command: ["postgres", "-c", "archive_mode=on", "-c", "archive_command=wal-g wal-push %p", "-c", "archive_timeout=60"]
    environment:
      POSTGRES_USER: gravel
      POSTGRES_DB: gravel
      POSTGRES_PASSWORD_FILE: /run/secrets/gravel-db-password
      WALG_S3_PREFIX: s3://gravel/hub
      AWS_ENDPOINT: http://store:7070
      AWS_REGION: us-east-1
      AWS_S3_FORCE_PATH_STYLE: "true"
      AWS_SHARED_CREDENTIALS_FILE: /run/secrets/gravel-backup-credentials
    secrets:
      - gravel-db-password
      - gravel-backup-credentials
    volumes:
      - gravel-postgres:/var/lib/postgresql/data
    depends_on:
      - store
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gravel -d gravel"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  store:
    # A local S3-compatible store for the development stack's backups (a directory per bucket);
    # production uses a real bucket. The root key pair is the dev credentials file's.
    image: ghcr.io/versity/versitygw:v1.8.0
    command: ["posix", "/data"]
    environment: # versitygw takes its root key from the environment only; make exports it from deploy/secrets/store-secret
      ROOT_ACCESS_KEY: gravel
      ROOT_SECRET_KEY: ${GRAVEL_STORE_SECRET:-unset}
    volumes:
      - ./store:/data:Z
    restart: unless-stopped

  backup:
    # `make backup`: one base backup into the store, then the status file the hub reads.
    image: localhost/gravel-postgres:dev
    pull_policy: never
    profiles: ["tools"]
    entrypoint: ["gravel-backup"]
    environment:
      PGHOST: postgres
      PGUSER: gravel
      PGDATABASE: gravel
      PGPASSFILE: /run/secrets/gravel-backup-pgpass
      WALG_S3_PREFIX: s3://gravel/hub
      AWS_ENDPOINT: http://store:7070
      AWS_REGION: us-east-1
      AWS_S3_FORCE_PATH_STYLE: "true"
      AWS_SHARED_CREDENTIALS_FILE: /run/secrets/gravel-backup-credentials
      GRAVEL_BACKUP_RETAIN_FULL: "30"
    secrets:
      - gravel-backup-credentials
      - source: gravel-backup-pgpass
        mode: 0400
    volumes:
      - gravel-postgres:/var/lib/postgresql/data:ro
      - gravel-backup:/var/lib/gravel/backup
    depends_on:
      - postgres

  hub:
    image: localhost/gravel-hub:dev
    pull_policy: never
    depends_on:
      - postgres # the hub itself waits for the database (database.connect_timeout)
    command: ["serve", "--config", "/etc/gravel/hub.yaml"]
    secrets:
      - gravel-db-url
      # With login enabled in hub.yaml (deploy/README.md):
      # - gravel-discord-client-secret
      # - gravel-steam-api-key
    volumes:
      - ./hub.yaml:/etc/gravel/hub.yaml:ro,Z
      - gravel-backup:/var/lib/gravel/backup:ro
    ports: # host ports: GRAVEL_PORT / GRAVEL_INTERNAL_PORT (make up exports them)
      - "127.0.0.1:${GRAVEL_PORT:-8080}:8080"
      - "127.0.0.1:${GRAVEL_INTERNAL_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD", "/ko-app/gravel-hub", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped

secrets:
  gravel-db-password:
    external: true
  gravel-db-url:
    external: true
  # gravel-discord-client-secret:
  #   external: true
  # gravel-steam-api-key:
  #   external: true
  gravel-backup-credentials:
    external: true
  gravel-backup-pgpass:
    external: true

volumes:
  gravel-postgres: {}
  gravel-backup: {}
